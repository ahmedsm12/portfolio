<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>لوحة PDF التفاعلية</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body { height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: #0f1115; color: #eee; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  :root { --tb-btn-size: 38px; --sidebar-effective-w: 0px; --thumb-aspect: 0.75; }

  /* ===================== SIDEBAR ===================== */
  #thumbnailSidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    width: 180px;
    background: rgba(20,24,32,.97);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-right: 1px solid rgba(255,255,255,.08);
    display: flex; flex-direction: column;
    z-index: 1100;
    transform: translateX(0);
    transition: transform .22s ease;
    box-shadow: 4px 0 20px rgba(0,0,0,.35);
  }
  #thumbnailSidebar.collapsed { transform: translateX(-100%); }
  .sidebar-header {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; font-weight: 700; color: #b8c0cc;
    flex-shrink: 0; letter-spacing: .3px;
  }
  .sidebar-header #btnToggleSidebar {
    width: 24px; height: 24px; border-radius: 6px;
    background: rgba(255,255,255,.06); border: none;
    color: #b8c0cc; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    padding: 0; touch-action: manipulation;
  }
  .sidebar-header #btnToggleSidebar:hover { background: rgba(239,68,68,.35); color: #fff; }

  .sidebar-thumbs {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 10px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.18) transparent;
  }
  .sidebar-thumbs::-webkit-scrollbar { width: 5px; }
  .sidebar-thumbs::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 3px; }

  .thumbs-empty { text-align: center; color: #6b7280; font-size: 12px; padding: 30px 10px; }

  /* ⭐ الثامبنيل يعتمد على نسبة عرض/ارتفاع الصفحة الحقيقية */
  .thumb-item {
    position: relative;
    margin-bottom: 10px;
    border: 2px solid transparent;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
    transition: border-color .15s, transform .1s, box-shadow .15s;
    aspect-ratio: var(--thumb-aspect, 0.75);
    display: flex; align-items: center; justify-content: center;
    /* حالة skeleton أثناء التحميل */
    background-size: cover;
  }
  .thumb-item::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,.06) 50%,
      rgba(255,255,255,0) 100%);
    background-size: 200% 100%;
    animation: thumbShimmer 1.4s infinite;
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s;
  }
  .thumb-item.loading::before { opacity: 1; }
  @keyframes thumbShimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .thumb-item.loaded::before { opacity: 0; animation: none; }

  .thumb-item:hover { border-color: rgba(74,126,255,.5); transform: scale(1.02); }
  .thumb-item:active { transform: scale(.99); }
  .thumb-item.active {
    border-color: #4a7eff;
    box-shadow: 0 0 0 2px rgba(74,126,255,.35), 0 4px 12px rgba(74,126,255,.25);
  }
  .thumb-item img {
    width: 100%; height: 100%; display: block;
    background: #fff; object-fit: contain;
    opacity: 0; transition: opacity .2s ease;
  }
  .thumb-item.loaded img { opacity: 1; }
  .thumb-num {
    position: absolute; bottom: 4px; right: 4px;
    background: rgba(0,0,0,.75); color: #fff;
    font-size: 10px; padding: 2px 6px;
    border-radius: 4px; font-weight: 700;
    min-width: 18px; text-align: center;
    z-index: 2;
  }
  .thumb-spinner {
    position: absolute; width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.12);
    border-top-color: #4a7eff;
    animation: spin .8s linear infinite;
    z-index: 1;
  }
  .thumb-item.loaded .thumb-spinner { display: none; }

  /* ===================== BOTTOM BAR ===================== */
  #bottomBar {
    display: flex; align-items: center; justify-content: center;
    gap: 4px; padding: 8px;
    border-top: 1px solid rgba(255,255,255,.08);
    flex-shrink: 0;
    direction: ltr;
  }
  #bottomBar button {
    flex: 1; padding: 8px 4px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 8px; color: #d4d9e2;
    font-family: inherit; font-size: 12px; font-weight: 600;
    cursor: pointer; touch-action: manipulation;
    white-space: nowrap;
    transition: background .15s, color .15s;
  }
  #bottomBar button:hover:not(:disabled) { background: rgba(255,255,255,.13); }
  #bottomBar button:disabled { opacity: .3; cursor: not-allowed; }
  #pageIndicator {
    min-width: 44px; text-align: center;
    font-variant-numeric: tabular-nums;
    color: #b8c0cc; font-size: 11px;
    padding: 0 4px; font-weight: 600;
  }
  #pageIndicator:empty { display: none; }

  /* ===================== RESIZE HANDLE ===================== */
  .sidebar-resize {
    position: absolute; right: -4px; top: 0; bottom: 0;
    width: 8px; cursor: col-resize; z-index: 10;
    background: transparent; touch-action: none;
  }
  .sidebar-resize::after {
    content: ''; position: absolute;
    left: 3px; top: 50%; transform: translateY(-50%);
    width: 2px; height: 40px;
    background: rgba(255,255,255,.15); border-radius: 2px;
    transition: background .15s;
  }
  .sidebar-resize:hover::after,
  .sidebar-resize.dragging::after { background: #4a7eff; }

  /* ===================== SHOW SIDEBAR BTN ===================== */
  #btnShowSidebar {
    position: fixed; left: 10px; top: 10px;
    width: 42px; height: 42px; border-radius: 10px;
    background: rgba(28,32,40,.94);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.08);
    color: #d4d9e2; font-size: 20px;
    cursor: pointer; z-index: 1090;
    display: none; align-items: center; justify-content: center;
    touch-action: manipulation;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    transition: background .15s;
  }
  #btnShowSidebar.show { display: flex; }
  #btnShowSidebar:hover { background: rgba(40,48,60,.98); }

  /* ===================== STAGE ===================== */
  #stageWrapper {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: #0f1115;
    padding-left: var(--sidebar-effective-w, 0px);
    transition: padding-left .22s ease;
  }
  #stageWrapper.no-transition { transition: none; }

  #stage { position: relative; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.7); overflow: hidden; touch-action: none; border-radius: 4px; transform-origin: 0 0; }
  #stageContent { position: absolute; inset: 0; }
  #stageContent > * { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #pdfCanvas { z-index: 1; pointer-events: none; }
  #svgLayer  { z-index: 2; pointer-events: none; }
  #embedLayer { z-index: 3; pointer-events: none; }
  #videoLayer { z-index: 4; pointer-events: none; }
  #interactiveLayer { z-index: 5; pointer-events: none; }
  #transientCanvas { z-index: 6; pointer-events: none; }
  #laserCanvas { z-index: 7; pointer-events: none; }

  #stage[data-tool="hand"] { cursor: grab; }
  #stage[data-tool="hand"].dragging { cursor: grabbing; }
  #stage[data-tool="rect"], #stage[data-tool="circle"], #stage[data-tool="line"] { cursor: crosshair; }
  #svgLayer [data-annot] { pointer-events: none; }
  #stage[data-tool="select"] #svgLayer [data-annot] { pointer-events: auto; cursor: move; }
  .annot { vector-effect: non-scaling-stroke; }
  .selection-outline { fill: none; stroke: #4a7eff; stroke-width: 1.5; stroke-dasharray: 5 3; vector-effect: non-scaling-stroke; pointer-events: none; }
  .handle { fill: #fff; stroke: #4a7eff; stroke-width: 2; vector-effect: non-scaling-stroke; cursor: pointer; pointer-events: auto; }
  .handle.nw, .handle.se { cursor: nwse-resize; }
  .handle.ne, .handle.sw { cursor: nesw-resize; }

  #embedLayer .embed { position: absolute; pointer-events: auto; display: flex; flex-direction: column; background: #fff; border: 1px solid #4a7eff; border-radius: 3px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  #embedLayer .embed.selected { box-shadow: 0 0 0 2px rgba(74,126,255,.35), 0 2px 8px rgba(0,0,0,.2); }
  .embed-header { height: 22px; background: #4a7eff; color: #fff; padding: 0 5px; font-size: 10px; display: flex; justify-content: space-between; align-items: center; gap: 4px; cursor: move; user-select: none; flex-shrink: 0; opacity: 0; transition: opacity .15s; }
  #stage[data-tool="select"] .embed:hover .embed-header,
  #stage[data-tool="select"] .embed.selected .embed-header { opacity: 1; }
  #stage:not([data-tool="select"]) .embed-header { pointer-events: none; }
  .embed-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: left; font-weight: 500; }
  .embed-close { background: rgba(0,0,0,.25); border: none; color: #fff; width: 18px; height: 18px; border-radius: 3px; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; display: flex; align-items: center; justify-content: center; }
  .embed iframe { flex: 1; border: none; background: #fff; width: 100%; min-height: 0; display: block; }
  #stage:not([data-tool="select"]) .embed iframe { pointer-events: none; }
  .embed-resize { position: absolute; width: 14px; height: 14px; background: #4a7eff; border: 2px solid #fff; border-radius: 50%; bottom: -7px; right: -7px; cursor: nwse-resize; z-index: 10; display: none; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #stage[data-tool="select"] .embed.selected .embed-resize { display: block; }

  #videoLayer .media-obj { position: absolute; pointer-events: auto; display: flex; flex-direction: column; background: #000; border: 1px solid #4a7eff; border-radius: 6px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  #videoLayer .media-obj.selected { box-shadow: 0 0 0 3px rgba(74,126,255,.4), 0 6px 20px rgba(0,0,0,.4); }
  .media-obj .media-header { height: 24px; background: linear-gradient(180deg, #4a7eff, #3b6ee0); color: #fff; padding: 0 6px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; gap: 6px; cursor: move; user-select: none; flex-shrink: 0; opacity: 0; transition: opacity .15s; }
  #stage[data-tool="select"] .media-obj:hover .media-header,
  #stage[data-tool="select"] .media-obj.selected .media-header { opacity: 1; }
  #stage:not([data-tool="select"]) .media-header { pointer-events: none; }
  .media-obj .media-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: left; font-weight: 500; }
  .media-obj .media-close { background: rgba(0,0,0,.25); border: none; color: #fff; width: 18px; height: 18px; border-radius: 3px; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; display: flex; align-items: center; justify-content: center; }
  .media-obj .media-content { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
  .media-obj .media-content video,
  .media-obj .media-content img { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; display: block; }
  .media-obj .media-content img { background: #fff; }
  #stage:not([data-tool="select"]) .media-obj .media-content video,
  #stage:not([data-tool="select"]) .media-obj .media-content img { pointer-events: none; }
  .media-obj .media-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 68px; height: 68px; border-radius: 50%; background: rgba(0,0,0,.55); border: 2.5px solid rgba(255,255,255,.9); color: #fff; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0 0 0 5px; z-index: 5; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 6px 22px rgba(0,0,0,.4); line-height: 1; }
  .media-obj .media-play-btn.hidden { opacity: 0; pointer-events: none; }
  .media-obj .media-resize { position: absolute; width: 14px; height: 14px; background: #4a7eff; border: 2px solid #fff; border-radius: 50%; bottom: -7px; right: -7px; cursor: nwse-resize; z-index: 10; display: none; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #stage[data-tool="select"] .media-obj.selected .media-resize { display: block; }
  .media-obj.media-error::after { content: '⚠ تعذّر تحميل الملف'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(0,0,0,.85); font-size: 12px; padding: 20px; text-align: center; }

  .pdf-interactive-btn {
    position: absolute; display: flex; align-items: center; justify-content: center;
    padding: 6px 14px; font-family: inherit; font-weight: 600;
    text-align: center; line-height: 1.25; border-radius: 12px;
    cursor: default; pointer-events: none;
    user-select: none; -webkit-user-select: none;
    overflow: hidden; white-space: nowrap; box-sizing: border-box;
    transition: box-shadow .25s, transform .15s, background .2s, border-color .2s;
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  #stage[data-tool="hand"] .pdf-interactive-btn { pointer-events: auto; cursor: pointer; }
  #stage[data-tool="select"] .pdf-interactive-btn { pointer-events: auto; cursor: move; }
  #stage[data-tool="select"] .pdf-interactive-btn.selected {
    box-shadow: 0 0 0 2px #4a7eff, 0 0 0 5px rgba(74,126,255,.25);
  }
  .pdf-interactive-btn .pdf-interactive-btn-text {
    pointer-events: none; display: inline-flex;
    align-items: center; justify-content: center;
    gap: 2px; flex-wrap: wrap; max-width: 100%;
  }
  .pdf-interactive-btn .pdf-interactive-btn-text .katex { font-size: 1.05em; }
  .pdf-interactive-btn .pdf-interactive-btn-text .katex-display { margin: 0; }
  .pdf-interactive-btn .pdf-interactive-btn-resize {
    position: absolute; bottom: -6px; right: -6px;
    width: 12px; height: 12px; border-radius: 50%;
    background: #4a7eff; border: 2px solid #fff;
    cursor: nwse-resize; z-index: 10;
    display: none; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  #stage[data-tool="select"] .pdf-interactive-btn.selected .pdf-interactive-btn-resize { display: block; }

  .pdf-interactive-btn.correct-feedback { animation: btnCorrectFeedback 1s ease-out; }
  @keyframes btnCorrectFeedback {
    0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.9), 0 0 0 0 rgba(34,197,94,0.5); transform: scale(1); }
    35%  { box-shadow: 0 0 0 12px rgba(34,197,94,0.45), 0 0 36px 12px rgba(34,197,94,0.7); transform: scale(1.07); }
    70%  { box-shadow: 0 0 0 18px rgba(34,197,94,0.15), 0 0 24px 8px rgba(34,197,94,0.4); transform: scale(1.02); }
    100% { box-shadow: 0 0 0 22px rgba(34,197,94,0), 0 0 0 0 rgba(34,197,94,0); transform: scale(1); }
  }
  .pdf-interactive-btn.wrong-feedback { animation: btnWrongFeedback 0.7s ease-out; }
  @keyframes btnWrongFeedback {
    0%, 100% { transform: translateX(0); box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    12% { transform: translateX(-7px); box-shadow: 0 0 0 6px rgba(239,68,68,0.55); }
    28% { transform: translateX(7px);  box-shadow: 0 0 0 10px rgba(239,68,68,0.45); }
    45% { transform: translateX(-5px); box-shadow: 0 0 0 12px rgba(239,68,68,0.35); }
    62% { transform: translateX(5px);  box-shadow: 0 0 0 14px rgba(239,68,68,0.22); }
    82% { transform: translateX(-2px); box-shadow: 0 0 0 8px rgba(239,68,68,0.08); }
  }

  #toolbar { position: fixed; right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 3px; padding: 5px 4px; background: rgba(28,32,40,.94); backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.5); z-index: 1000; touch-action: manipulation; }
  #toolbar button { width: var(--tb-btn-size); height: var(--tb-btn-size); display: flex; align-items: center; justify-content: center; background: transparent; color: #d4d9e2; border: none; border-radius: 10px; font-size: calc(var(--tb-btn-size) * 0.45); cursor: pointer; transition: background .14s, color .14s; position: relative; flex-shrink: 0; touch-action: manipulation; }
  #toolbar button:hover { background: rgba(255,255,255,.09); }
  #toolbar button.active { background: #4a7eff; color: #fff; }
  #toolbar button:disabled { opacity: .3; cursor: not-allowed; }
  #toolbar .tb-divider { height: 1px; background: rgba(255,255,255,.08); margin: 2px 6px; flex-shrink: 0; }
  #toolbar button[data-tool="pen"]::after,
  #toolbar button[data-tool="highlighter"]::after,
  #toolbar button[data-tool="laser"]::after { content: ''; position: absolute; bottom: 3px; right: 4px; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #1c2028; background: var(--indicator, transparent); }
  #toolbar button svg { width: calc(var(--tb-btn-size) * 0.5); height: calc(var(--tb-btn-size) * 0.5); fill: currentColor; display: block; }

  #submenu { position: fixed; right: 58px; display: none; flex-direction: column; min-width: 88px; padding: 6px 5px; background: rgba(28,32,40,.97); backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.5); z-index: 1001; touch-action: manipulation; max-height: 92vh; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
  #submenu::-webkit-scrollbar { width: 4px; }
  #submenu::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 2px; }
  #submenu.show { display: flex; }
  .sub-label { font-size: 9px; color: #8a94a6; text-align: center; padding: 3px 0 4px; letter-spacing: .5px; font-weight: 600; }
  .sub-section { padding: 4px 0; }
  .sub-section + .sub-section { border-top: 1px solid rgba(255,255,255,.06); }
  .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 0 3px; }
  .color-btn { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center; margin: 2px auto; touch-action: manipulation; }
  .color-btn .swatch { width: 100%; height: 100%; border-radius: 50%; border: 1px solid rgba(0,0,0,.3); }
  .color-btn.active { border-color: #4a7eff; }
  .color-btn.transparent .swatch { background-image: linear-gradient(45deg, #666 25%, transparent 25%), linear-gradient(-45deg, #666 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #666 75%), linear-gradient(-45deg, transparent 75%, #666 75%); background-size: 8px 8px; background-position: 0 0, 0 4px, 4px -4px, -4px 0; background-color: #fff; }
  .size-grid { display: flex; flex-direction: column; gap: 3px; align-items: center; padding: 2px 0; }
  .size-btn { width: 42px; height: 24px; background: rgba(255,255,255,.04); border: 1px solid transparent; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; font-size: 10px; color: #d4d9e2; font-family: inherit; padding: 0; }
  .size-btn.active { border-color: #4a7eff; background: rgba(74,126,255,.15); }
  .size-btn .dot { border-radius: 50%; background: #d4d9e2; }
  .shape-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; padding: 0 2px; }
  .shape-btn { width: 30px; height: 30px; background: rgba(255,255,255,.04); border: 1px solid transparent; border-radius: 6px; color: #d4d9e2; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; padding: 0; }
  .shape-btn.active { border-color: #4a7eff; background: rgba(74,126,255,.15); }
  .color-input-row { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 6px; }
  .color-input-row input[type="color"] { width: 32px; height: 26px; border: 1px solid rgba(255,255,255,.15); border-radius: 6px; padding: 1px; background: transparent; cursor: pointer; }
  .color-input-row label { font-size: 10px; color: #b8c0cc; cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .color-input-row input[type="checkbox"] { accent-color: #4a7eff; cursor: pointer; width: 14px; height: 14px; }
  .smooth-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 3px; padding: 0 3px; }
  .smooth-btn { height: 26px; padding: 0; background: rgba(255,255,255,.04); border: 1px solid transparent; border-radius: 6px; color: #d4d9e2; cursor: pointer; font-size: 11px; font-family: inherit; font-weight: 600; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  .smooth-btn.active { border-color: #4a7eff; background: rgba(74,126,255,.15); }
  .submenu-head { display: flex; justify-content: space-between; align-items: center; padding: 0 4px 4px; border-bottom: 1px solid rgba(255,255,255,.06); margin-bottom: 4px; }
  .submenu-head .sub-title { font-size: 10.5px; color: #b8c0cc; font-weight: 700; padding-right: 4px; }
  .submenu-head .sub-close { width: 20px; height: 20px; border-radius: 4px; background: rgba(255,255,255,.06); border: none; color: #b8c0cc; cursor: pointer; font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; touch-action: manipulation; }
  .submenu-head .sub-close:hover { background: rgba(255,80,80,.3); color: #fff; }

/* ========== MATH RENDERING ========== */
function renderTextWithMath(container, text) {
  container.innerHTML = '';
  if (!text) return;
  if (typeof window.katex === 'undefined') { container.textContent = text; return; }
  const re = /\$\$([\s\S]+?)\$\$|\$([^$]+?)\$/g;
  const parts = [];
  let lastIndex = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > lastIndex) parts.push({ type: 'text', value: text.slice(lastIndex, m.index) });
    parts.push({ type: 'math', value: m[1] !== undefined ? m[1] : m[2], displayMode: m[1] !== undefined });
    lastIndex = m.index + m[0].length;
  }
  if (lastIndex < text.length) parts.push({ type: 'text', value: text.slice(lastIndex) });
  if (!parts.some(p => p.type === 'math')) { container.textContent = text; return; }

      newW = Math.max(SIDEBAR_MIN_W, Math.min(SIDEBAR_MAX_W, newW));

      stageWrapper.classList.remove('no-transition');
      localStorage.setItem(SIDEBAR_W_KEY, String(thumbnailSidebar.offsetWidth));

}

function renderThumbnails() {
  if (!thumbsList) return;
  thumbsList.innerHTML = '';
  if (!state.totalPages) {
    thumbsList.innerHTML = '<div class="thumbs-empty">لا توجد صفحات<br>افتح ملفاً للبدء</div>';
    return;
  }
  for (let i = 1; i <= state.totalPages; i++) {
    const item = document.createElement('div');
    item.className = 'thumb-item loading';
    item.dataset.page = i;

    const spinner = document.createElement('div');
    spinner.className = 'thumb-spinner';

    const img = document.createElement('img');
    img.dataset.page = i;
    img.alt = 'صفحة ' + i;
    img.draggable = false;

    /* ⭐ أولوية العرض: thumbCache (سريع) ثم pageCache */
    const cached = state.thumbCache.get(i) || state.pageCache.get(i);
    if (cached) {
      img.src = cached.dataUrl;
      img.onload = () => item.classList.add('loaded');
      item.classList.remove('loading');
      item.classList.add('loaded');
    }

    const num = document.createElement('span');
    num.className = 'thumb-num';
    num.textContent = i;

    item.appendChild(spinner);
    item.appendChild(img);
    item.appendChild(num);
    item.addEventListener('click', () => {
      if (state.currentPage !== i) goToPage(i);
    });
    thumbsList.appendChild(item);

    /* تفعيل الصفحة الحالية */
    if (i === state.currentPage) item.classList.add('active');
  }
}

function updateThumbnailImg(pageNum) {
  if (!thumbsList) return;
  const item = thumbsList.querySelector(`.thumb-item[data-page="${pageNum}"]`);
  if (!item) return;
  const img = item.querySelector('img');
  if (!img) return;
  /* الأولوية: thumbCache ثم pageCache */
  const cached = state.thumbCache.get(pageNum) || state.pageCache.get(pageNum);
  if (cached && img.src !== cached.dataUrl) {
    img.src = cached.dataUrl;
    img.onload = () => {
      item.classList.remove('loading');
      item.classList.add('loaded');
    };
    /* في حال كانت الصورة cached بالفعل في المتصفح */
    if (img.complete) {
      item.classList.remove('loading');
      item.classList.add('loaded');
    }
  }
}

function updateThumbnailActive(pageNum) {
  if (!thumbsList) return;
  let activeEl = null;
  thumbsList.querySelectorAll('.thumb-item').forEach(el => {
    const isActive = parseInt(el.dataset.page, 10) === pageNum;
    el.classList.toggle('active', isActive);
    if (isActive) activeEl = el;
  });
  if (activeEl) { try { activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (_) {} }
}

/* ========== INDEXEDDB ========== */
let _db = null;
function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME); };
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbDelete(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ========== SERIALIZATION ========== */
function serializeSvgElement(el) {

  return { kind: 'media', mediaId: el.dataset.mediaId, mediaType: el.dataset.mediaType || 'video', url: el.dataset.url, title: el.dataset.title || '', x: el.style.left, y: el.style.top, w: el.style.width, h: el.style.height };
}

    kind: 'button', btnId: el.dataset.btnId, text: el.dataset.text || '',
    fillColor: el.dataset.fillColor || '#4a7eff',
    fillOpacity: parseFloat(el.dataset.fillOpacity || '0.15'),
    borderColor: el.dataset.borderColor || '#4a7eff',
    borderOpacity: parseFloat(el.dataset.borderOpacity || '0.45'),
    textColor: el.dataset.textColor || '#1e3a8a',
    fontSize: parseFloat(el.dataset.fontSize || '18'),
    borderRadius: parseFloat(el.dataset.borderRadius || '12'),
    isCorrect: el.dataset.isCorrect === 'true',

}
function snapshot() {
  const annotations = [];
  svgLayer.querySelectorAll('[data-annot]').forEach(el => {

    annotations.push(serializeSvgElement(el));

  const embeds = []; embedLayer.querySelectorAll('.embed').forEach(el => embeds.push(serializeEmbed(el)));
  const media = []; videoLayer.querySelectorAll('.media-obj').forEach(el => media.push(serializeMedia(el)));
  const buttons = []; interactiveLayer.querySelectorAll('.pdf-interactive-btn').forEach(el => buttons.push(serializeButton(el)));

}
function applySnapshot(s) {
  deselect();
  while (svgLayer.firstChild) svgLayer.removeChild(svgLayer.firstChild);
  embedLayer.innerHTML = ''; videoLayer.innerHTML = ''; interactiveLayer.innerHTML = '';
  (s.annotations || []).forEach(spec => { try { svgLayer.appendChild(deserializeSvgElement(spec)); } catch (e) {} });
  (s.embeds || []).forEach(spec => addEmbedElement(spec.url, spec.x, spec.y, spec.w, spec.h, false));
  const mediaList = s.media || s.videos || [];
  mediaList.forEach(spec => addMediaElement(spec.mediaId, spec.url, spec.title, spec.mediaType || 'video', spec.x, spec.y, spec.w, spec.h, false));
  (s.buttons || []).forEach(spec => addButtonElement(spec, false));
}

/* ========== HISTORY ========== */
function getHistory() { return state.history[state.currentPage] || (state.history[state.currentPage] = { past: [], future: [] }); }
function savePageNow() { if (state.currentPage) state.pages[state.currentPage] = snapshot(); }
function commitChange(pre) {
  if (!state.currentPage) return;
  const h = getHistory();
  h.past.push(pre || { annotations: [], embeds: [], media: [], buttons: [] });
  if (h.past.length > UNDO_LIMIT) h.past.shift();
  h.future.length = 0; savePageNow(); updateUndoButtons(); scheduleSave();
}
function updateUndoButtons() {
  const h = state.history[state.currentPage] || { past: [], future: [] };
  btnUndo.disabled = h.past.length === 0; btnRedo.disabled = h.future.length === 0;
}
function undo() {
  if (!state.currentPage) return;
  const h = getHistory(); if (!h.past.length) return;
  h.future.push(snapshot()); const p = h.past.pop();
  state.pages[state.currentPage] = p; applySnapshot(p); updateUndoButtons(); scheduleSave();
}
function redo() {
  if (!state.currentPage) return;
  const h = getHistory(); if (!h.future.length) return;
  h.past.push(snapshot()); const n = h.future.pop();
  state.pages[state.currentPage] = n; applySnapshot(n); updateUndoButtons(); scheduleSave();
}

/* ========== AUTO SAVE ========== */
let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveProject().catch(e => console.warn('auto-save failed', e)); }, 800);
}
async function saveProject() {
  if (!state.pdfBlob) return false;
  savePageNow();
  const mediaBlobsObj = {};
  mediaBlobs.forEach((blob, id) => { mediaBlobsObj[id] = blob; });
  const project = {
    pdfBlob: state.pdfBlob, pdfName: state.pdfName, pdfIsImage: state.pdfIsImage,
    totalPages: state.totalPages, currentPage: state.currentPage,
    pages: state.pages,
    mediaBlobs: mediaBlobsObj, videoBlobs: mediaBlobsObj,
    savedAt: Date.now(), version: 2,
  };
  try {
    await idbPut(PROJECT_KEY, project);
    showSaveStatus('✓ محفوظ ' + new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }));
    return true;
  } catch (err) { console.error('save error', err); toast('فشل الحفظ: ' + err.message, 'error'); return false; }
}
async function loadProject() {
  let project;
  try { project = await idbGet(PROJECT_KEY); } catch (e) { return false; }
  if (!project || !project.pdfBlob) return false;
  mediaBlobs.clear();
  const blobsObj = project.mediaBlobs || project.videoBlobs || {};
  Object.keys(blobsObj).forEach(id => { mediaBlobs.set(id, blobsObj[id]); });
  state.pages = project.pages || {}; state.history = {};
  state.pdfName = project.pdfName || 'document.pdf';
  state.pdfIsImage = !!project.pdfIsImage;
  try {
    const file = new File([project.pdfBlob], state.pdfName, { type: project.pdfBlob.type || 'application/pdf' });
    if (state.pdfIsImage) await loadImageFile(file, { keepPages: true, skipRender: true });
    else await loadPdfFile(file, { keepPages: true, skipRender: true });
    state.currentPage = project.currentPage || 1;
    await renderPage(state.currentPage);
    return true;
  } catch (err) { console.error('restore failed', err); return false; }
}
async function clearSavedProject() {
  try { await idbDelete(PROJECT_KEY); toast('تم حذف المشروع المحفوظ', 'ok'); }
  catch (e) { toast('تعذّر الحذف: ' + e.message, 'error'); }
}

/* ========== LASER ========== */
const laserStrokes = []; let currentLaserStroke = null; let laserRAF = null; let laserLastActivity = 0;
function clearLaser() { laserStrokes.length = 0; currentLaserStroke = null; laserLastActivity = 0; laserCtx.clearRect(0, 0, laserCanvas.width, laserCanvas.height); }
function clearTransient() { transCtx.clearRect(0, 0, transientCanvas.width, transientCanvas.height); transientCanvas.style.opacity = '1'; }
function loadPageState(pageNum) {
  deselect(); clearLaser(); clearTransient();
  while (svgLayer.firstChild) svgLayer.removeChild(svgLayer.firstChild);
  embedLayer.innerHTML = ''; videoLayer.innerHTML = ''; interactiveLayer.innerHTML = '';
  const s = state.pages[pageNum]; if (s) applySnapshot(s);
}
function startLaserRAF() { if (laserRAF) return; laserRAF = requestAnimationFrame(laserTick); }
function laserTick() {
  const now = performance.now();
  if (laserStrokes.length === 0) { laserRAF = null; return; }
  const age = now - laserLastActivity;
  let alpha = 1;
  if (age > state.laserLifeMs) alpha = Math.max(0, 1 - (age - state.laserLifeMs) / LASER_FADE_MS);
  laserCtx.setTransform(1, 0, 0, 1, 0, 0);
  laserCtx.clearRect(0, 0, laserCanvas.width, laserCanvas.height);
  if (alpha <= 0) { laserStrokes.length = 0; currentLaserStroke = null; laserRAF = null; return; }
  laserCtx.globalAlpha = alpha; laserCtx.lineCap = 'round'; laserCtx.lineJoin = 'round';
  const k = state.canvasScale;
  const intensity = state.laserGlowIntensity;
  const inner = state.laserInnerColor;
  for (let i = 0; i < laserStrokes.length; i++) {
    const s = laserStrokes[i]; if (!s.points || s.points.length < 1) continue;
    laserCtx.shadowColor = s.color; laserCtx.shadowBlur = s.width * k * intensity;
    laserCtx.strokeStyle = s.color; laserCtx.lineWidth = s.width * k;
    laserCtx.beginPath(); laserCtx.moveTo(s.points[0].x * k, s.points[0].y * k);
    if (s.points.length === 1) laserCtx.lineTo(s.points[0].x * k + 0.01, s.points[0].y * k);
    else for (let j = 1; j < s.points.length; j++) laserCtx.lineTo(s.points[j].x * k, s.points[j].y * k);
    laserCtx.stroke();
  }
  laserCtx.shadowBlur = 0; laserCtx.shadowColor = 'transparent';
  if (inner === 'transparent') {
    laserCtx.globalCompositeOperation = 'destination-out';
    laserCtx.fillStyle = 'rgba(0,0,0,1)'; laserCtx.strokeStyle = 'rgba(0,0,0,1)';
    for (let i = 0; i < laserStrokes.length; i++) {
      const s = laserStrokes[i]; if (!s.points || s.points.length < 1) continue;
      if (s.points.length === 1) { laserCtx.beginPath(); laserCtx.arc(s.points[0].x * k, s.points[0].y * k, (s.width * k) / 2, 0, Math.PI * 2); laserCtx.fill(); }
      else {
        laserCtx.lineWidth = s.width * k;
        laserCtx.beginPath(); laserCtx.moveTo(s.points[0].x * k, s.points[0].y * k);
        for (let j = 1; j < s.points.length; j++) laserCtx.lineTo(s.points[j].x * k, s.points[j].y * k);
        laserCtx.stroke();
      }
    }
    laserCtx.globalCompositeOperation = 'source-over';
  } else {
    laserCtx.fillStyle = inner; laserCtx.strokeStyle = inner;
    for (let i = 0; i < laserStrokes.length; i++) {
      const s = laserStrokes[i]; if (!s.points || s.points.length < 1) continue;
      if (s.points.length === 1) { laserCtx.beginPath(); laserCtx.arc(s.points[0].x * k, s.points[0].y * k, Math.max(1, s.width * k * 0.3), 0, Math.PI * 2); laserCtx.fill(); }
      else {
        laserCtx.lineWidth = Math.max(1, s.width * k * 0.55);
        laserCtx.beginPath(); laserCtx.moveTo(s.points[0].x * k, s.points[0].y * k);
        for (let j = 1; j < s.points.length; j++) laserCtx.lineTo(s.points[j].x * k, s.points[j].y * k);
        laserCtx.stroke();
      }
    }
  }
  laserCtx.shadowBlur = 0; laserCtx.shadowColor = 'transparent'; laserCtx.globalAlpha = 1;
  laserRAF = requestAnimationFrame(laserTick);
}
function laserStart(p) { laserLastActivity = performance.now(); currentLaserStroke = { points: [p], color: state.laserColor, width: state.laserSize }; laserStrokes.push(currentLaserStroke); startLaserRAF(); }
function laserAdd(p) {
  if (!currentLaserStroke) return;
  const last = currentLaserStroke.points[currentLaserStroke.points.length - 1];
  if (Math.hypot(p.x - last.x, p.y - last.y) < 1.5) return;
  currentLaserStroke.points.push(p); laserLastActivity = performance.now();
}
function laserEnd() { currentLaserStroke = null; laserLastActivity = performance.now(); }

/* ========== RENDER PAGE ========== */
async function renderPage(pageNum) {
  if (!state.pdfDoc && !state.pdfIsImage) return;
  const hasCache = state.pageCache.has(pageNum);
  if (!hasCache) setLoading(true, 'جارٍ عرض الصفحة…');
  try {
    let vp1W, vp1H, aspect;
    if (state.pdfDoc) {
      const page = await state.pdfDoc.getPage(pageNum);
      const vp1 = page.getViewport({ scale: 1 });
      vp1W = vp1.width; vp1H = vp1.height; aspect = vp1.height / vp1.width;
    } else { vp1W = 1; vp1H = state.pdfH / state.pdfW; aspect = vp1H / vp1W; }
    state.pdfW = COORD_WIDTH;
    state.pdfH = Math.round(COORD_WIDTH * aspect);
    updateThumbAspect();  /* ⭐ تحديث نسبة الأبعاد */
    const { cssW, cssH, canvasW, canvasH } = computeStageSize(vp1W, vp1H);
    state.canvasScale = canvasW / state.pdfW;
    state.cssW = cssW; state.cssH = cssH; state.dpr = canvasW / cssW;
    stage.style.width = cssW + 'px'; stage.style.height = cssH + 'px';
    [pdfCanvas, transientCanvas, laserCanvas].forEach(c => { c.width = canvasW; c.height = canvasH; });
    svgLayer.setAttribute('viewBox', `0 0 ${state.pdfW} ${state.pdfH}`);
    const ctx = pdfCanvas.getContext('2d', { alpha: false });
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvasW, canvasH);
    const cached = state.pageCache.get(pageNum);
    if (cached) {
      const img = new Image();
      await new Promise(res => { img.onload = res; img.onerror = res; img.src = cached.dataUrl; });
      ctx.drawImage(img, 0, 0, canvasW, canvasH);
    } else if (state.pdfDoc) {
      const page = await state.pdfDoc.getPage(pageNum);
      const vp1 = page.getViewport({ scale: 1 });
      const renderScale = canvasW / vp1.width;
      const viewport = page.getViewport({ scale: renderScale });
      await page.render({ canvasContext: ctx, viewport, background: '#ffffff' }).promise;
      try {
        const cc = document.createElement('canvas');
        const cw = Math.min(canvasW, CACHE_WIDTH);
        const ch = Math.round(cw * canvasH / canvasW);
        cc.width = cw; cc.height = ch;
        const cctx = cc.getContext('2d', { alpha: false });
        cctx.drawImage(pdfCanvas, 0, 0, cw, ch);
        state.pageCache.set(pageNum, { dataUrl: cc.toDataURL('image/jpeg', 0.82) });
      } catch (e) {}
    } else {
      const blob = state.pdfBlob;
      if (blob) {
        const url = URL.createObjectURL(blob);
        try {
          const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('x')); i.src = url; });
          ctx.drawImage(img, 0, 0, canvasW, canvasH);
        } finally { URL.revokeObjectURL(url); }
      }
    }
    updateStageRect0(); applyView();
    loadPageState(pageNum);
    updatePageIndicator(); updateUndoButtons(); emptyState.style.display = 'none';
  } catch (err) { console.error(err); toast('تعذّر عرض الصفحة', 'error'); }
  finally { if (!hasCache) setLoading(false); }
}

/* ⭐⭐⭐ التحميل المسبق: تمرير سريع للثامبنيل أولاً ثم الجودة الكاملة ⭐⭐⭐ */
async function preloadAllPages(token) {
  if (!state.pdfDoc) return;
  
  /* ==== المرحلة 1: ثامبنيل بجودة منخفضة لكل الصفحات (سريع جداً) ==== */
  for (let i = 1; i <= state.totalPages; i++) {
    if (state.preloadToken !== token) return;
    if (state.thumbCache.has(i)) { updateThumbnailImg(i); continue; }
    try {
      const page = await state.pdfDoc.getPage(i);
      const vp1 = page.getViewport({ scale: 1 });
      const scale = THUMB_WIDTH / vp1.width;
      const viewport = page.getViewport({ scale });
      const cvs = document.createElement('canvas');
      cvs.width = Math.max(1, Math.floor(viewport.width));
      cvs.height = Math.max(1, Math.floor(viewport.height));
      const c = cvs.getContext('2d', { alpha: false });
      c.fillStyle = '#ffffff'; c.fillRect(0, 0, cvs.width, cvs.height);
      await page.render({ canvasContext: c, viewport }).promise;
      const thumbUrl = cvs.toDataURL('image/jpeg', 0.7);
      if (state.preloadToken !== token) return;
      state.thumbCache.set(i, { dataUrl: thumbUrl });
      updateThumbnailImg(i);
      page.cleanup();
      /* لا تأخير — نريدها بأسرع وقت */
      await new Promise(r => setTimeout(r, 0));
    } catch (e) { console.warn('thumb preload ' + i, e); }
  }
  
  /* ==== المرحلة 2: الجودة الكاملة للتنقل السريع (في الخلفية) ==== */
  for (let i = 1; i <= state.totalPages; i++) {
    if (state.preloadToken !== token) return;
    if (state.pageCache.has(i)) continue;
    try {
      const page = await state.pdfDoc.getPage(i);
      const vp1 = page.getViewport({ scale: 1 });
      const cw = Math.min(CACHE_WIDTH, Math.max(1200, Math.round(vp1.width * 1.5)));
      const scale = cw / vp1.width;
      const viewport = page.getViewport({ scale });
      const cvs = document.createElement('canvas');
      cvs.width = Math.max(1, Math.floor(viewport.width));
      cvs.height = Math.max(1, Math.floor(viewport.height));
      const c = cvs.getContext('2d', { alpha: false });
      c.fillStyle = '#ffffff'; c.fillRect(0, 0, cvs.width, cvs.height);
      await page.render({ canvasContext: c, viewport }).promise;
      const dataUrl = cvs.toDataURL('image/jpeg', 0.82);
      if (state.preloadToken !== token) return;
      state.pageCache.set(i, { dataUrl });
      page.cleanup();
      await new Promise(r => setTimeout(r, 0));
    } catch (e) { console.warn('preload page ' + i, e); }
  }
}

async function loadPdfFile(file, opts = {}) {
  setLoading(true, 'جارٍ قراءة الملف…');
  try {
    const buf = await file.arrayBuffer();
    const doc = await pdfjsLib.getDocument({
      data: buf, cMapUrl: `${PDFJS_BASE}/cmaps/`, cMapPacked: true,
      standardFontDataUrl: `${PDFJS_BASE}/standard_fonts/`, wasmUrl: `${PDFJS_BASE}/wasm/`,
      useSystemFonts: false, disableFontFace: false, isEvalSupported: false,
      fontExtraProperties: true, verbosity: 0,
    }).promise;
    state.pdfDoc = doc; state.totalPages = doc.numPages;
    state.pdfBlob = file; state.pdfName = file.name; state.pdfIsImage = false;
    state.pageCache.clear(); state.thumbCache.clear(); state.preloadToken++;
    const myToken = state.preloadToken;
    if (!opts.keepPages) { state.pages = {}; state.history = {}; state.currentPage = 1; state.selected = null; }
    renderThumbnails();
    if (!opts.skipRender) {
      updateUndoButtons();

}

async function getJsPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  return window.jspdf.jsPDF;

/* ⭐ تحميل html2canvas عند الطلب فقط */
async function getHtml2Canvas() {
  if (window.html2canvas) return window.html2canvas;
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  return window.html2canvas;
}
function escapeXml(s) { return String(s).replace(/[<>&"']/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;' }[c])); }
function buildAnnotationSvg(annotations, pdfW, pdfH, strokeScale) {
  const parts = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${pdfW} ${pdfH}" width="${pdfW}" height="${pdfH}">`];
  for (const spec of annotations) {
    const tag = spec.tag, out = {}, attrs = spec.attrs || {};
    for (const k in attrs) out[k] = attrs[k];
    if (out['stroke-width']) out['stroke-width'] = parseFloat(out['stroke-width']) * strokeScale;
    const attrStr = Object.keys(out).map(k => `${k}="${escapeXml(out[k])}"`).join(' ');
    if (['path','line','rect','ellipse','circle'].includes(tag)) parts.push(`<${tag} ${attrStr}/>`);
  }
  parts.push('</svg>');
  return parts.join('');
}
function loadImageFromUrl(url) { return new Promise(resolve => { const img = new Image(); img.onload = () => resolve(img); img.onerror = () => resolve(null); img.src = url; }); }
async function svgStrToPngDataUrl(svgStr, targetW, targetH) {
  const dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  const img = await loadImageFromUrl(dataUrl);
  if (!img) return null;
  const cv = document.createElement('canvas');
  cv.width = targetW; cv.height = targetH;
  cv.getContext('2d').drawImage(img, 0, 0, targetW, targetH);
  return cv.toDataURL('image/png');
}

/* ⭐⭐⭐ رندر الزر بـ html2canvas لدعم المعادلات والألوان بشكل كامل ⭐⭐⭐ */
async function renderButtonToPng(spec) {
  const w = parseFloat(spec.w) || 130;
  const h = parseFloat(spec.h) || 46;
  const fontSize = spec.fontSize || 18;
  const borderRadius = spec.borderRadius != null ? spec.borderRadius : 12;
  const isLtr = spec.isLtr === true || spec.isLtr === 'true';
  
  /* إنشاء عنصر مؤقت بنفس الأنماط تماماً */
  const temp = document.createElement('div');
  temp.style.cssText = `
    position: fixed;
    left: -99999px;
    top: 0;
    width: ${w}px;
    height: ${h}px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 14px;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    font-weight: 600;
    text-align: center;
    line-height: 1.25;
    border-radius: ${borderRadius}px;
    box-sizing: border-box;
    background: ${hexToRgba(spec.fillColor, spec.fillOpacity)};
    border: 1.5px solid ${hexToRgba(spec.borderColor, spec.borderOpacity)};
    color: ${spec.textColor || '#1e3a8a'};
    font-size: ${fontSize}px;
    ${isLtr ? 'direction: ltr;' : ''}
    overflow: hidden;
    white-space: nowrap;
    z-index: -1;
  `;
  const span = document.createElement('span');
  span.style.cssText = 'display: inline-flex; align-items: center; justify-content: center; gap: 2px; flex-wrap: wrap; max-width: 100%;';
  renderTextWithMath(span, spec.text || 'خيار');
  temp.appendChild(span);
  document.body.appendChild(temp);
  
  try {
    const html2canvas = await getHtml2Canvas();
    const canvas = await html2canvas(temp, {
      backgroundColor: null,
      scale: 3,
      logging: false,
      width: w,
      height: h,
      useCORS: true,
      allowTaint: true,
    });
    return canvas.toDataURL('image/png');
  } catch (err) {
    console.warn('html2canvas failed, falling back to manual render:', err);
    /* Fallback: رسم يدوي بسيط */
    const PX_PER_PT = 3;
    const cw = Math.max(1, Math.round(w * PX_PER_PT));
    const ch = Math.max(1, Math.round(h * PX_PER_PT));
    const cv = document.createElement('canvas');
    cv.width = cw; cv.height = ch;
    const c = cv.getContext('2d');
    c.fillStyle = hexToRgba(spec.fillColor, spec.fillOpacity);
    const r = Math.min(borderRadius, Math.min(w, h) / 2) * PX_PER_PT;
    roundRect(c, 0.75 * PX_PER_PT, 0.75 * PX_PER_PT, cw - 1.5 * PX_PER_PT, ch - 1.5 * PX_PER_PT, r);
    c.fill();
    c.strokeStyle = hexToRgba(spec.borderColor, spec.borderOpacity);
    c.lineWidth = 1.5 * PX_PER_PT;
    c.stroke();
    c.fillStyle = spec.textColor || '#000';
    c.font = `600 ${fontSize * PX_PER_PT}px -apple-system, "Segoe UI", Tahoma, sans-serif`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(stripMathToPlain(spec.text || ''), cw / 2, ch / 2, cw - 4 * PX_PER_PT);
    return cv.toDataURL('image/png');
  } finally {
    try { document.body.removeChild(temp); } catch (_) {}
  }
}

async function exportAnnotatedPdf() {
  if (!state.pdfBlob) { toast('لا يوجد ملف مفتوح', 'warn'); return; }
  savePageNow();
  setLoading(true, 'جارٍ تجهيز PDF…');
  try {
    const jsPDF = await getJsPDF();
    let pageW, pageH;
    if (state.pdfDoc) {
      const page = await state.pdfDoc.getPage(1);
      const vp = page.getViewport({ scale: 1 });
      pageW = vp.width; pageH = vp.height;
    } else { pageW = state.pdfW * 0.75; pageH = state.pdfH * 0.75; }
    const pdf = new jsPDF({ unit: 'pt', format: [pageW, pageH], orientation: pageW > pageH ? 'landscape' : 'portrait', compress: true });
    const strokeScale = state.cssW > 0 ? state.pdfW / state.cssW : 1;
    const EXPORT_IMG_W = 1600;

    for (let i = 1; i <= state.totalPages; i++) {
      if (i > 1) pdf.addPage([pageW, pageH]);
      /* 1) خلفية الصفحة */
      let pageImg = state.pageCache.get(i) && state.pageCache.get(i).dataUrl;
      if (!pageImg && state.pdfDoc) {
        const page = await state.pdfDoc.getPage(i);
        const vp = page.getViewport({ scale: 1 });
        const scale = EXPORT_IMG_W / vp.width;
        const viewport = page.getViewport({ scale });
        const cv = document.createElement('canvas');
        cv.width = Math.floor(viewport.width); cv.height = Math.floor(viewport.height);
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
        await page.render({ canvasContext: ctx, viewport }).promise;
        pageImg = cv.toDataURL('image/jpeg', 0.9);
      }
      if (pageImg) pdf.addImage(pageImg, 'JPEG', 0, 0, pageW, pageH);

      const saved = state.pages[i];
      if (!saved) continue;

      /* 2) الرسومات اليدوية */
      if (saved.annotations && saved.annotations.length) {
        const svgStr = buildAnnotationSvg(saved.annotations, state.pdfW, state.pdfH, strokeScale);
        const pngUrl = await svgStrToPngDataUrl(svgStr, EXPORT_IMG_W, Math.round(EXPORT_IMG_W * state.pdfH / state.pdfW));
        if (pngUrl) pdf.addImage(pngUrl, 'PNG', 0, 0, pageW, pageH);
      }

      /* 3) Embeds */
      (saved.embeds || []).forEach(spec => {
        const x = parseFloat(spec.x) / 100 * pageW;
        const y = parseFloat(spec.y) / 100 * pageH;
        const w = parseFloat(spec.w) / 100 * pageW;
        const h = parseFloat(spec.h) / 100 * pageH;
        pdf.setDrawColor(74, 126, 255); pdf.setLineWidth(1); pdf.setFillColor(240, 245, 255);
        pdf.roundedRect(x, y, w, h, 4, 4, 'FD');
        pdf.setTextColor(74, 126, 255); pdf.setFontSize(11);
        pdf.text('Embed: ' + (spec.url || ''), x + 8, y + 16, { maxWidth: w - 16 });
      });

      /* 4) Media */
      const mediaList = saved.media || saved.videos || [];
      mediaList.forEach(spec => {
        const x = parseFloat(spec.x) / 100 * pageW;
        const y = parseFloat(spec.y) / 100 * pageH;
        const w = parseFloat(spec.w) / 100 * pageW;
        const h = parseFloat(spec.h) / 100 * pageH;
        pdf.setDrawColor(74, 126, 255); pdf.setFillColor(20, 20, 20);
        pdf.roundedRect(x, y, w, h, 6, 6, 'FD');
        pdf.setTextColor(255, 255, 255); pdf.setFontSize(11);
        const label = (spec.mediaType === 'image' ? 'Image: ' : 'Video: ') + (spec.title || '');
        pdf.text(label, x + 8, y + 16, { maxWidth: w - 16 });
      });

      /* ⭐ 5) الأزرار التفاعلية — تُصدَّر كصور كاملة بمحتواها (نص + معادلات) */
      for (const spec of (saved.buttons || [])) {
        const x = parseFloat(spec.x) / 100 * pageW;
        const y = parseFloat(spec.y) / 100 * pageH;
        const w = parseFloat(spec.w);
        const h = parseFloat(spec.h);
        if (isNaN(w) || isNaN(h)) continue;
        try {
          const pngUrl = await renderButtonToPng(spec);
          if (pngUrl) pdf.addImage(pngUrl, 'PNG', x, y, w, h, undefined, 'FAST');
        } catch (err) { console.warn('button render failed:', err); }
      }
    }
    const outName = (state.pdfName || 'document').replace(/\.(pdf|jpg|jpeg|png|webp|gif)$/i, '') + '-annotated.pdf';
    pdf.save(outName);
    toast('تم تصدير PDF ✅', 'ok');
  } catch (err) { console.error(err); toast('تعذّر التصدير: ' + err.message, 'error'); }
  finally { setLoading(false); }
}

/* ========== TOOLBAR / SUBMENU ========== */
function setTool(tool) {
  if (tool !== 'select') deselect();
  state.tool = tool; stage.dataset.tool = tool;
  document.querySelectorAll('#toolbar button[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
  updateCursorForTool();
}
function bindPress(el, handler) {
  const MOVE_THRESHOLD = 10;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const startX = e.clientX, startY = e.clientY;
    let moved = false;
    const t = setTimeout(() => { moved = true; }, 700);
    const onMove = (ev) => { if (moved) return; if (Math.hypot(ev.clientX - startX, ev.clientY - startY) > MOVE_THRESHOLD) { moved = true; clearTimeout(t); } };
    const onUp = (ev) => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      clearTimeout(t);
      if (!moved) { try { e.preventDefault(); e.stopPropagation(); } catch (_) {} handler(e); }
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }, { passive: false });
}
toolbar.querySelectorAll('button').forEach(btn => {
  bindPress(btn, async () => {
    if (btn.id === 'btnUndo') { undo(); return; }
    if (btn.id === 'btnRedo') { redo(); return; }
    if (btn.id === 'btnResetZoom') { resetView(); return; }
    if (btn.id === 'btnFullscreen') { toggleFullscreen(); return; }
    if (btn.id === 'btnOpen') { fileInput.click(); return; }
    if (btn.id === 'btnExport') { exportAnnotatedPdf(); return; }
    if (btn.id === 'btnSave') { const ok = await saveProject(); if (ok) toast('تم الحفظ ✅', 'ok'); return; }
    if (btn.id === 'btnClearSaved') { confirmClearSaved(); return; }
    const tool = btn.dataset.tool; if (!tool) return;
    if (tool === 'embed') { openEmbedDialog(); return; }
    if (tool === 'button') { openButtonDialog(); return; }
    if (tool === 'media') { openMediaPicker(); return; }
    const hasSub = btn.dataset.submenu;
    setTool(tool);
    if (hasSub) openSubmenu(btn, tool);
  });
});
function toggleFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen().catch(console.warn);
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen().catch(console.warn);
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}
function resetView() { state.view.scale = 1; state.view.tx = 0; state.view.ty = 0; applyView(); toast('تم إعادة الضبط', 'ok'); }
function confirmClearSaved() {

  document.body.appendChild(b);

/* ========== MEDIA ========== */
function openMediaPicker() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'video/*,image/*,.gif';
  input.multiple = true; input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) { input.remove(); return; }
    setLoading(true, 'جارٍ تجهيز الميديا…');
    const pre = snapshot(); let placed = 0;
    try {
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const isVideo = /^video\//i.test(file.type);
        const isImage = /^image\//i.test(file.type) || /\.gif$/i.test(file.name || '');
        if (!isVideo && !isImage) continue;
        try {
          const mediaId = uid();
          mediaBlobs.set(mediaId, file);
          const blobUrl = URL.createObjectURL(file);
          const mediaType = isVideo ? 'video' : 'image';
          const dims = isVideo ? await getVideoDimensions(blobUrl) : await getImageDimensions(blobUrl);
          const targetW = state.pdfW * 0.5, ratio = dims.h / dims.w;
          let wPct = (targetW / state.pdfW) * 100, hPct = (targetW * ratio / state.pdfH) * 100;
          if (hPct > 65) { hPct = 65; wPct = (hPct / 100 * state.pdfH) / (ratio * state.pdfW) * 100; }
          addMediaElement(mediaId, blobUrl, file.name || (isVideo ? 'فيديو' : 'صورة'),
                          mediaType, (22 + (i%3)*4) + '%', (18 + (i%3)*4) + '%',
                          wPct + '%', hPct + '%', false);
          placed++;
        } catch (err) { console.warn(err); }
      }
      if (placed > 0) { commitChange(pre); toast(`تمت إضافة ${placed} عنصر ✅`, 'ok'); setTool('select'); }
      else toast('لم يتم اختيار أي ملف صالح', 'warn');
    } finally { setLoading(false); input.remove(); }
  });
  input.click();
}

    e.preventDefault(); return;
  }
  if (stagePointers.size > 1) return;
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  const p = getStagePoint(e), tool = state.tool;
  if (tool === 'hand') {
    if (state.view.scale > 1.02) {
      interaction = { type: 'pan', startX: e.clientX, startY: e.clientY, startTx: state.view.tx, startTy: state.view.ty };
    } else {
      stage.classList.add('dragging');
      handDrag = { startX: e.clientX, dx: 0 };
      interaction = { type: 'hand' };
    }
    e.preventDefault(); return;
  }
  if (tool === 'select') {
    const handle = e.target.closest && e.target.closest('.handle');
    if (handle && state.selected && state.selected.kind === 'svg') {
      interaction = { type: 'resizeSvg', el: state.selected.el, handle: handle.dataset.handle, start: p, pre: snapshot() };
      e.preventDefault(); return;
    }
    const annot = e.target.closest && e.target.closest('[data-annot]');
    if (annot && annot.tagName.toLowerCase() !== 'g' && !annot.classList.contains('handle')) {
      selectAnnotation(annot);
      interaction = { type: 'moveSvg', el: annot, start: p, orig: captureSvgGeom(annot), pre: snapshot() };
      e.preventDefault(); return;
    }
    deselect(); return;
  }
  if (tool === 'pen') { startStroke('pen', p); e.preventDefault(); return; }
  if (tool === 'highlighter') { startStroke('highlighter', p); e.preventDefault(); return; }
  if (tool === 'eraser') { startStroke('eraser', p); e.preventDefault(); return; }
  if (tool === 'laser') { laserStart(p); interaction = { type: 'laser' }; e.preventDefault(); return; }
  if (tool === 'shape') {
    const pre = snapshot();
    const el = createShapeElement(state.shapeKind);
    if (state.shapeKind === 'rect') { el.setAttribute('x', p.x); el.setAttribute('y', p.y); el.setAttribute('width', 0); el.setAttribute('height', 0); }
    else if (state.shapeKind === 'circle') { el.setAttribute('cx', p.x); el.setAttribute('cy', p.y); el.setAttribute('rx', 0); el.setAttribute('ry', 0); }
    else { el.setAttribute('x1', p.x); el.setAttribute('y1', p.y); el.setAttribute('x2', p.x); el.setAttribute('y2', p.y); }
    svgLayer.appendChild(el);
    interaction = { type: 'shapeDraw', kind: state.shapeKind, start: p, el, pre };
    e.preventDefault(); return;
  }
});

stage.addEventListener('pointermove', e => {
  if (stagePointers.has(e.pointerId)) stagePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinchState && stagePointers.size >= 2) { updatePinch(); e.preventDefault(); return; }
  if (!interaction) return;
  if (interaction.type === 'stroke') { appendStrokePoints(e); return; }
  const p = getStagePoint(e);
  if (interaction.type === 'pan') { state.view.tx = interaction.startTx + (e.clientX - interaction.startX); state.view.ty = interaction.startTy + (e.clientY - interaction.startY); applyView(); return; }
  if (interaction.type === 'hand' && handDrag) { handDrag.dx = e.clientX - handDrag.startX; stageContent.style.transition = 'none'; stageContent.style.transform = `translateX(${handDrag.dx}px)`; return; }
  if (interaction.type === 'laser') { laserAdd(p); return; }
  if (interaction.type === 'shapeDraw') {
    const el = interaction.el, s = interaction.start;
    if (interaction.kind === 'rect') { el.setAttribute('x', Math.min(s.x, p.x)); el.setAttribute('y', Math.min(s.y, p.y)); el.setAttribute('width', Math.abs(p.x - s.x)); el.setAttribute('height', Math.abs(p.y - s.y)); }
    else if (interaction.kind === 'circle') { el.setAttribute('cx', (s.x + p.x) / 2); el.setAttribute('cy', (s.y + p.y) / 2); el.setAttribute('rx', Math.abs(p.x - s.x) / 2); el.setAttribute('ry', Math.abs(p.y - s.y) / 2); }
    else { el.setAttribute('x2', p.x); el.setAttribute('y2', p.y); }
    return;
  }
  if (interaction.type === 'moveSvg') { applySvgGeom(interaction.el, interaction.orig, p.x - interaction.start.x, p.y - interaction.start.y); drawSelectionOverlay(interaction.el); return; }
  if (interaction.type === 'resizeSvg') { resizeSvg(interaction.el, interaction.handle, interaction.start, p); drawSelectionOverlay(interaction.el); return; }
});

stage.addEventListener('pointerup', e => {
  stagePointers.delete(e.pointerId);
  if (pinchState && stagePointers.size < 2) { endPinch(); try { stage.releasePointerCapture(e.pointerId); } catch (_) {} return; }
  if (!interaction) return;
  const inter = interaction;
  try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
  if (inter.type === 'stroke') { endStroke(); return; }
  interaction = null;
  if (inter.type === 'pan') return;
  if (inter.type === 'hand' && handDrag) {
    stage.classList.remove('dragging');
    const dx = handDrag.dx, w = stage.clientWidth, thr = w * 0.15;
    handDrag = null;
    let targetPage = null;
    if (dx < -thr && state.currentPage < state.totalPages) targetPage = state.currentPage + 1;
    else if (dx > thr && state.currentPage > 1) targetPage = state.currentPage - 1;
    if (targetPage !== null) {
      stageContent.style.transition = 'none';
      stageContent.style.transform = '';
      void stageContent.offsetWidth;
      goToPage(targetPage);
    } else {
      stageContent.style.transition = 'transform .2s ease-out';
      stageContent.style.transform = 'translateX(0)';
      setTimeout(() => { stageContent.style.transition = ''; stageContent.style.transform = ''; }, 220);
    }
    return;
  }
  if (inter.type === 'laser') { laserEnd(); return; }
  if (inter.type === 'shapeDraw') {
    const el = inter.el, kind = inter.kind;
    let tooSmall = false;
    if (kind === 'rect') { if (+el.getAttribute('width') < 15 || +el.getAttribute('height') < 15) tooSmall = true; }
    else if (kind === 'circle') { if (+el.getAttribute('rx') < 10 || +el.getAttribute('ry') < 10) tooSmall = true; }
    else { if (Math.hypot(+el.getAttribute('x2') - +el.getAttribute('x1'), +el.getAttribute('y2') - +el.getAttribute('y1')) < 20) tooSmall = true; }
    if (tooSmall) el.remove();
    else { el.dataset.annot = '1'; el.dataset.id = uid(); el.dataset.type = kind; commitChange(inter.pre); }
    return;
  }
  if (inter.type === 'moveSvg' || inter.type === 'resizeSvg') commitChange(inter.pre);
});
stage.addEventListener('pointercancel', e => {
  stagePointers.delete(e.pointerId);
  if (pinchState && stagePointers.size < 2) endPinch();
  if (interaction && interaction.type === 'stroke') { interaction = null; clearTransient(); if (strokeRAF) { cancelAnimationFrame(strokeRAF); strokeRAF = null; } }
});

function getStagePoint(e) {
  const r = stage.getBoundingClientRect();
  return { x: ((e.clientX - r.left) / r.width) * state.pdfW, y: ((e.clientY - r.top) / r.height) * state.pdfH };
}

/* ========== SVG GEOMETRY ========== */
function captureSvgGeom(el) {
  const g = {};
  ['x','y','width','height','cx','cy','rx','ry','x1','y1','x2','y2'].forEach(a => { const v = el.getAttribute(a); if (v !== null) g[a] = parseFloat(v); });
  const t = el.getAttribute('transform');
  if (t) { const m = t.match(/translate\(\s*(-?[\d.]+)[ ,]+(-?[\d.]+)\s*\)/); if (m) { g.tx = parseFloat(m[1]); g.ty = parseFloat(m[2]); } }
  g._tag = el.tagName; return g;
}
function applySvgGeom(el, orig, dx, dy) {
  const t = orig._tag;
  if (t === 'rect') { el.setAttribute('x', orig.x + dx); el.setAttribute('y', orig.y + dy); }
  else if (t === 'ellipse') { el.setAttribute('cx', orig.cx + dx); el.setAttribute('cy', orig.cy + dy); }
  else if (t === 'line') { el.setAttribute('x1', orig.x1 + dx); el.setAttribute('y1', orig.y1 + dy); el.setAttribute('x2', orig.x2 + dx); el.setAttribute('y2', orig.y2 + dy); }
  else if (t === 'path') { el.setAttribute('transform', `translate(${(orig.tx||0) + dx}, ${(orig.ty||0) + dy})`); }
}
function resizeSvg(el, handle, startPt, p) {
  const tag = el.tagName, g = captureSvgGeom(el);
  const dx = p.x - startPt.x, dy = p.y - startPt.y;
  if (tag === 'rect') {
    if (handle === 'se') { el.setAttribute('width', Math.max(5, g.width + dx)); el.setAttribute('height', Math.max(5, g.height + dy)); }
    else if (handle === 'nw') { el.setAttribute('x', g.x + dx); el.setAttribute('y', g.y + dy); el.setAttribute('width', Math.max(5, g.width - dx)); el.setAttribute('height', Math.max(5, g.height - dy)); }
    else if (handle === 'ne') { el.setAttribute('y', g.y + dy); el.setAttribute('width', Math.max(5, g.width + dx)); el.setAttribute('height', Math.max(5, g.height - dy)); }
    else if (handle === 'sw') { el.setAttribute('x', g.x + dx); el.setAttribute('width', Math.max(5, g.width - dx)); el.setAttribute('height', Math.max(5, g.height + dy)); }
  } else if (tag === 'ellipse') {
    if (handle === 'se') { el.setAttribute('rx', Math.max(3, g.rx + dx/2)); el.setAttribute('ry', Math.max(3, g.ry + dy/2)); el.setAttribute('cx', g.cx + dx/2); el.setAttribute('cy', g.cy + dy/2); }
    else if (handle === 'nw') { el.setAttribute('rx', Math.max(3, g.rx - dx/2)); el.setAttribute('ry', Math.max(3, g.ry - dy/2)); el.setAttribute('cx', g.cx + dx/2); el.setAttribute('cy', g.cy + dy/2); }
    else if (handle === 'ne') { el.setAttribute('rx', Math.max(3, g.rx + dx/2)); el.setAttribute('ry', Math.max(3, g.ry - dy/2)); el.setAttribute('cx', g.cx + dx/2); el.setAttribute('cy', g.cy + dy/2); }
    else if (handle === 'sw') { el.setAttribute('rx', Math.max(3, g.rx - dx/2)); el.setAttribute('ry', Math.max(3, g.ry + dy/2)); el.setAttribute('cx', g.cx + dx/2); el.setAttribute('cy', g.cy + dy/2); }
  } else if (tag === 'line') {
    if (handle === 'se') { el.setAttribute('x2', g.x2 + dx); el.setAttribute('y2', g.y2 + dy); }
    else if (handle === 'nw') { el.setAttribute('x1', g.x1 + dx); el.setAttribute('y1', g.y1 + dy); }
    else if (handle === 'ne') { el.setAttribute('x2', g.x2 + dx); el.setAttribute('y1', g.y1 + dy); }
    else if (handle === 'sw') { el.setAttribute('x1', g.x1 + dx); el.setAttribute('y2', g.y2 + dy); }
  }
}

/* ========== NAV + KEYBOARD + FILES ========== */
bindPress(btnPrev, () => goToPage(state.currentPage - 1));
bindPress(btnNext, () => goToPage(state.currentPage + 1));

document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) { e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveProject().then(ok => ok && toast('تم الحفظ ✅', 'ok')); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (state.selected) {
      const pre = snapshot(); const sel = state.selected;
      if (sel.kind === 'svg') sel.el.remove();
      if (sel.kind === 'embed') sel.el.remove();
      if (sel.kind === 'media') { try { const v = sel.el.querySelector('video'); if (v) { v.pause(); v.src = ''; } } catch (_) {} sel.el.remove(); }
      if (sel.kind === 'button') sel.el.remove();
      state.selected = null; svgLayer.querySelectorAll('.selection-overlay').forEach(n => n.remove());
      commitChange(pre); e.preventDefault();
    }
    return;
  }
  if (e.key === 'Escape') { deselect(); closeSubmenu(); return; }
  const map = { h: 'hand', v: 'select', p: 'pen', m: 'highlighter', e: 'eraser', a: 'laser', s: 'shape' };
  const t = map[e.key.toLowerCase()]; if (t) {
    const btn = toolbar.querySelector(`button[data-tool="${t}"]`);
    if (btn && btn.dataset.submenu) { setTool(t); openSubmenu(btn, t); }
    else setTool(t);
  }
  if (e.key === 'ArrowRight') goToPage(state.currentPage + 1);
  if (e.key === 'ArrowLeft') goToPage(state.currentPage - 1);
});

bindPress($('btnOpenEmpty'), () => fileInput.click());
fileInput.addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) await loadPdfFile(f);
    else if (/^image\//.test(f.type)) await loadImageFile(f);
    else alert('نوع الملف غير مدعوم');
  } catch (err) { console.error(err); alert('خطأ: ' + err.message); }
  fileInput.value = '';
});

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());

window.addEventListener('beforeunload', () => { if (state.pdfBlob) { try { saveProject(); } catch (_) {} } });

/* ========== INIT ========== */
(async () => {
  adjustToolbarSize();
  initSidebar();
  updateThumbAspect();
  setTool('select');
  updateToolbarIndicators();
  updateUndoButtons();
  updatePageIndicator();
  try { const ok = await loadProject(); if (ok) toast('تم استعادة المشروع المحفوظ ✅', 'ok'); }
  catch (err) { console.warn('restore failed', err); }
})();

</script>
</body>
</html>
