<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل الـ PDF والتطبيق التفاعلي</title>
    
    <!-- 🎨 استيراد أنماط تيلدرو الرسمية من رابط مباشر مستقر -->
    <link rel="stylesheet" href="https://jsdelivr.net">

    <style>
        body, html, #root {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; font-family: sans-serif; background-color: #f8f9fa;
        }
        .toolbar {
            position: absolute; top: 15px; right: 15px;
            background: rgba(30, 30, 30, 0.95); padding: 12px 18px;
            border-radius: 8px; display: flex; gap: 12px;
            align-items: center; z-index: 9999; direction: rtl;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25); color: #fff;
        }
        .btn {
            color: white; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-pdf { background: #007bff; }
        .btn-game { background: #28a745; }
    </style>
</head>
<body>

    <!-- العنصر الحاضن للوحة -->
    <div id="root"></div>

    <!-- 🌐 روابط الـ CDN العالمية المضمونة (إصدارات UMD حقيقية للمتصفح مباشرة) -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <script>
        // استخراج الصلاحيات والمكونات بعد تحميل روابط الـ UMD بنجاح في المتصفح
        const { useState, createElement } = React;
        const { Tldraw, defaultEmbedDefinitions } = window.tldraw || tldraw;

        function App() {
            const [editor, setEditor] = useState(null);

            // إعداد كسر قيود الأمان لتعمل لعبتك على جيت هاب بكفاءة وتفاعل كامل
            const customEmbeds = [
                ...defaultEmbedDefinitions,
                {
                    type: 'interactive-game',
                    title: 'Interactive Game',
                    hostnames: ['ahmedsm12.github.io'],
                    minWidth: 400, minHeight: 300, doesResize: true,
                    toEmbedUrl: (url) => url,
                    fromEmbedUrl: (url) => url,
                    sandbox: 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals',
                }
            ];

            // دالة رفع ملف الـ PDF أو الصور وإسقاطه في لوحة الرسم
            const handlePdfUpload = (event) => {
                const files = event.target.files;
                if (!files || files.length === 0 || !editor) return;

                const fileUrl = URL.createObjectURL(files[0]); // قراءة الملف الأول بدقة
                
                editor.createShapes([
                    {
                        id: editor.createShapeId(),
                        type: 'image',
                        x: editor.getViewportPageBounds().centerX - 200,
                        y: editor.getViewportPageBounds().centerY - 250,
                        props: {
                            w: 400, h: 500, src: fileUrl, name: files[0].name
                        },
                    },
                ]);
            };

            // دالة إضافة رابط لعبتك التفاعلية المنشورة تلقائياً بضغطة زر
            const insertGameEmbed = () => {
                if (!editor) return;
                const gameUrl = "https://github.io";
                
                editor.createShapes([
                    {
                        id: editor.createShapeId(),
                        type: 'embed',
                        x: editor.getViewportPageBounds().centerX - 300,
                        y: editor.getViewportPageBounds().centerY - 200,
                        props: {
                            w: 600, h: 400, url: gameUrl
                        },
                    },
                ]);
            };

            return createElement('div', { style: { width: '100%', height: '100%', position: 'relative' } },
                createElement('div', { className: 'toolbar' },
                    createElement('span', { style: { fontSize: '14px', fontWeight: 'bold' } }, 'التحكم التفاعلي:'),
                    createElement('label', { className: 'btn btn-pdf' }, '📁 فتح ملف PDF',
                        createElement('input', { type: 'file', accept: '.pdf,image/*', onChange: handlePdfUpload, style: { display: 'none' } })
                    ),
                    createElement('button', { onClick: insertGameEmbed, className: 'btn btn-game' }, '🎮 إضافة اللعبة التفاعلية')
                ),
                createElement(Tldraw, {
                    onMount: (edt) => setEditor(edt),
                    embedDefinitions: customEmbeds,
                    options: { unmountOnBlur: false }
                })
            );
        }

        // تشغيل البناء وربطه بالواجهة
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(createElement(App));
    </script>
</body>
</html>
