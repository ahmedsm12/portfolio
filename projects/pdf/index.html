<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>لوحة PDF التفاعلية</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>

<!-- ===== SIDEBAR ===== -->
<aside id="thumbnailSidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">📑 الشرائح</span>
    <button id="btnToggleSidebar" title="إخفاء الشريط">×</button>
  </div>
  <div class="sidebar-thumbs" id="thumbsList"></div>
  <div id="bottomBar">
    <button id="btnPrev">السابق</button>
    <span id="pageIndicator"></span>
    <button id="btnNext">التالي</button>
  </div>
  <div class="sidebar-resize" id="sidebarResize"></div>
</aside>
<button id="btnShowSidebar" title="إظهار الشرائح">📑</button>

<!-- ===== STAGE ===== -->
<div id="stageWrapper">
  <div id="stage" data-tool="select">
    <div id="stageContent">
      <canvas id="pdfCanvas"></canvas>
      <svg id="svgLayer" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow-end-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker>
          <marker id="arrow-end-hollow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#fff" stroke="context-stroke" stroke-width="1"/></marker>
          <marker id="arrow-start-normal" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M 10 0 L 0 5 L 10 10 Z" fill="context-stroke"/></marker>
          <marker id="arrow-start-hollow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M 10 0 L 0 5 L 10 10 Z" fill="#fff" stroke="context-stroke" stroke-width="1"/></marker>
          <marker id="circle-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
          <marker id="square-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><rect x="1" y="1" width="8" height="8" fill="context-stroke"/></marker>
        </defs>
      </svg>
      <div id="embedLayer"></div>
      <div id="videoLayer"></div>
      <div id="textLayer"></div>
      <div id="interactiveLayer"></div>
      <canvas id="transientCanvas"></canvas>
      <canvas id="laserCanvas"></canvas>
    </div>
  </div>
  <div id="emptyState">
    <div class="icon">📄</div>
    <div>افتح ملف PDF للبدء</div>
    <button id="btnOpenEmpty">📂 اختر ملفاً</button>
  </div>
  <div id="loading"><div class="spinner"></div><div id="loadingText">جارٍ التحميل…</div></div>
</div>

<div id="saveStatus"></div>

<!-- ===== FLOATING TOOLBARS ===== -->
<div id="textContextToolbar"></div>
<div id="shapeContextToolbar"></div>

<!-- ===== TOOLBAR ===== -->
<nav id="toolbar">
  <button data-tool="hand" title="يد">🖐️</button>
  <button data-tool="pen" data-submenu="pen" title="قلم" style="--indicator:#000000">✏️</button>
  <button data-tool="highlighter" data-submenu="highlighter" title="قلم تحديد" style="--indicator:#eab308">🖍️</button>
  <button data-tool="eraser" data-submenu="eraser" title="ممحاة">🧽</button>
  <button data-tool="laser" data-submenu="laser" title="ليزر" style="--indicator:#ff0000">🔴</button>
  <button data-tool="text" data-submenu="text" title="نص" style="--indicator:#1e3a8a"><svg viewBox="0 0 24 24"><path d="M3 4h18v3h-1.5V5.5h-6v13h2.5V20h-8v-1.5H10.5v-13h-6V7H3z"/></svg></button>
  <button data-tool="equation" data-submenu="equation" title="معادلة" style="--indicator:#1e3a8a">∑</button>
  <button data-tool="shape" data-submenu="shape" title="أشكال">▭</button>
  <button data-tool="embed" title="تضمين">🔗</button>
  <button data-tool="button" title="زر تفاعلي">🔘</button>
  <button data-tool="media" title="ميديا">🖼️</button>
  <button data-tool="select" title="تحديد">
    <svg viewBox="0 0 24 24"><path d="M5.5 3.2 L18.8 12.2 L12.4 13.1 L15.6 20.2 L13.3 21.2 L10.2 14.2 L5.5 18.4 Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" fill="currentColor"/></svg>
  </button>
  <div class="tb-divider"></div>
  <button id="btnUndo" title="تراجع">↶</button>
  <button id="btnRedo" title="إعادة">↷</button>
  <button id="btnPaste" title="لصق" disabled>📥</button>
  <div class="tb-divider"></div>
  <button id="btnResetZoom" title="إعادة ضبط">🔄</button>
  <button id="btnFullscreen" title="ملء الشاشة">⛶</button>
  <button id="btnOpen" title="فتح ملف">📂</button>
  <div class="tb-divider"></div>
  <button id="btnExport" title="تصدير PDF">⬇️</button>
  <button id="btnSave" title="حفظ .actpdf">💾</button>
</nav>

<div id="submenu"></div>

<!-- ===== EQUATION EDITOR ===== -->
<div id="equationEditor">
  <div class="eq-title"><span>✏️ محرر المعادلات</span><button id="eqCloseBtn" title="إغلاق">✕</button></div>
  <div id="eqPaletteHost"></div>
  <textarea id="eqTextarea" placeholder="اكتب معادلة LaTeX..."></textarea>
  <div id="eqPreview"></div>
  <div class="eq-actions">
    <button class="btn-secondary" id="eqCancelBtn">إلغاء</button>
    <button class="btn-primary" id="eqInsertBtn">إدراج</button>
  </div>
</div>

<!-- ===== SLIDE CONTEXT MENU ===== -->
<div id="slideContextMenu">
  <button data-action="cut"><span class="ctx-icon">✂️</span> قص الشريحة</button>
  <button data-action="paste" id="ctxPasteBtn"><span class="ctx-icon">📋</span> لصق الشريحة</button>
  <div class="ctx-sep"></div>
  <button data-action="new"><span class="ctx-icon">➕</span> شريحة جديدة</button>
  <button data-action="duplicate"><span class="ctx-icon">📑</span> تكرار الشريحة</button>
  <div class="ctx-sep"></div>
  <button data-action="delete" class="danger"><span class="ctx-icon">🗑️</span> حذف الشريحة</button>
</div>

<input type="file" id="fileInput" accept="application/pdf,image/*,.actpdf" style="display:none">

<script type="module" src="src/main.js"></script>
</body>
</html>
