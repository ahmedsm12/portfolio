<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>لوحة PDF التفاعلية</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: #0f1115; color: #eee;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  #stageWrapper { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #0f1115; }
  #stage { position: relative; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.7); overflow: hidden; touch-action: none; border-radius: 4px; }
  #stageContent { position: absolute; inset: 0; will-change: transform; }
  #stageContent > * { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #pdfCanvas { z-index: 1; pointer-events: none; }
  #svgLayer  { z-index: 2; pointer-events: none; }
  #embedLayer { z-index: 3; pointer-events: none; }
  #transientCanvas { z-index: 4; pointer-events: none; }
  #laserCanvas { z-index: 5; pointer-events: none; }

  #stage[data-tool="hand"]   { cursor: grab; }
  #stage[data-tool="hand"].dragging { cursor: grabbing; }
  #stage[data-tool="pen"],
  #stage[data-tool="laser"],
  #stage[data-tool="rect"],
  #stage[data-tool="circle"],
  #stage[data-tool="line"] { cursor: crosshair; }

  /* ★ مؤشر الممحاة المخصص (دائرة بيضاء بحدود سوداء) */
  #stage[data-tool="eraser"] {
    cursor: url('data:image/svg+xml;charset=utf-8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"%3E%3Ccircle cx="16" cy="16" r="12" fill="%23ffffff" fill-opacity="0.85" stroke="%23000000" stroke-width="2"/%3E%3Ccircle cx="16" cy="16" r="8" fill="none" stroke="%23666666" stroke-width="1" stroke-dasharray="2 2"/%3E%3C/svg%3E') 16 16, cell;
  }

  #svgLayer [data-annot] { pointer-events: none; }
  #stage[data-tool="select"] #svgLayer [data-annot] { pointer-events: auto; cursor: move; }
  .annot { vector-effect: non-scaling-stroke; }

  .selection-outline { fill: none; stroke: #4a7eff; stroke-width: 1.5; stroke-dasharray: 5 3; vector-effect: non-scaling-stroke; pointer-events: none; }
  .handle { fill: #fff; stroke: #4a7eff; stroke-width: 2; vector-effect: non-scaling-stroke; cursor: pointer; pointer-events: auto; }
  .handle.nw, .handle.se { cursor: nwse-resize; }
  .handle.ne, .handle.sw { cursor: nesw-resize; }

  #embedLayer .embed { position: absolute; pointer-events: auto; display: flex; flex-direction: column; background: #fff; border: 1px solid #4a7eff; border-radius: 3px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.12); transition: box-shadow .15s; }
  #embedLayer .embed.selected { box-shadow: 0 0 0 2px rgba(74,126,255,.35), 0 2px 8px rgba(0,0,0,.2); }
  .embed-header { height: 22px; background: #4a7eff; color: #fff; padding: 0 5px; font-size: 10px; display: flex; justify-content: space-between; align-items: center; gap: 4px; cursor: move; user-select: none; flex-shrink: 0; opacity: 0; transition: opacity .15s; }
  #stage[data-tool="select"] .embed:hover .embed-header,
  #stage[data-tool="select"] .embed.selected .embed-header { opacity: 1; }
  #stage:not([data-tool="select"]) .embed-header { pointer-events: none; }
  .embed-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: left; font-weight: 500; }
  .embed-close { background: rgba(0,0,0,.25); border: none; color: #fff; width: 18px; height: 18px; border-radius: 3px; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; display: flex; align-items: center; justify-content: center; }
  .embed-close:hover { background: rgba(0,0,0,.5); }
  .embed iframe { flex: 1; border: none; background: #fff; width: 100%; min-height: 0; display: block; }
  #stage:not([data-tool="select"]) .embed iframe { pointer-events: none; }
  .embed-resize { position: absolute; width: 14px; height: 14px; background: #4a7eff; border: 2px solid #fff; border-radius: 50%; bottom: -7px; right: -7px; cursor: nwse-resize; z-index: 10; display: none; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #stage[data-tool="select"] .embed.selected .embed-resize { display: block; }

  #toolbar { position: fixed; right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 3px; padding: 5px 4px; background: rgba(28,32,40,.94); backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.5); z-index: 1000; touch-action: manipulation; }
  #toolbar button { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: transparent; color: #d4d9e2; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; transition: background .14s, transform .1s, color .14s; position: relative; touch-action: manipulation; }
  #toolbar button:hover { background: rgba(255,255,255,.09); }
  #toolbar button:active { transform: scale(.92); }
  #toolbar button.active { background: #4a7eff; color: #fff; }
  #toolbar button:disabled { opacity: .3; cursor: not-allowed; }
  #toolbar .tb-divider { height: 1px; background: rgba(255,255,255,.08); margin: 3px 6px; }
  #toolbar button[data-tool="pen"]::after,
  #toolbar button[data-tool="laser"]::after { content: ''; position: absolute; bottom: 4px; right: 5px; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #1c2028; background: var(--indicator, transparent); }

  #submenu { position: fixed; right: 58px; display: none; flex-direction: column; min-width: 60px; padding: 7px 5px; background: rgba(28,32,40,.96); backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.5); z-index: 1001; animation: subIn .15s ease-out; touch-action: manipulation; }
  @keyframes subIn { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }
  #submenu.show { display: flex; }
  .sub-label { font-size: 9px; color: #8a94a6; text-align: center; padding: 2px 0 4px; letter-spacing: .5px; font-weight: 600; }
  .sub-section { padding: 4px 0; }
  .sub-section + .sub-section { border-top: 1px solid rgba(255,255,255,.06); }
  .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 0 2px; }
  .color-btn { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center; margin: 2px auto; transition: transform .12s; touch-action: manipulation; }
  .color-btn .swatch { width: 100%; height: 100%; border-radius: 50%; border: 1px solid rgba(0,0,0,.3); }
  .color-btn:active { transform: scale(1.15); }
  .color-btn.active { border-color: #4a7eff; }
  .size-grid { display: flex; flex-direction: column; gap: 3px; align-items: center; padding: 2px 0; }
  .size-btn { width: 34px; height: 24px; background: rgba(255,255,255,.04); border: 1px solid transparent; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .12s; touch-action: manipulation; }
  .size-btn:active { background: rgba(255,255,255,.14); }
  .size-btn.active { border-color: #4a7eff; background: rgba(74,126,255,.15); }
  .size-btn .dot { border-radius: 50%; background: #d4d9e2; }
  .shape-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; padding: 0 2px; }
  .shape-btn { width: 30px; height: 30px; background: rgba(255,255,255,.04); border: 1px solid transparent; border-radius: 6px; color: #d4d9e2; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all .12s; touch-action: manipulation; }
  .shape-btn:active { background: rgba(255,255,255,.14); }
  .shape-btn.active { border-color: #4a7eff; background: rgba(74,126,255,.15); }
  .color-input-row { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 3px 0; }
  .color-input-row input[type="color"] { width: 32px; height: 26px; border: 1px solid rgba(255,255,255,.15); border-radius: 6px; padding: 1px; background: transparent; cursor: pointer; }
  .color-input-row label { font-size: 10px; color: #8a94a6; cursor: pointer; display: flex; align-items: center; gap: 3px; }
  .color-input-row input[type="checkbox"] { accent-color: #4a7eff; cursor: pointer; width: 13px; height: 13px; }

  .nav-btn { position: fixed; bottom: 20px; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; background: rgba(28,32,40,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.1); border-radius: 50%; color: #d4d9e2; font-size: 22px; cursor: pointer; z-index: 1000; box-shadow: 0 8px 24px rgba(0,0,0,.5); transition: background .15s, transform .1s, opacity .15s; touch-action: manipulation; user-select: none; }
  .nav-btn:active:not(:disabled) { transform: scale(.9); background: rgba(74,126,255,.4); }
  .nav-btn:disabled { opacity: .25; cursor: not-allowed; }
  #btnPrev { left: 20px; }
  #btnNext { right: 20px; }

  .dialog-backdrop { position: fixed; inset: 0; z-index: 2000; background: rgba(10,12,16,.65); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; animation: fadeIn .16s ease; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .dialog { background: #1c2028; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 20px; width: 90%; max-width: 420px; box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: dlgIn .2s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes dlgIn { from { opacity: 0; transform: scale(.94) translateY(8px); } to { opacity: 1; transform: none; } }
  .dialog h3 { font-size: 15px; margin-bottom: 12px; color: #fff; font-weight: 700; }
  .dialog input[type="url"] { width: 100%; padding: 12px 14px; background: #0f1115; color: #eee; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; font-size: 15px; direction: ltr; text-align: left; outline: none; font-family: inherit; transition: border-color .15s, box-shadow .15s; }
  .dialog input[type="url"]:focus { border-color: #4a7eff; box-shadow: 0 0 0 3px rgba(74,126,255,.2); }
  .dialog-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
  .dialog-actions button { padding: 11px 18px; border-radius: 9px; font-size: 14px; font-family: inherit; cursor: pointer; font-weight: 600; border: 1px solid transparent; transition: all .14s; touch-action: manipulation; }
  .dialog-actions .btn-primary { background: #4a7eff; color: #fff; }
  .dialog-actions .btn-primary:active { background: #3b6ee0; }
  .dialog-actions .btn-secondary { background: transparent; color: #8a94a6; border-color: rgba(255,255,255,.12); }
  .dialog-actions .btn-secondary:active { color: #fff; border-color: rgba(255,255,255,.25); }

  #emptyState { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #666; pointer-events: none; z-index: 20; font-size: 14px; }
  #emptyState .icon { font-size: 72px; opacity: .4; }
  #emptyState button { pointer-events: auto; padding: 13px 26px; background: #4a7eff; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-size: 15px; font-family: inherit; font-weight: 600; touch-action: manipulation; }
  #emptyState button:active { background: #3b6ee0; }

  #loading { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: #fff; background: rgba(15,17,21,.75); z-index: 100; backdrop-filter: blur(3px); }
  #loading.show { display: flex; }
  .spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,255,255,.12); border-top-color: #4a7eff; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #pageIndicator { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); padding: 6px 16px; background: rgba(28,32,40,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.08); border-radius: 999px; font-size: 12px; color: #b8c0cc; font-variant-numeric: tabular-nums; z-index: 999; pointer-events: none; letter-spacing: .5px; }
  #pageIndicator:empty { display: none; }

  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 10px; background: rgba(28,32,40,.95); border: 1px solid rgba(255,255,255,.1); color: #fff; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 3000; animation: toastIn .2s ease; pointer-events: none; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

  @media (max-width: 600px) {
    #toolbar { right: 6px; padding: 4px 3px; gap: 2px; }
    #toolbar button { width: 36px; height: 36px; font-size: 16px; }
    #submenu { right: 50px; }
    .nav-btn { width: 48px; height: 48px; font-size: 20px; bottom: 16px; }
    #btnPrev { left: 12px; }
    #btnNext { right: 12px; }
  }
</style>
</head>
<body>

<div id="stageWrapper">
  <div id="stage" data-tool="select">
    <div id="stageContent">
      <canvas id="pdfCanvas"></canvas>
      <svg id="svgLayer" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="embedLayer"></div>
      <canvas id="transientCanvas"></canvas>
      <canvas id="laserCanvas"></canvas>
    </div>
  </div>

  <div id="emptyState">
    <div class="icon">📄</div>
    <div>افتح ملف PDF للبدء</div>
    <button id="btnOpenEmpty">📂 اختر ملفاً</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loadingText">جارٍ التحميل…</div>
  </div>
</div>

<div id="pageIndicator"></div>

<div id="toolbar">
  <button data-tool="hand" title="يد">🖐️</button>
  <button data-tool="pen" data-submenu="pen" title="قلم" style="--indicator:#000000">✏️</button>
  <button data-tool="eraser" data-submenu="eraser" title="ممحاة">🧽</button>
  <button data-tool="laser" data-submenu="laser" title="ليزر" style="--indicator:#ff0000">🔴</button>
  <button data-tool="shape" data-submenu="shape" title="أشكال">▭</button>
  <button data-tool="embed" title="تضمين HTML">🔗</button>
  <button data-tool="select" title="تحديد">🖱️</button>
  <div class="tb-divider"></div>
  <button id="btnUndo" title="تراجع">↶</button>
  <button id="btnRedo" title="إعادة">↷</button>
  <div class="tb-divider"></div>
  <button id="btnFullscreen" title="ملء الشاشة">⛶</button>
  <button id="btnOpen" title="فتح ملف">📂</button>
</div>

<div id="submenu"></div>

<button class="nav-btn" id="btnPrev" title="السابق">←</button>
<button class="nav-btn" id="btnNext" title="التالي">→</button>

<input type="file" id="fileInput" accept="application/pdf,image/*" style="display:none">

<script type="module">
const PDFJS_VERSION = '4.7.76';
const PDFJS_BASE = `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VERSION}`;

let pdfjsLib;
try {
  pdfjsLib = await import(`${PDFJS_BASE}/build/pdf.min.mjs`);
  pdfjsLib.GlobalWorkerOptions.workerSrc = `${PDFJS_BASE}/build/pdf.worker.min.mjs`;
  console.log('[PDF] pdf.js v' + pdfjsLib.version);
} catch (err) {
  console.error('فشل تحميل pdf.js:', err);
  throw err;
}

/* ================================================================
   CONSTANTS
   ================================================================ */
const LASER_LIFE_MS = 5000;    // ★ 5 ثوان بعد آخر نشاط
const LASER_FADE_MS = 1500;    // مدة التلاشي
const UNDO_LIMIT = 50;
const COORD_WIDTH = 2000;

/* ================================================================
   DOM
   ================================================================ */
const $ = id => document.getElementById(id);
const stage = $('stage'), stageWrapper = $('stageWrapper'), stageContent = $('stageContent');
const pdfCanvas = $('pdfCanvas'), svgLayer = $('svgLayer'), embedLayer = $('embedLayer');
const transientCanvas = $('transientCanvas'), laserCanvas = $('laserCanvas');
const emptyState = $('emptyState'), loadingEl = $('loading'), loadingText = $('loadingText');
const pageIndicator = $('pageIndicator'), toolbar = $('toolbar'), submenu = $('submenu');
const fileInput = $('fileInput'), btnUndo = $('btnUndo'), btnRedo = $('btnRedo');
const btnPrev = $('btnPrev'), btnNext = $('btnNext');

const transCtx = transientCanvas.getContext('2d');
const laserCtx = laserCanvas.getContext('2d');
const SVG_NS = 'http://www.w3.org/2000/svg';

/* ================================================================
   STATE
   ================================================================ */
const state = {
  pdfDoc: null, currentPage: 1, totalPages: 0,
  pdfW: 0, pdfH: 0, canvasScale: 1,
  tool: 'select',
  penColor: '#000000', penSize: 3, eraserSize: 60,
  laserColor: '#ff0000', laserSize: 4,
  shapeKind: 'rect', shapeStroke: '#000000', shapeFill: '#ffffff',
  shapeFillNone: true, shapeSize: 3,
  selected: null, pages: {}, history: {},
};

/* ================================================================
   HELPERS
   ================================================================ */
function uid() { return 'a' + Math.random().toString(36).slice(2, 9); }
function getStagePoint(e) {
  const r = stage.getBoundingClientRect();
  return { x: ((e.clientX - r.left) / r.width) * state.pdfW,
           y: ((e.clientY - r.top) / r.height) * state.pdfH };
}
function setLoading(on, text) {
  loadingEl.classList.toggle('show', !!on);
  if (text) loadingText.textContent = text;
}
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}
function computeStageSize(naturalW, naturalH) {
  const wrap = stageWrapper.getBoundingClientRect();
  const availW = Math.max(80, wrap.width - 24 - 66);
  const availH = Math.max(80, wrap.height - 40 - 84);
  const aspect = naturalW / naturalH;
  let cssW = availW, cssH = cssW / aspect;
  if (cssH > availH) { cssH = availH; cssW = cssH * aspect; }
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  let canvasW = Math.ceil(cssW * dpr), canvasH = Math.ceil(cssH * dpr);
  const maxPixels = 16 * 1024 * 1024;
  if (canvasW * canvasH > maxPixels) {
    const f = Math.sqrt(maxPixels / (canvasW * canvasH));
    canvasW = Math.floor(canvasW * f); canvasH = Math.floor(canvasH * f);
  }
  return { cssW, cssH, canvasW, canvasH };
}

/* ================================================================
   SERIALIZATION
   ================================================================ */
function serializeSvgElement(el) {
  const tag = el.tagName.toLowerCase();
  const attrs = {};
  for (let i = 0; i < el.attributes.length; i++) {
    const a = el.attributes[i];
    if (['class', 'data-annot', 'data-id', 'selected'].includes(a.name)) continue;
    attrs[a.name] = a.value;
  }
  return { kind: 'svg', tag, attrs, dataId: el.dataset.id || uid(), shapeType: el.dataset.type || tag };
}
function deserializeSvgElement(spec) {
  const el = document.createElementNS(SVG_NS, spec.tag);
  Object.keys(spec.attrs || {}).forEach(k => el.setAttribute(k, spec.attrs[k]));
  el.dataset.annot = '1'; el.dataset.id = spec.dataId;
  if (spec.shapeType) el.dataset.type = spec.shapeType;
  el.classList.add('annot');
  return el;
}
function serializeEmbed(el) {
  return { kind: 'embed', url: el.dataset.url, x: el.style.left, y: el.style.top, w: el.style.width, h: el.style.height };
}
function snapshot() {
  const annotations = [];
  svgLayer.querySelectorAll('[data-annot]').forEach(el => {
    if (el.tagName.toLowerCase() === 'g') return;
    if (el.classList.contains('handle') || el.classList.contains('selection-outline')) return;
    annotations.push(serializeSvgElement(el));
  });
  const embeds = [];
  embedLayer.querySelectorAll('.embed').forEach(el => embeds.push(serializeEmbed(el)));
  return { annotations, embeds };
}
function applySnapshot(s) {
  deselect();
  while (svgLayer.firstChild) svgLayer.removeChild(svgLayer.firstChild);
  embedLayer.innerHTML = '';
  (s.annotations || []).forEach(spec => {
    try { svgLayer.appendChild(deserializeSvgElement(spec)); } catch (e) { console.warn(e); }
  });
  (s.embeds || []).forEach(spec => addEmbedElement(spec.url, spec.x, spec.y, spec.w, spec.h, false));
}

/* ================================================================
   HISTORY
   ================================================================ */
function getHistory() { return state.history[state.currentPage] || (state.history[state.currentPage] = { past: [], future: [] }); }
function savePageNow() { if (state.currentPage) state.pages[state.currentPage] = snapshot(); }
function commitChange(pre) {
  if (!state.currentPage) return;
  const h = getHistory();
  h.past.push(pre || { annotations: [], embeds: [] });
  if (h.past.length > UNDO_LIMIT) h.past.shift();
  h.future.length = 0; savePageNow(); updateUndoButtons();
}
function updateUndoButtons() {
  const h = state.history[state.currentPage] || { past: [], future: [] };
  btnUndo.disabled = h.past.length === 0;
  btnRedo.disabled = h.future.length === 0;
}
function undo() {
  if (!state.currentPage) return;
  const h = getHistory(); if (!h.past.length) return;
  h.future.push(snapshot());
  const p = h.past.pop();
  state.pages[state.currentPage] = p;
  applySnapshot(p); updateUndoButtons();
}
function redo() {
  if (!state.currentPage) return;
  const h = getHistory(); if (!h.future.length) return;
  h.past.push(snapshot());
  const n = h.future.pop();
  state.pages[state.currentPage] = n;
  applySnapshot(n); updateUndoButtons();
}

/* ================================================================
   LASER STATE
   ★ مؤقت عام واحد لكل الخطوط + ليزر أبيض مع glow ملوّن
   ================================================================ */
const laserStrokes = [];      // [{ points, color, width }]
let currentLaserStroke = null;
let laserRAF = null;
let laserLastActivity = 0;    // ★ الوقت الأخير لأي نشاط ليزر

function clearLaser() {
  laserStrokes.length = 0;
  currentLaserStroke = null;
  laserLastActivity = 0;
  laserCtx.clearRect(0, 0, laserCanvas.width, laserCanvas.height);
}
function clearTransient() { transCtx.clearRect(0, 0, transientCanvas.width, transientCanvas.height); }

function loadPageState(pageNum) {
  deselect(); clearLaser(); clearTransient();
  while (svgLayer.firstChild) svgLayer.removeChild(svgLayer.firstChild);
  embedLayer.innerHTML = '';
  const s = state.pages[pageNum]; if (s) applySnapshot(s);
}

function startLaserRAF() { if (laserRAF) return; laserRAF = requestAnimationFrame(laserTick); }

/* ★ الليزر: خط أبيض مع glow ملوّن + مؤقت عام */
function laserTick() {
  const now = performance.now();
  const k = state.canvasScale;

  if (laserStrokes.length === 0) {
    laserRAF = null;
    return;
  }

  /* ★ العمر محسوب من النشاط الأخير (أي لمسة) — يعيد الجميع للبداية */
  const age = now - laserLastActivity;
  let alpha = 1;
  if (age > LASER_LIFE_MS) {
    alpha = Math.max(0, 1 - (age - LASER_LIFE_MS) / LASER_FADE_MS);
  }

  laserCtx.setTransform(1, 0, 0, 1, 0, 0);
  laserCtx.clearRect(0, 0, laserCanvas.width, laserCanvas.height);

  if (alpha <= 0) {
    /* انتهى التلاشي — نظّف الكل */
    laserStrokes.length = 0;
    currentLaserStroke = null;
    laserRAF = null;
    return;
  }

  laserCtx.globalAlpha = alpha;
  laserCtx.lineCap = 'round';
  laserCtx.lineJoin = 'round';

  for (let i = 0; i < laserStrokes.length; i++) {
    const s = laserStrokes[i];
    if (!s.points || s.points.length < 1) continue;

    /* glow خارجي بلون الليزر المختار */
    laserCtx.shadowColor = s.color;
    laserCtx.shadowBlur = s.width * k * 2.5;
    /* الخط نفسه أبيض */
    laserCtx.strokeStyle = '#ffffff';
    laserCtx.lineWidth = s.width * k;

    laserCtx.beginPath();
    laserCtx.moveTo(s.points[0].x * k, s.points[0].y * k);
    if (s.points.length === 1) {
      /* نقطة واحدة: نرسم دائرة صغيرة */
      laserCtx.lineTo(s.points[0].x * k + 0.01, s.points[0].y * k);
    } else {
      for (let j = 1; j < s.points.length; j++) {
        laserCtx.lineTo(s.points[j].x * k, s.points[j].y * k);
      }
    }
    laserCtx.stroke();

    /* رسم ثانٍ بدون ظل لتقوية بياض الخط */
    laserCtx.shadowBlur = 0;
    laserCtx.shadowColor = 'transparent';
    laserCtx.strokeStyle = '#ffffff';
    laserCtx.lineWidth = Math.max(1, s.width * k * 0.5);
    laserCtx.beginPath();
    laserCtx.moveTo(s.points[0].x * k, s.points[0].y * k);
    for (let j = 1; j < s.points.length; j++) {
      laserCtx.lineTo(s.points[j].x * k, s.points[j].y * k);
    }
    laserCtx.stroke();
  }

  laserCtx.shadowBlur = 0;
  laserCtx.shadowColor = 'transparent';
  laserCtx.globalAlpha = 1;

  laserRAF = requestAnimationFrame(laserTick);
}

function laserStart(p) {
  /* ★ أي بداية جديدة تعيد المؤقت للصفر لكل الخطوط */
  laserLastActivity = performance.now();
  currentLaserStroke = {
    points: [p],
    color: state.laserColor,
    width: state.laserSize,
  };
  laserStrokes.push(currentLaserStroke);
  startLaserRAF();
}
function laserAdd(p) {
  if (!currentLaserStroke) return;
  const last = currentLaserStroke.points[currentLaserStroke.points.length - 1];
  if (Math.hypot(p.x - last.x, p.y - last.y) < 1.5) return;
  currentLaserStroke.points.push(p);
  /* ★ كل نقطة جديدة تُعيد المؤقت لكل الخطوط */
  laserLastActivity = performance.now();
}
function laserEnd() {
  currentLaserStroke = null;
  /* ★ حتى رفع الإصبع يُعتبر نشاطاً */
  laserLastActivity = performance.now();
}

/* ================================================================
   ★ ERASER — يرسم خطاً أبيض ويمسح ما يلامسه
   ================================================================ */
let eraserPoints = null;
let eraserPreSnapshot = null;
let eraserActive = false;

function eraserBegin(p) {
  eraserActive = true;
  eraserPoints = [p];
  eraserPreSnapshot = snapshot();
  eraserDraw();
  eraserEraseAt(p);
}

function eraserMoveTo(p) {
  if (!eraserActive) return;
  const last = eraserPoints[eraserPoints.length - 1];
  eraserPoints.push(p);
  eraserDraw();
  eraserEraseSegment(last, p);
}

function eraserEnd() {
  if (!eraserActive) return;
  eraserActive = false;
  eraserPoints = null;
  clearTransient();
  if (eraserPreSnapshot) {
    commitChange(eraserPreSnapshot);
    eraserPreSnapshot = null;
  }
}

/* ★ ارسم خط الممحاة الأبيض مع ظل خفيف ليظهر حتى على خلفية بيضاء */
function eraserDraw() {
  const k = state.canvasScale;
  const size = state.eraserSize;
  transCtx.setTransform(1, 0, 0, 1, 0, 0);
  transCtx.clearRect(0, 0, transientCanvas.width, transientCanvas.height);
  if (!eraserPoints || eraserPoints.length < 1) return;

  transCtx.lineCap = 'round';
  transCtx.lineJoin = 'round';

  /* مرور أول: ظل رمادي خفيف */
  transCtx.shadowColor = 'rgba(0,0,0,0.28)';
  transCtx.shadowBlur = 5 * k;
  transCtx.strokeStyle = '#ffffff';
  transCtx.fillStyle = '#ffffff';
  transCtx.lineWidth = size * k;

  if (eraserPoints.length === 1) {
    const p0 = eraserPoints[0];
    transCtx.beginPath();
    transCtx.arc(p0.x * k, p0.y * k, (size * k) / 2, 0, Math.PI * 2);
    transCtx.fill();
  } else {
    transCtx.beginPath();
    transCtx.moveTo(eraserPoints[0].x * k, eraserPoints[0].y * k);
    for (let i = 1; i < eraserPoints.length; i++) {
      transCtx.lineTo(eraserPoints[i].x * k, eraserPoints[i].y * k);
    }
    transCtx.stroke();
  }

  transCtx.shadowBlur = 0;
  transCtx.shadowColor = 'transparent';
}

/* ★ امسح أي شكل SVG يلامس النقطة */
function eraserEraseAt(p) {
  const tol = Math.max(state.eraserSize / 2, 6);
  const toRemove = [];
  svgLayer.querySelectorAll('[data-annot]').forEach(el => {
    if (el.tagName.toLowerCase() === 'g') return;
    if (isPointNearShape(p, el, tol)) toRemove.push(el);
  });
  toRemove.forEach(el => {
    if (state.selected && state.selected.el === el) state.selected = null;
    el.remove();
  });
  return toRemove.length;
}

/* ★ امسح على طول المقطع (نُعيّن نقاط وسيطة) */
function eraserEraseSegment(a, b) {
  const dist = Math.hypot(b.x - a.x, b.y - a.y);
  const step = Math.max(state.eraserSize / 3, 4);
  const n = Math.max(1, Math.ceil(dist / step));
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    eraserEraseAt({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
  }
}

/* ================================================================
   PDF RENDER
   ================================================================ */
async function renderPage(pageNum) {
  if (!state.pdfDoc) return;
  setLoading(true, 'جارٍ عرض الصفحة…');
  try {
    const page = await state.pdfDoc.getPage(pageNum);
    const vp1 = page.getViewport({ scale: 1 });

    state.pdfW = COORD_WIDTH;
    state.pdfH = Math.round(vp1.height * (COORD_WIDTH / vp1.width));

    const { cssW, cssH, canvasW, canvasH } = computeStageSize(vp1.width, vp1.height);
    state.canvasScale = canvasW / state.pdfW;

    stage.style.width = cssW + 'px';
    stage.style.height = cssH + 'px';

    [pdfCanvas, transientCanvas, laserCanvas].forEach(c => {
      c.width = canvasW; c.height = canvasH;
    });
    svgLayer.setAttribute('viewBox', `0 0 ${state.pdfW} ${state.pdfH}`);

    const ctx = pdfCanvas.getContext('2d', { alpha: false });
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvasW, canvasH);

    const renderScale = canvasW / vp1.width;
    const viewport = page.getViewport({ scale: renderScale });

    await page.render({ canvasContext: ctx, viewport, background: '#ffffff' }).promise;

    stageContent.style.transition = 'none';
    stageContent.style.transform = '';

    loadPageState(pageNum);
    updatePageIndicator(); updateUndoButtons();
    emptyState.style.display = 'none';
  } catch (err) {
    console.error('render error', err);
    toast('تعذّر عرض الصفحة: ' + (err.message || err));
  } finally { setLoading(false); }
}

async function loadPdfFile(file) {
  setLoading(true, 'جارٍ قراءة الملف…');
  try {
    const buf = await file.arrayBuffer();
    const doc = await pdfjsLib.getDocument({
      data: buf,
      cMapUrl: `${PDFJS_BASE}/cmaps/`,
      cMapPacked: true,
      standardFontDataUrl: `${PDFJS_BASE}/standard_fonts/`,
      wasmUrl: `${PDFJS_BASE}/wasm/`,
      useSystemFonts: false,
      disableFontFace: false,
      isEvalSupported: false,
      disableRange: false,
      disableStream: false,
      disableAutoFetch: false,
      fontExtraProperties: true,
      verbosity: 0,
    }).promise;

    state.pdfDoc = doc;
    state.totalPages = doc.numPages;
    state.currentPage = 1;
    state.pages = {}; state.history = {}; state.selected = null;
    updateUndoButtons();
    await renderPage(1);
  } catch (err) {
    console.error(err);
    setLoading(false);
    alert('تعذّر فتح PDF: ' + err.message);
  }
}

async function loadImageFile(file) {
  setLoading(true, 'جارٍ تحميل الصورة…');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('صورة غير صالحة'));
      i.src = url;
    });
    state.pdfDoc = null; state.totalPages = 1; state.currentPage = 1;
    state.pages = {}; state.history = {};
    state.pdfW = COORD_WIDTH;
    state.pdfH = Math.round(COORD_WIDTH * img.height / img.width);
    const { cssW, cssH, canvasW, canvasH } = computeStageSize(img.width, img.height);
    state.canvasScale = canvasW / state.pdfW;
    stage.style.width = cssW + 'px'; stage.style.height = cssH + 'px';
    [pdfCanvas, transientCanvas, laserCanvas].forEach(c => { c.width = canvasW; c.height = canvasH; });
    svgLayer.setAttribute('viewBox', `0 0 ${state.pdfW} ${state.pdfH}`);
    const ctx = pdfCanvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvasW, canvasH);
    ctx.drawImage(img, 0, 0, canvasW, canvasH);
    deselect(); clearLaser(); clearTransient();
    while (svgLayer.firstChild) svgLayer.removeChild(svgLayer.firstChild);
    embedLayer.innerHTML = '';
    stageContent.style.transform = '';
    updatePageIndicator(); updateUndoButtons();
    emptyState.style.display = 'none';
  } catch (err) { console.error(err); alert(err.message); }
  finally { URL.revokeObjectURL(url); setLoading(false); }
}

function updatePageIndicator() {
  if (!state.totalPages) { pageIndicator.textContent = ''; return; }
  pageIndicator.textContent = state.currentPage + ' / ' + state.totalPages;
  btnPrev.disabled = state.currentPage <= 1;
  btnNext.disabled = state.currentPage >= state.totalPages;
}

/* ================================================================
   RESIZE
   ================================================================ */
let resizeTimer = null;
function handleResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(async () => {
    if (state.pdfDoc && state.currentPage) {
      savePageNow();
      await renderPage(state.currentPage);
    }
  }, 250);
}
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', () => setTimeout(() => window.dispatchEvent(new Event('resize')), 300));

/* ================================================================
   NAVIGATION
   ================================================================ */
let sliding = false;
async function goToPage(newPage, dir) {
  if (sliding || newPage < 1 || newPage > state.totalPages || newPage === state.currentPage) return;
  sliding = true;
  savePageNow();
  const w = stage.clientWidth;
  const outX = dir === 'next' ? -w : w;
  const inX = dir === 'next' ? w : -w;
  stageContent.style.transition = 'transform .22s ease-out';
  stageContent.style.transform = `translateX(${outX}px)`;
  await new Promise(r => setTimeout(r, 220));
  state.currentPage = newPage;
  if (state.pdfDoc) await renderPage(newPage);
  else { loadPageState(newPage); updatePageIndicator(); updateUndoButtons(); }
  stageContent.style.transition = 'none';
  stageContent.style.transform = `translateX(${inX}px)`;
  void stageContent.offsetWidth;
  stageContent.style.transition = 'transform .22s ease-out';
  stageContent.style.transform = 'translateX(0)';
  setTimeout(() => {
    stageContent.style.transition = ''; stageContent.style.transform = '';
    sliding = false;
  }, 240);
}

/* ================================================================
   TOOLBAR
   ================================================================ */
function setTool(tool) {
  if (tool !== 'select') deselect();
  state.tool = tool;
  stage.dataset.tool = tool;
  document.querySelectorAll('#toolbar button[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
  closeSubmenu();
}
function bindPress(el, handler) {
  let fired = false;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    fired = true; e.preventDefault(); e.stopPropagation(); handler(e);
  }, { passive: false });
  el.addEventListener('click', e => {
    if (fired) { fired = false; e.preventDefault(); e.stopPropagation(); return; }
    if (e.pointerType === undefined) { e.preventDefault(); e.stopPropagation(); handler(e); }
  });
}
toolbar.querySelectorAll('button').forEach(btn => {
  bindPress(btn, () => {
    if (btn.id === 'btnUndo') { undo(); return; }
    if (btn.id === 'btnRedo') { redo(); return; }
    if (btn.id === 'btnFullscreen') { toggleFullscreen(); return; }
    if (btn.id === 'btnOpen') { fileInput.click(); return; }
    const tool = btn.dataset.tool; if (!tool) return;
    if (tool === 'embed') { openEmbedDialog(); return; }
    const wasActive = btn.classList.contains('active');
    const hasSub = btn.dataset.submenu;
    if (wasActive && hasSub && submenu.classList.contains('show')) { closeSubmenu(); return; }
    setTool(tool);
    if (hasSub) openSubmenu(btn, btn.dataset.submenu);
  });
});
function toggleFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen().catch(console.warn);
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen().catch(console.warn);
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}

/* ================================================================
   SUBMENU
   ================================================================ */
let submenuOwner = null;
function closeSubmenu() { submenu.classList.remove('show'); submenu.innerHTML = ''; submenuOwner = null; }
function repositionSubmenu() {
  if (!submenuOwner || !submenu.classList.contains('show')) return;
  const r = submenuOwner.getBoundingClientRect();
  let top = r.top; const h = submenu.offsetHeight;
  if (top + h > window.innerHeight - 8) top = window.innerHeight - h - 8;
  if (top < 8) top = 8;
  submenu.style.top = top + 'px';
}
function openSubmenu(ownerBtn, kind) {
  submenuOwner = ownerBtn;
  submenu.innerHTML = renderSubmenuHTML(kind);
  submenu.classList.add('show');
  requestAnimationFrame(repositionSubmenu);
  bindSubmenuHandlers();
}
function renderSubmenuHTML(kind) {
  if (kind === 'pen') return renderColorSize(state.penColor, state.penSize, 'pen');
  if (kind === 'eraser') return renderEraserSizes(state.eraserSize);
  if (kind === 'laser') return renderLaserSubmenu();
  if (kind === 'shape') return renderShapeSubmenu();
  return '';
}
function renderColorSize(color, size, kind) {
  const colors = ['#000000', '#e11d48', '#2563eb', '#eab308'];
  const sizes = [2, 5, 10];
  return `
    <div class="sub-section"><div class="sub-label">اللون</div><div class="color-grid">
      ${colors.map(c => `<button type="button" class="color-btn ${c === color ? 'active' : ''}" data-kind="${kind}" data-color="${c}"><div class="swatch" style="background:${c}"></div></button>`).join('')}
    </div></div>
    <div class="sub-section"><div class="sub-label">الحجم</div><div class="size-grid">
      ${sizes.map(s => `<button type="button" class="size-btn ${s === size ? 'active' : ''}" data-kind="${kind}" data-size="${s}"><div class="dot" style="width:${Math.max(3, s)}px;height:${Math.max(3, s)}px"></div></button>`).join('')}
    </div></div>`;
}
function renderLaserSubmenu() {
  /* ★ ألوان الليزر هي ألوان الـ glow */
  const colors = ['#ff0000', '#2563eb', '#22c55e', '#eab308'];
  const sizes = [3, 6, 12];
  return `
    <div class="sub-section"><div class="sub-label">لون الـ Glow</div><div class="color-grid">
      ${colors.map(c => `<button type="button" class="color-btn ${c === state.laserColor ? 'active' : ''}" data-kind="laser" data-color="${c}"><div class="swatch" style="background:${c}"></div></button>`).join('')}
    </div></div>
    <div class="sub-section"><div class="sub-label">الحجم</div><div class="size-grid">
      ${sizes.map(s => `<button type="button" class="size-btn ${s === state.laserSize ? 'active' : ''}" data-kind="laser" data-size="${s}"><div class="dot" style="width:${Math.max(3, s)}px;height:${Math.max(3, s)}px"></div></button>`).join('')}
    </div></div>`;
}
function renderEraserSizes(size) {
  /* ★ أحجام أكبر تناسب اللمس */
  const sizes = [40, 80, 140];
  return `
    <div class="sub-section"><div class="sub-label">الحجم</div><div class="size-grid">
      ${sizes.map(s => `<button type="button" class="size-btn ${s === size ? 'active' : ''}" data-kind="eraser" data-size="${s}"><div class="dot" style="width:${Math.min(20, s / 4)}px;height:${Math.min(20, s / 4)}px"></div></button>`).join('')}
    </div></div>`;
}
function renderShapeSubmenu() {
  const kinds = [{ k: 'rect', label: '▭' }, { k: 'circle', label: '◯' }, { k: 'line', label: '╱' }];
  const sizes = [2, 5, 10];
  return `
    <div class="sub-section"><div class="sub-label">الشكل</div><div class="shape-grid">
      ${kinds.map(o => `<button type="button" class="shape-btn ${o.k === state.shapeKind ? 'active' : ''}" data-shape="${o.k}">${o.label}</button>`).join('')}
    </div></div>
    <div class="sub-section"><div class="sub-label">الحدود</div><div class="color-input-row">
      <input type="color" id="subShapeStroke" value="${state.shapeStroke}">
    </div></div>
    <div class="sub-section"><div class="sub-label">التعبئة</div><div class="color-input-row">
      <input type="color" id="subShapeFill" value="${state.shapeFill}" ${state.shapeFillNone ? 'disabled' : ''}>
    </div><div class="color-input-row">
      <label><input type="checkbox" id="subNoFill" ${state.shapeFillNone ? 'checked' : ''}> بدون تعبئة</label>
    </div></div>
    <div class="sub-section"><div class="sub-label">السماكة</div><div class="size-grid">
      ${sizes.map(s => `<button type="button" class="size-btn ${s === state.shapeSize ? 'active' : ''}" data-kind="shape" data-size="${s}"><div class="dot" style="width:${Math.max(3, s)}px;height:${Math.max(3, s)}px"></div></button>`).join('')}
    </div></div>`;
}
function bindSubmenuHandlers() {
  submenu.querySelectorAll('.color-btn').forEach(btn => {
    bindPress(btn, () => {
      const kind = btn.dataset.kind, color = btn.dataset.color;
      if (kind === 'pen') state.penColor = color;
      else if (kind === 'laser') state.laserColor = color;
      submenu.querySelectorAll(`.color-btn[data-kind="${kind}"]`).forEach(b => b.classList.toggle('active', b.dataset.color === color));
      updateToolbarIndicators();
    });
  });
  submenu.querySelectorAll('.size-btn').forEach(btn => {
    bindPress(btn, () => {
      const kind = btn.dataset.kind, size = parseInt(btn.dataset.size, 10);
      if (kind === 'pen') state.penSize = size;
      else if (kind === 'eraser') state.eraserSize = size;
      else if (kind === 'laser') state.laserSize = size;
      else if (kind === 'shape') state.shapeSize = size;
      submenu.querySelectorAll(`.size-btn[data-kind="${kind}"]`).forEach(b => b.classList.toggle('active', parseInt(b.dataset.size, 10) === size));
    });
  });
  submenu.querySelectorAll('.shape-btn').forEach(btn => {
    bindPress(btn, () => {
      state.shapeKind = btn.dataset.shape;
      submenu.querySelectorAll('.shape-btn').forEach(b => b.classList.toggle('active', b.dataset.shape === state.shapeKind));
    });
  });
}
submenu.addEventListener('input', e => {
  if (e.target.id === 'subShapeStroke') state.shapeStroke = e.target.value;
  if (e.target.id === 'subShapeFill') state.shapeFill = e.target.value;
  if (e.target.id === 'subNoFill') {
    state.shapeFillNone = e.target.checked;
    const fi = submenu.querySelector('#subShapeFill'); if (fi) fi.disabled = state.shapeFillNone;
  }
});
function updateToolbarIndicators() {
  const p = toolbar.querySelector('button[data-tool="pen"]');
  const l = toolbar.querySelector('button[data-tool="laser"]');
  if (p) p.style.setProperty('--indicator', state.penColor);
  if (l) l.style.setProperty('--indicator', state.laserColor);
}

/* ================================================================
   EMBED
   ================================================================ */
function openEmbedDialog() {
  const backdrop = document.createElement('div');
  backdrop.className = 'dialog-backdrop';
  backdrop.innerHTML = `
    <div class="dialog">
      <h3>🔗 تضمين وسائط تفاعلية</h3>
      <input type="url" id="embedUrlInput" placeholder="https://example.com/game" autofocus>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" data-action="cancel">إلغاء</button>
        <button type="button" class="btn-primary" data-action="ok">تضمين</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const input = backdrop.querySelector('#embedUrlInput');
  setTimeout(() => { try { input.focus(); } catch(_) {} }, 50);
  function close() { backdrop.remove(); }
  function submit() {
    let url = (input.value || '').trim(); if (!url) { close(); return; }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    const pre = snapshot(); addEmbedElement(url); commitChange(pre);
    close(); setTool('select');
  }
  bindPress(backdrop.querySelector('[data-action="cancel"]'), close);
  bindPress(backdrop.querySelector('[data-action="ok"]'), submit);
  backdrop.addEventListener('click', e => { if (e.target === backdrop) close(); });
  input.addEventListener('keydown', e => {

/* ================================================================

   ================================================================ */
function distToSegment(px, py, x1, y1, x2, y2) {

/* ★ دالة موحّدة لإنشاء عنصر شكل (يُستخدم أثناء الرسم) */

/* ================================================================

   ================================================================ */

/* ================================================================
   INTERACTION
   ================================================================ */
let interaction = null, handDrag = null;

stage.addEventListener('pointerdown', e => {
  if (!state.pdfW) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.target.closest && e.target.closest('.embed')) return;
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  const p = getStagePoint(e), tool = state.tool;
  closeSubmenu();

  if (tool === 'hand') {
    stage.classList.add('dragging');
    handDrag = { startX: e.clientX, dx: 0 };
    interaction = { type: 'hand' }; e.preventDefault(); return;
  }
  if (tool === 'select') {
    const handle = e.target.closest && e.target.closest('.handle');
    if (handle && state.selected && state.selected.kind === 'svg') {
      interaction = { type: 'resizeSvg', el: state.selected.el, handle: handle.dataset.handle, start: p, pre: snapshot() };
      e.preventDefault(); return;
    }
    const annot = e.target.closest && e.target.closest('[data-annot]');
    if (annot && annot.tagName.toLowerCase() !== 'g' && !annot.classList.contains('handle')) {
      selectAnnotation(annot);

  if (tool === 'laser') { laserStart(p); interaction = { type: 'laser' }; e.preventDefault(); return; }
  if (tool === 'eraser') {
    /* ★ ابدأ مسح مستمر */
    eraserBegin(p);
    interaction = { type: 'eraser' };
    e.preventDefault(); return;
  }
  if (tool === 'shape') {
    /* ★ إنشاء الشكل مباشرة في اللوحة، مع لقطة "قبل" صحيحة */
    const pre = snapshot();
    const el = createShapeElement(state.shapeKind);
    if (state.shapeKind === 'rect') {
      el.setAttribute('x', p.x); el.setAttribute('y', p.y);
      el.setAttribute('width', 0); el.setAttribute('height', 0);
    } else if (state.shapeKind === 'circle') {
      el.setAttribute('cx', p.x); el.setAttribute('cy', p.y);
      el.setAttribute('rx', 0); el.setAttribute('ry', 0);
    } else {
      el.setAttribute('x1', p.x); el.setAttribute('y1', p.y);
      el.setAttribute('x2', p.x); el.setAttribute('y2', p.y);

stage.addEventListener('pointermove', e => {
  if (!interaction) return;
  const p = getStagePoint(e);
  if (interaction.type === 'hand' && handDrag) {
    handDrag.dx = e.clientX - handDrag.startX;
    stageContent.style.transition = 'none';
    stageContent.style.transform = `translateX(${handDrag.dx}px)`;
    return;
  }
  if (interaction.type === 'pen') {
    const last = interaction.points[interaction.points.length - 1];
    if (Math.hypot(p.x - last.x, p.y - last.y) > 1.5) { interaction.points.push(p); drawPenPreview(interaction.points); }
    return;
  }
  if (interaction.type === 'laser') { laserAdd(p); return; }
  if (interaction.type === 'eraser') { eraserMoveTo(p); return; }
  if (interaction.type === 'shapeDraw') {
    const el = interaction.el, s = interaction.start;
    if (interaction.kind === 'rect') {
      el.setAttribute('x', Math.min(s.x, p.x)); el.setAttribute('y', Math.min(s.y, p.y));
      el.setAttribute('width', Math.abs(p.x - s.x)); el.setAttribute('height', Math.abs(p.y - s.y));
    } else if (interaction.kind === 'circle') {
      el.setAttribute('cx', (s.x + p.x) / 2); el.setAttribute('cy', (s.y + p.y) / 2);
      el.setAttribute('rx', Math.abs(p.x - s.x) / 2); el.setAttribute('ry', Math.abs(p.y - s.y) / 2);
    } else {
      el.setAttribute('x2', p.x); el.setAttribute('y2', p.y);

  }

    applySvgGeom(interaction.el, interaction.orig, p.x - interaction.start.x, p.y - interaction.start.y);

  }

    drawSelectionOverlay(interaction.el); return;
  }

stage.addEventListener('pointerup', onStageUp);
stage.addEventListener('pointercancel', onStageUp);

function onStageUp(e) {
  if (!interaction) return;
  const inter = interaction; interaction = null;
  try { stage.releasePointerCapture(e.pointerId); } catch (_) {}

  if (inter.type === 'hand' && handDrag) {
    stage.classList.remove('dragging');
    const dx = handDrag.dx, w = stage.clientWidth, thr = w * 0.15;
    handDrag = null;
    if (dx < -thr && state.currentPage < state.totalPages) goToPage(state.currentPage + 1, 'next');
    else if (dx > thr && state.currentPage > 1) goToPage(state.currentPage - 1, 'prev');

      stageContent.style.transition = 'transform .2s ease';
      stageContent.style.transform = 'translateX(0)';
      setTimeout(() => { stageContent.style.transition = ''; stageContent.style.transform = ''; }, 220);
    }
    return;
  }
  if (inter.type === 'pen') {
    if (inter.points.length >= 2) { const p = commitPen(inter.points); if (p) commitChange(inter.pre); }
    clearTransient(); return;
  }
  if (inter.type === 'laser') { laserEnd(); return; }
  if (inter.type === 'eraser') { eraserEnd(); return; }
  if (inter.type === 'shapeDraw') {
    /* ★ تحقّق من الحجم، إن كان صغيراً جداً احذفه */
    const el = inter.el, kind = inter.kind;
    let tooSmall = false;
    if (kind === 'rect') {
      if (+el.getAttribute('width') < 15 || +el.getAttribute('height') < 15) tooSmall = true;
    } else if (kind === 'circle') {
      if (+el.getAttribute('rx') < 10 || +el.getAttribute('ry') < 10) tooSmall = true;
    } else {
      const d = Math.hypot(+el.getAttribute('x2') - +el.getAttribute('x1'), +el.getAttribute('y2') - +el.getAttribute('y1'));

    }

    } else {

    else if (handle === 'sw') { el.setAttribute('rx', Math.max(3, g.rx - dx/2)); el.setAttribute('ry', Math.max(3, g.ry + dy/2)); el.setAttribute('cx', g.cx + dx/2); el.setAttribute('cy', g.cy + dy/2); }

  if (e.target.matches('input, textarea, select')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) { e.preventDefault(); redo(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (state.selected) {
      const pre = snapshot();
      if (state.selected.kind === 'svg') state.selected.el.remove();
      if (state.selected.kind === 'embed') state.selected.el.remove();
      state.selected = null;
      svgLayer.querySelectorAll('.selection-overlay').forEach(n => n.remove());
      commitChange(pre); e.preventDefault();
    }
    return;
  }
  if (e.key === 'Escape') { deselect(); closeSubmenu(); return; }
  const map = { h: 'hand', v: 'select', p: 'pen', e: 'eraser', a: 'laser', s: 'shape' };
  const t = map[e.key.toLowerCase()]; if (t) setTool(t);
  if (e.key === 'ArrowRight') goToPage(state.currentPage + 1, 'next');
  if (e.key === 'ArrowLeft') goToPage(state.currentPage - 1, 'prev');
