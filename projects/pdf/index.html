<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل الـ PDF والتطبيق التفاعلي</title>
    
    <!-- 🎨 Correct local stylesheet loading -->
    <link rel="stylesheet" href="./tldraw.css">

    <style>
        body, html, #root {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; font-family: sans-serif; background-color: #f8f9fa;
        }
        .toolbar {
            position: absolute; top: 15px; right: 15px;
            background: rgba(30, 30, 30, 0.95); padding: 12px 18px;
            border-radius: 8px; display: flex; gap: 12px;
            align-items: center; z-index: 9999; direction: rtl;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25); color: #fff;
        }
        .btn {
            color: white; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-pdf { background: #007bff; }
        .btn-game { background: #28a745; }
    </style>
</head>
<body>

    <div id="root"></div>

    <!-- 💡 Safe ES Module imports via unified browser package paths -->
    <script type="module">
        import React, { useState } from 'https://unpkg.com';
        import ReactDOM from 'https://unpkg.com';
        import { Tldraw, defaultEmbedDefinitions } from 'https://unpkg.com';

        function App() {
            const [editor, setEditor] = useState(null);

            const customEmbeds = [
                ...defaultEmbedDefinitions,
                {
                    type: 'interactive-game',
                    title: 'Interactive Game',
                    hostnames: ['ahmedsm12.github.io'],
                    minWidth: 400, minHeight: 300, doesResize: true,
                    toEmbedUrl: (url) => url,
                    fromEmbedUrl: (url) => url,
                    sandbox: 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals',
                }
            ];

            const handlePdfUpload = (event) => {
                const file = event.target.files[0];
                if (!file || !editor) return;

                const fileUrl = URL.createObjectURL(file);
                
                editor.createShapes([
                    {
                        id: editor.createShapeId(),
                        type: 'image',
                        x: editor.getViewportPageBounds().centerX - 200,
                        y: editor.getViewportPageBounds().centerY - 250,
                        props: {
                            w: 400, h: 500, src: fileUrl, name: file.name
                        },
                    },
                ]);
            };

            const insertGameEmbed = () => {
                if (!editor) return;
                const gameUrl = "https://github.io";
                
                editor.createShapes([
                    {
                        id: editor.createShapeId(),
                        type: 'embed',
                        x: editor.getViewportPageBounds().centerX - 300,
                        y: editor.getViewportPageBounds().centerY - 200,
                        props: {
                            w: 600, h: 400, url: gameUrl
                        },
                    },
                ]);
            };

            return React.createElement('div', { style: { width: '100%', height: '100%', position: 'relative' } },
                React.createElement('div', { className: 'toolbar' },
                    React.createElement('span', { style: { fontSize: '14px', fontWeight: 'bold' } }, 'التحكم التفاعلي:'),
                    React.createElement('label', { className: 'btn btn-pdf' }, '📁 فتح ملف PDF',
                        React.createElement('input', { type: 'file', accept: '.pdf,image/*', onChange: handlePdfUpload, style: { display: 'none' } })
                    ),
                    React.createElement('button', { onClick: insertGameEmbed, className: 'btn btn-game' }, '🎮 إضافة اللعبة التفاعلية')
                ),
                React.createElement(Tldraw, {
                    onMount: (edt) => setEditor(edt),
                    embedDefinitions: customEmbeds,
                    options: { unmountOnBlur: false }
                })
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(App));
    </script>
</body>
</html>
