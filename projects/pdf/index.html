<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>لوحة PDF التفاعلية</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: #0f1115; color: #eee;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }

  #stageWrapper {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: #0f1115;
  }
  #stage {
    position: relative; background: #fff;
    box-shadow: 0 20px 60px rgba(0,0,0,.7);
    overflow: hidden;
    touch-action: none;
    border-radius: 4px;
  }
  #stageContent {
    position: absolute; inset: 0;
    will-change: transform;
  }
  #stageContent > * {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #pdfCanvas { z-index: 1; pointer-events: none; }
  #svgLayer  { z-index: 2; pointer-events: none; }
  #embedLayer { z-index: 3; pointer-events: none; }
  #transientCanvas { z-index: 4; pointer-events: none; }
  #laserCanvas { z-index: 5; pointer-events: none; }

  #stage[data-tool="hand"]   { cursor: grab; }
  #stage[data-tool="hand"].dragging { cursor: grabbing; }
  #stage[data-tool="pen"],
  #stage[data-tool="laser"],
  #stage[data-tool="rect"],
  #stage[data-tool="circle"],
  #stage[data-tool="line"] { cursor: crosshair; }
  #stage[data-tool="eraser"] { cursor: cell; }

  #svgLayer [data-annot] { pointer-events: none; }
  #stage[data-tool="select"] #svgLayer [data-annot] { pointer-events: auto; cursor: move; }
  .annot { vector-effect: non-scaling-stroke; }

  .selection-outline {
    fill: none; stroke: #4a7eff; stroke-width: 1.5;
    stroke-dasharray: 5 3;
    vector-effect: non-scaling-stroke; pointer-events: none;
  }
  .handle {
    fill: #fff; stroke: #4a7eff; stroke-width: 2;
    vector-effect: non-scaling-stroke; cursor: pointer;
    pointer-events: auto;
  }
  .handle.nw, .handle.se { cursor: nwse-resize; }
  .handle.ne, .handle.sw { cursor: nesw-resize; }

  #embedLayer .embed {
    position: absolute; pointer-events: auto;
    display: flex; flex-direction: column;
    background: #fff;
    border: 1px solid #4a7eff;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
    transition: box-shadow .15s;
  }
  #embedLayer .embed.selected {
    box-shadow: 0 0 0 2px rgba(74,126,255,.35), 0 2px 8px rgba(0,0,0,.2);
  }
  .embed-header {
    height: 22px; background: #4a7eff; color: #fff;
    padding: 0 5px; font-size: 10px;
    display: flex; justify-content: space-between;
    align-items: center; gap: 4px;
    cursor: move; user-select: none; flex-shrink: 0;
    opacity: 0; transition: opacity .15s;
  }
  #stage[data-tool="select"] .embed:hover .embed-header,
  #stage[data-tool="select"] .embed.selected .embed-header { opacity: 1; }
  #stage:not([data-tool="select"]) .embed-header { pointer-events: none; }
  .embed-title {
    flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; direction: ltr; text-align: left;
    font-weight: 500;
  }
  .embed-close {
    background: rgba(0,0,0,.25); border: none; color: #fff;
    width: 18px; height: 18px; border-radius: 3px; cursor: pointer;
    font-size: 13px; line-height: 1; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .embed-close:hover { background: rgba(0,0,0,.5); }
  .embed iframe {
    flex: 1; border: none; background: #fff; width: 100%;
    min-height: 0; display: block;
  }
  #stage:not([data-tool="select"]) .embed iframe { pointer-events: none; }
  .embed-resize {
    position: absolute; width: 14px; height: 14px;
    background: #4a7eff; border: 2px solid #fff; border-radius: 50%;
    bottom: -7px; right: -7px; cursor: nwse-resize;
    z-index: 10; display: none;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  #stage[data-tool="select"] .embed.selected .embed-resize { display: block; }

  #toolbar {
    position: fixed; right: 10px; top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 3px;
    padding: 5px 4px;
    background: rgba(28,32,40,.94);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    z-index: 1000;
    touch-action: manipulation;
  }
  #toolbar button {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; color: #d4d9e2;
    border: none; border-radius: 10px;
    font-size: 18px; cursor: pointer;
    transition: background .14s, transform .1s, color .14s;
    position: relative;
    touch-action: manipulation;
  }
  #toolbar button:hover { background: rgba(255,255,255,.09); }
  #toolbar button:active { transform: scale(.92); }
  #toolbar button.active { background: #4a7eff; color: #fff; }
  #toolbar button:disabled { opacity: .3; cursor: not-allowed; }
  #toolbar .tb-divider { height: 1px; background: rgba(255,255,255,.08); margin: 3px 6px; }

  #toolbar button[data-tool="pen"]::after,
  #toolbar button[data-tool="laser"]::after {
    content: ''; position: absolute;
    bottom: 4px; right: 5px;
    width: 8px; height: 8px; border-radius: 50%;
    border: 1.5px solid #1c2028;
    background: var(--indicator, transparent);
  }

  #submenu {
    position: fixed;
    right: 58px;
    display: none;
    flex-direction: column;
    min-width: 60px;
    padding: 7px 5px;
    background: rgba(28,32,40,.96);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    z-index: 1001;
    animation: subIn .15s ease-out;
    touch-action: manipulation;
  }
  @keyframes subIn { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }
  #submenu.show { display: flex; }
  .sub-label { font-size: 9px; color: #8a94a6; text-align: center; padding: 2px 0 4px; letter-spacing: .5px; font-weight: 600; }
  .sub-section { padding: 4px 0; }
  .sub-section + .sub-section { border-top: 1px solid rgba(255,255,255,.06); }
  .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 0 2px; }
  .color-btn { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center; margin: 2px auto; transition: transform .12s; touch-action: manipulation; }
  .color-btn .swatch { width: 100%; height: 100%; border-radius: 50%; border: 1px solid rgba(0,0,0,.3); }
  .color-btn:active { transform: scale(1.15); }
  .color-btn.active { border-color: #4a7eff; }
  .size-grid { display: flex; flex-direction: column; gap: 3px; align-items: center; padding: 2px 0; }
  .size-btn { width: 34px; height: 24px; background: rgba(255,255,255,.04); border: 1px solid transparent; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .12s; touch-action: manipulation; }
  .size-btn:active { background: rgba(255,255,255,.14); }
  .size-btn.active { border-color: #4a7eff; background: rgba(74,126,255,.15); }
  .size-btn .dot { border-radius: 50%; background: #d4d9e2; }
  .shape-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; padding: 0 2px; }
  .shape-btn { width: 30px; height: 30px; background: rgba(255,255,255,.04); border: 1px solid transparent; border-radius: 6px; color: #d4d9e2; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all .12s; touch-action: manipulation; }
  .shape-btn:active { background: rgba(255,255,255,.14); }
  .shape-btn.active { border-color: #4a7eff; background: rgba(74,126,255,.15); }
  .color-input-row { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 3px 0; }
  .color-input-row input[type="color"] { width: 32px; height: 26px; border: 1px solid rgba(255,255,255,.15); border-radius: 6px; padding: 1px; background: transparent; cursor: pointer; }
  .color-input-row label { font-size: 10px; color: #8a94a6; cursor: pointer; display: flex; align-items: center; gap: 3px; }
  .color-input-row input[type="checkbox"] { accent-color: #4a7eff; cursor: pointer; width: 13px; height: 13px; }

  .nav-btn {
    position: fixed; bottom: 20px;
    width: 54px; height: 54px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(28,32,40,.92);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 50%;
    color: #d4d9e2; font-size: 22px;
    cursor: pointer; z-index: 1000;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    transition: background .15s, transform .1s, opacity .15s;
    touch-action: manipulation;
    user-select: none;
  }
  .nav-btn:active:not(:disabled) { transform: scale(.9); background: rgba(74,126,255,.4); }
  .nav-btn:disabled { opacity: .25; cursor: not-allowed; }
  #btnPrev { left: 20px; }
  #btnNext { right: 20px; }

  .dialog-backdrop {
    position: fixed; inset: 0; z-index: 2000;
    background: rgba(10,12,16,.65);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn .16s ease;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .dialog {
    background: #1c2028; border: 1px solid rgba(255,255,255,.1);
    border-radius: 16px; padding: 20px; width: 90%; max-width: 420px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    animation: dlgIn .2s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes dlgIn { from { opacity: 0; transform: scale(.94) translateY(8px); } to { opacity: 1; transform: none; } }
  .dialog h3 { font-size: 15px; margin-bottom: 12px; color: #fff; font-weight: 700; }
  .dialog input[type="url"] { width: 100%; padding: 12px 14px; background: #0f1115; color: #eee; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; font-size: 15px; direction: ltr; text-align: left; outline: none; font-family: inherit; transition: border-color .15s, box-shadow .15s; }
  .dialog input[type="url"]:focus { border-color: #4a7eff; box-shadow: 0 0 0 3px rgba(74,126,255,.2); }
  .dialog-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
  .dialog-actions button { padding: 11px 18px; border-radius: 9px; font-size: 14px; font-family: inherit; cursor: pointer; font-weight: 600; border: 1px solid transparent; transition: all .14s; touch-action: manipulation; }
  .dialog-actions .btn-primary { background: #4a7eff; color: #fff; }
  .dialog-actions .btn-primary:active { background: #3b6ee0; }
  .dialog-actions .btn-secondary { background: transparent; color: #8a94a6; border-color: rgba(255,255,255,.12); }
  .dialog-actions .btn-secondary:active { color: #fff; border-color: rgba(255,255,255,.25); }

  #emptyState { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #666; pointer-events: none; z-index: 20; font-size: 14px; }
  #emptyState .icon { font-size: 72px; opacity: .4; }
  #emptyState button { pointer-events: auto; padding: 13px 26px; background: #4a7eff; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-size: 15px; font-family: inherit; font-weight: 600; touch-action: manipulation; }
  #emptyState button:active { background: #3b6ee0; }

  #loading { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: #fff; background: rgba(15,17,21,.75); z-index: 100; backdrop-filter: blur(3px); }
  #loading.show { display: flex; }
  .spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,255,255,.12); border-top-color: #4a7eff; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #pageIndicator { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); padding: 6px 16px; background: rgba(28,32,40,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.08); border-radius: 999px; font-size: 12px; color: #b8c0cc; font-variant-numeric: tabular-nums; z-index: 999; pointer-events: none; letter-spacing: .5px; }
  #pageIndicator:empty { display: none; }

  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 10px; background: rgba(28,32,40,.95); border: 1px solid rgba(255,255,255,.1); color: #fff; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 3000; animation: toastIn .2s ease; pointer-events: none; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

  @media (max-width: 600px) {
    #toolbar { right: 6px; padding: 4px 3px; gap: 2px; }
    #toolbar button { width: 36px; height: 36px; font-size: 16px; }
    #submenu { right: 50px; }
    .nav-btn { width: 48px; height: 48px; font-size: 20px; bottom: 16px; }
    #btnPrev { left: 12px; }
    #btnNext { right: 12px; }
  }
</style>
</head>
<body>

<div id="stageWrapper">
  <div id="stage" data-tool="select">
    <div id="stageContent">
      <canvas id="pdfCanvas"></canvas>
      <svg id="svgLayer" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="embedLayer"></div>
      <canvas id="transientCanvas"></canvas>
      <canvas id="laserCanvas"></canvas>
    </div>
  </div>

  <div id="emptyState">
    <div class="icon">📄</div>
    <div>افتح ملف PDF للبدء</div>
    <button id="btnOpenEmpty">📂 اختر ملفاً</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loadingText">جارٍ التحميل…</div>
  </div>
</div>

<div id="pageIndicator"></div>

<div id="toolbar">
  <button data-tool="hand" title="يد">🖐️</button>
  <button data-tool="pen" data-submenu="pen" title="قلم" style="--indicator:#000000">✏️</button>
  <button data-tool="eraser" data-submenu="eraser" title="ممحاة">🧽</button>
  <button data-tool="laser" data-submenu="laser" title="ليزر" style="--indicator:#ff0000">🔴</button>
  <button data-tool="shape" data-submenu="shape" title="أشكال">▭</button>
  <button data-tool="embed" title="تضمين HTML">🔗</button>
  <button data-tool="select" title="تحديد">🖱️</button>
  <div class="tb-divider"></div>
  <button id="btnUndo" title="تراجع">↶</button>
  <button id="btnRedo" title="إعادة">↷</button>
  <div class="tb-divider"></div>
  <button id="btnFullscreen" title="ملء الشاشة">⛶</button>
  <button id="btnOpen" title="فتح ملف">📂</button>
</div>

<div id="submenu"></div>

<button class="nav-btn" id="btnPrev" title="السابق">←</button>
<button class="nav-btn" id="btnNext" title="التالي">→</button>

<input type="file" id="fileInput" accept="application/pdf,image/*" style="display:none">

<!-- pdf.js من jsdelivr (نفس المصدر المستخدم للخطوط القياسية) -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

<script>
(function () {
'use strict';

/* ================================================================
   CONSTANTS
   ================================================================ */
const PDFJS_BASE = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174';
const LASER_LIFE_MS = 10000;
const LASER_FADE_MS = 2000;
const UNDO_LIMIT = 50;
const COORD_WIDTH = 2000;   // نظام إحداثيات الرسم الثابت (لا يتغير مع حجم الشاشة)

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + '/build/pdf.worker.min.js';
}

/* ================================================================
   DOM
   ================================================================ */
const $ = id => document.getElementById(id);
const stage         = $('stage');
const stageWrapper  = $('stageWrapper');
const stageContent  = $('stageContent');
const pdfCanvas     = $('pdfCanvas');
const svgLayer      = $('svgLayer');
const embedLayer    = $('embedLayer');
const transientCanvas = $('transientCanvas');
const laserCanvas   = $('laserCanvas');
const emptyState    = $('emptyState');
const loadingEl     = $('loading');
const loadingText   = $('loadingText');
const pageIndicator = $('pageIndicator');
const toolbar       = $('toolbar');
const submenu       = $('submenu');
const fileInput     = $('fileInput');
const btnUndo       = $('btnUndo');
const btnRedo       = $('btnRedo');
const btnPrev       = $('btnPrev');
const btnNext       = $('btnNext');

const transCtx = transientCanvas.getContext('2d');
const laserCtx = laserCanvas.getContext('2d');
const SVG_NS = 'http://www.w3.org/2000/svg';

/* ================================================================
   STATE
   ================================================================ */
const state = {
  pdfDoc: null,
  currentPage: 1,
  totalPages: 0,
  pdfW: 0,
  pdfH: 0,
  canvasScale: 1,          // pdfW → canvas pixels

  tool: 'select',
  penColor: '#000000',
  penSize: 3,
  eraserSize: 16,
  laserColor: '#ff0000',
  laserSize: 3,
  shapeKind: 'rect',
  shapeStroke: '#000000',
  shapeFill: '#ffffff',
  shapeFillNone: true,
  shapeSize: 3,
  selected: null,
  pages: {},
  history: {},
};

/* ================================================================
   HELPERS
   ================================================================ */
function uid() { return 'a' + Math.random().toString(36).slice(2, 9); }

function getStagePoint(e) {
  const r = stage.getBoundingClientRect();
  return {
    x: ((e.clientX - r.left) / r.width)  * state.pdfW,
    y: ((e.clientY - r.top)  / r.height) * state.pdfH,
  };
}

function setLoading(on, text) {
  loadingEl.classList.toggle('show', !!on);
  if (text) loadingText.textContent = text;
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

/* ★ حساب أبعاد stage والقماش بناءً على الشاشة الفعلية
   هذا هو الحل الحقيقي لمشكلة تغيّر الخطوط:
   نرسم PDF بالضبط بحجم البكسل المعروض × devicePixelRatio،
   فلا يحتاج المتصفح لإعادة تصغير الصورة. */
function computeStageSize(naturalW, naturalH) {
  const wrap = stageWrapper.getBoundingClientRect();
  const reserveRight  = 66;
  const reserveBottom = 84;
  const reserveTop    = 40;
  const availW = Math.max(80, wrap.width  - 24 - reserveRight);
  const availH = Math.max(80, wrap.height - reserveTop - reserveBottom);
  const aspect = naturalW / naturalH;
  let cssW = availW, cssH = cssW / aspect;
  if (cssH > availH) { cssH = availH; cssW = cssH * aspect; }

  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  let canvasW = Math.ceil(cssW * dpr);
  let canvasH = Math.ceil(cssH * dpr);

  /* حدّ أقصى لمنع استنزاف الذاكرة على الجوالات الضعيفة */
  const maxPixels = 16 * 1024 * 1024;
  if (canvasW * canvasH > maxPixels) {
    const factor = Math.sqrt(maxPixels / (canvasW * canvasH));
    canvasW = Math.floor(canvasW * factor);
    canvasH = Math.floor(canvasH * factor);
  }

  return { cssW, cssH, canvasW, canvasH };
}

/* ================================================================
   SERIALIZATION
   ================================================================ */
function serializeSvgElement(el) {
  const tag = el.tagName.toLowerCase();
  const attrs = {};
  for (let i = 0; i < el.attributes.length; i++) {
    const a = el.attributes[i];
    if (a.name === 'class' || a.name === 'data-annot' || a.name === 'data-id' || a.name === 'selected') continue;
    attrs[a.name] = a.value;
  }
  return { kind: 'svg', tag, attrs, dataId: el.dataset.id || uid(), shapeType: el.dataset.type || tag };
}

function deserializeSvgElement(spec) {
  const el = document.createElementNS(SVG_NS, spec.tag);
  const attrs = spec.attrs || {};
  Object.keys(attrs).forEach(k => el.setAttribute(k, attrs[k]));
  el.dataset.annot = '1';
  el.dataset.id = spec.dataId;
  if (spec.shapeType) el.dataset.type = spec.shapeType;
  el.classList.add('annot');
  return el;
}

function serializeEmbed(el) {
  return { kind: 'embed', url: el.dataset.url, x: el.style.left, y: el.style.top, w: el.style.width, h: el.style.height };
}

function snapshot() {
  const annotations = [];
  svgLayer.querySelectorAll('[data-annot]').forEach(el => {
    if (el.tagName.toLowerCase() === 'g') return;
    if (el.classList.contains('handle')) return;
    if (el.classList.contains('selection-outline')) return;
    annotations.push(serializeSvgElement(el));
  });
  const embeds = [];
  embedLayer.querySelectorAll('.embed').forEach(el => embeds.push(serializeEmbed(el)));
  return { annotations, embeds };
}

function applySnapshot(s) {
  deselect();
  while (svgLayer.firstChild) svgLayer.removeChild(svgLayer.firstChild);
  embedLayer.innerHTML = '';
  (s.annotations || []).forEach(spec => {
    try { svgLayer.appendChild(deserializeSvgElement(spec)); }
    catch (e) { console.warn('bad spec', spec, e); }
  });
  (s.embeds || []).forEach(spec => addEmbedElement(spec.url, spec.x, spec.y, spec.w, spec.h, false));
}

/* ================================================================
   HISTORY
   ================================================================ */
function getHistory() {
  return state.history[state.currentPage] || (state.history[state.currentPage] = { past: [], future: [] });
}
function savePageNow() {
  if (!state.currentPage) return;
  state.pages[state.currentPage] = snapshot();
}
function commitChange(preSnapshot) {
  if (!state.currentPage) return;
  const h = getHistory();
  h.past.push(preSnapshot || { annotations: [], embeds: [] });
  if (h.past.length > UNDO_LIMIT) h.past.shift();
  h.future.length = 0;
  savePageNow();
  updateUndoButtons();
}
function updateUndoButtons() {
  const h = state.history[state.currentPage] || { past: [], future: [] };
  btnUndo.disabled = h.past.length === 0;
  btnRedo.disabled = h.future.length === 0;
}
function undo() {
  if (!state.currentPage) return;
  const h = getHistory();
  if (!h.past.length) return;
  h.future.push(snapshot());
  const previous = h.past.pop();
  state.pages[state.currentPage] = previous;
  applySnapshot(previous);
  updateUndoButtons();
}
function redo() {
  if (!state.currentPage) return;
  const h = getHistory();
  if (!h.future.length) return;
  h.past.push(snapshot());
  const next = h.future.pop();
  state.pages[state.currentPage] = next;
  applySnapshot(next);
  updateUndoButtons();
}

/* ================================================================
   PAGE STATE
   ================================================================ */
const laserStrokes = [];
let currentLaserStroke = null;
let laserRAF = null;

function clearLaser() {
  laserStrokes.length = 0;
  currentLaserStroke = null;
  laserCtx.clearRect(0, 0, laserCanvas.width, laserCanvas.height);
}
function clearTransient() {
  transCtx.clearRect(0, 0, transientCanvas.width, transientCanvas.height);
}
function loadPageState(pageNum) {
  deselect();
  clearLaser();
  clearTransient();
  while (svgLayer.firstChild) svgLayer.removeChild(svgLayer.firstChild);
  embedLayer.innerHTML = '';
  const s = state.pages[pageNum];
  if (s) applySnapshot(s);
}

/* ================================================================
   PDF RENDER — الحل الجذري
   ================================================================ */
async function renderPage(pageNum) {
  if (!state.pdfDoc) return;
  setLoading(true, 'جارٍ عرض الصفحة…');

  try {
    const page = await state.pdfDoc.getPage(pageNum);
    const vp1 = page.getViewport({ scale: 1 });

    /* نظام إحداثيات الرسم ثابت عند COORD_WIDTH */
    state.pdfW = COORD_WIDTH;
    state.pdfH = Math.round(vp1.height * (COORD_WIDTH / vp1.width));

    /* ★ الأبعاد النقطية تطابق الشاشة الفعلية */
    const { cssW, cssH, canvasW, canvasH } = computeStageSize(vp1.width, vp1.height);
    state.canvasScale = canvasW / state.pdfW;

    stage.style.width  = cssW + 'px';
    stage.style.height = cssH + 'px';

    /* كل القماش بنفس الأبعاد النقطية للشاشة */
    pdfCanvas.width       = canvasW;
    pdfCanvas.height      = canvasH;
    transientCanvas.width = canvasW;
    transientCanvas.height= canvasH;
    laserCanvas.width     = canvasW;
    laserCanvas.height    = canvasH;

    /* SVG بنظام إحداثيات COORD_WIDTH */
    svgLayer.setAttribute('viewBox', `0 0 ${state.pdfW} ${state.pdfH}`);

    /* امسح وأعد الرسم */
    const ctx = pdfCanvas.getContext('2d', { alpha: false });
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvasW, canvasH);

    /* PDF يُرسم بدقة الشاشة الفعلية (بدون downscale لاحق) */
    const renderScale = canvasW / vp1.width;
    const viewport = page.getViewport({ scale: renderScale });

    await page.render({
      canvasContext: ctx,
      viewport,
      background: '#ffffff',
    }).promise;

    stageContent.style.transition = 'none';
    stageContent.style.transform = '';

    loadPageState(pageNum);
    updatePageIndicator();
    updateUndoButtons();
    emptyState.style.display = 'none';
  } catch (err) {
    console.error('render error', err);
    toast('تعذّر عرض الصفحة');
  } finally {
    setLoading(false);
  }
}

async function loadPdfFile(file) {
  if (!window.pdfjsLib) { alert('pdf.js غير متاح'); return; }
  setLoading(true, 'جارٍ قراءة الملف…');
  try {
    const buf = await file.arrayBuffer();

    const doc = await pdfjsLib.getDocument({
      data: buf,

      /* مسارات الخطوط والخرائط — من نفس مصدر pdf.js */
      cMapUrl: PDFJS_BASE + '/cmaps/',
      cMapPacked: true,
      standardFontDataUrl: PDFJS_BASE + '/standard_fonts/',

      /* ★ السماح باستخدام خطوط النظام للخطوط غير المضمّنة
            (يطابق سلوك عارض Chrome) */
      useSystemFonts: true,

      /* استخدام FontFace API (افتراضي، لكن نؤكده) */
      disableFontFace: false,

      /* تحسين الأداء */
      isEvalSupported: false,
      disableRange: false,
      disableStream: false,
      disableAutoFetch: false,

      /* تقليل الضجيج في console */
      verbosity: 0,
    }).promise;

    state.pdfDoc = doc;
    state.totalPages = doc.numPages;
    state.currentPage = 1;
    state.pages = {};
    state.history = {};
    state.selected = null;
    updateUndoButtons();
    await renderPage(1);
  } catch (err) {
    console.error(err);
    setLoading(false);
    alert('تعذّر فتح PDF: ' + err.message);
  }
}

async function loadImageFile(file) {
  setLoading(true, 'جارٍ تحميل الصورة…');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('صورة غير صالحة'));
      i.src = url;
    });

    state.pdfDoc = null;
    state.totalPages = 1;
    state.currentPage = 1;
    state.pages = {};
    state.history = {};

    state.pdfW = COORD_WIDTH;
    state.pdfH = Math.round(COORD_WIDTH * img.height / img.width);

    const { cssW, cssH, canvasW, canvasH } = computeStageSize(img.width, img.height);
    state.canvasScale = canvasW / state.pdfW;

    stage.style.width  = cssW + 'px';
    stage.style.height = cssH + 'px';

    [pdfCanvas, transientCanvas, laserCanvas].forEach(c => {
      c.width = canvasW; c.height = canvasH;
    });
    svgLayer.setAttribute('viewBox', `0 0 ${state.pdfW} ${state.pdfH}`);

    const ctx = pdfCanvas.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvasW, canvasH);
    ctx.drawImage(img, 0, 0, canvasW, canvasH);

    deselect();
    clearLaser();
    clearTransient();
    while (svgLayer.firstChild) svgLayer.removeChild(svgLayer.firstChild);
    embedLayer.innerHTML = '';
    stageContent.style.transform = '';
    updatePageIndicator();
    updateUndoButtons();
    emptyState.style.display = 'none';
  } catch (err) {
    console.error(err);
    alert(err.message);
  } finally {
    URL.revokeObjectURL(url);
    setLoading(false);
  }
}

function updatePageIndicator() {
  if (!state.totalPages) { pageIndicator.textContent = ''; return; }
  pageIndicator.textContent = state.currentPage + ' / ' + state.totalPages;
  btnPrev.disabled = state.currentPage <= 1;
  btnNext.disabled = state.currentPage >= state.totalPages;
}

/* ================================================================
   RESIZE — إعادة الرسم بالأبعاد الجديدة
   ================================================================ */
let resizeTimer = null;
function handleResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(async () => {
    if (state.pdfDoc && state.currentPage) {
      savePageNow();
      await renderPage(state.currentPage);
    } else if (state.totalPages > 0 && state.currentPage) {
      /* وضع الصورة */
      const imgW = state.pdfW, imgH = state.pdfH;
      const { cssW, cssH, canvasW, canvasH } = computeStageSize(imgW, imgH);
      state.canvasScale = canvasW / state.pdfW;
      stage.style.width  = cssW + 'px';
      stage.style.height = cssH + 'px';
      /* إعادة تحميل الصورة تتطلب إعادة الفتح؛ نكتفي بتحديث الأبعاد */
      [transientCanvas, laserCanvas].forEach(c => { c.width = canvasW; c.height = canvasH; });
      clearTransient(); clearLaser();
    }
  }, 200);
}
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', () => {
  setTimeout(() => window.dispatchEvent(new Event('resize')), 300);
});

/* ================================================================
   PAGE NAVIGATION
   ================================================================ */
let sliding = false;
async function goToPage(newPage, dir) {
  if (sliding) return;
  if (newPage < 1 || newPage > state.totalPages) return;
  if (newPage === state.currentPage) return;

  sliding = true;
  savePageNow();

  const w = stage.clientWidth;
  const outX = dir === 'next' ? -w : w;
  const inX  = dir === 'next' ? w : -w;

  stageContent.style.transition = 'transform .22s ease-out';
  stageContent.style.transform = `translateX(${outX}px)`;
  await new Promise(r => setTimeout(r, 220));

  state.currentPage = newPage;
  if (state.pdfDoc) await renderPage(newPage);
  else { loadPageState(newPage); updatePageIndicator(); updateUndoButtons(); }

  stageContent.style.transition = 'none';
  stageContent.style.transform = `translateX(${inX}px)`;
  void stageContent.offsetWidth;
  stageContent.style.transition = 'transform .22s ease-out';
  stageContent.style.transform = 'translateX(0)';

  setTimeout(() => {
    stageContent.style.transition = '';
    stageContent.style.transform = '';
    sliding = false;
  }, 240);
}

/* ================================================================
   TOOLBAR
   ================================================================ */
function setTool(tool) {
  if (tool !== 'select') deselect();
  state.tool = tool;
  stage.dataset.tool = tool;
  document.querySelectorAll('#toolbar button[data-tool]').forEach(b => {
    b.classList.toggle('active', b.dataset.tool === tool);
  });
  closeSubmenu();
}

function bindPress(el, handler) {
  let fired = false;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    fired = true;
    e.preventDefault();
    e.stopPropagation();
    handler(e);
  }, { passive: false });
  el.addEventListener('click', e => {
    if (fired) { fired = false; e.preventDefault(); e.stopPropagation(); return; }
    if (e.pointerType === undefined) { e.preventDefault(); e.stopPropagation(); handler(e); }
  });
}

toolbar.querySelectorAll('button').forEach(btn => {
  bindPress(btn, () => {
    if (btn.id === 'btnUndo')       { undo(); return; }
    if (btn.id === 'btnRedo')       { redo(); return; }
    if (btn.id === 'btnFullscreen') { toggleFullscreen(); return; }
    if (btn.id === 'btnOpen')       { fileInput.click(); return; }
    const tool = btn.dataset.tool;
    if (!tool) return;
    if (tool === 'embed') { openEmbedDialog(); return; }
    const wasActive = btn.classList.contains('active');
    const hasSub = btn.dataset.submenu;
    if (wasActive && hasSub && submenu.classList.contains('show')) { closeSubmenu(); return; }
    setTool(tool);
    if (hasSub) openSubmenu(btn, btn.dataset.submenu);
  });
});

function toggleFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen().catch(console.warn);
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen().catch(console.warn);
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}

function repositionSubmenu() {

  const h = submenu.offsetHeight;
  if (top + h > window.innerHeight - 8) top = window.innerHeight - h - 8;
  if (top < 8) top = 8;
  submenu.style.top = top + 'px';

function bindSubmenuHandlers() {
  submenu.querySelectorAll('.color-btn').forEach(btn => {

      else if (kind === 'eraser') state.eraserSize = size;
      else if (kind === 'laser') state.laserSize = size;
      else if (kind === 'shape') state.shapeSize = size;
      submenu.querySelectorAll(`.size-btn[data-kind="${kind}"]`).forEach(b => b.classList.toggle('active', parseInt(b.dataset.size, 10) === size));
    });
  });
  submenu.querySelectorAll('.shape-btn').forEach(btn => {

      state.shapeKind = btn.dataset.shape;

/* ================================================================

   ================================================================ */
function openEmbedDialog() {
  const backdrop = document.createElement('div');
  backdrop.className = 'dialog-backdrop';
  backdrop.innerHTML = `
    <div class="dialog">
      <h3>🔗 تضمين وسائط تفاعلية</h3>
      <input type="url" id="embedUrlInput" placeholder="https://example.com/game" autofocus>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" data-action="cancel">إلغاء</button>
        <button type="button" class="btn-primary" data-action="ok">تضمين</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const input = backdrop.querySelector('#embedUrlInput');
  setTimeout(() => { try { input.focus(); } catch(_) {} }, 50);
  function close() { backdrop.remove(); }
  function submit() {
    let url = (input.value || '').trim();
    if (!url) { close(); return; }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    const pre = snapshot();
    addEmbedElement(url);
    commitChange(pre);
    close();
    setTool('select');
  }
  bindPress(backdrop.querySelector('[data-action="cancel"]'), close);
  bindPress(backdrop.querySelector('[data-action="ok"]'), submit);
  backdrop.addEventListener('click', e => { if (e.target === backdrop) close(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') submit();
    if (e.key === 'Escape') close();
  });
}

/* ================================================================
   EMBED
   ================================================================ */
function addEmbedElement(url, x, y, w, hh, save) {
  const el = document.createElement('div');
  el.className = 'embed';
  el.dataset.url = url;
  el.style.left   = x   || '30%';
  el.style.top    = y   || '25%';
  el.style.width  = w   || '40%';
  el.style.height = hh  || '40%';

  const header = document.createElement('div');
  header.className = 'embed-header';
  const title = document.createElement('span');
  title.className = 'embed-title';
  try { title.textContent = new URL(url).hostname; } catch (_) { title.textContent = url; }
  const close = document.createElement('button');
  close.type = 'button';
  close.className = 'embed-close';
  close.textContent = '×';
  close.title = 'حذف';
  close.addEventListener('pointerdown', e => e.stopPropagation());
  bindPress(close, e => {
    e.stopPropagation();
    const pre = snapshot();
    if (state.selected && state.selected.el === el) state.selected = null;
    el.remove();
    commitChange(pre);
  });
  header.appendChild(title);
  header.appendChild(close);

  const iframe = document.createElement('iframe');
  iframe.src = url;
  iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-pointer-lock allow-downloads allow-popups-to-escape-sandbox allow-presentation');
  iframe.setAttribute('allow', 'fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; microphone; camera; encrypted-media; picture-in-picture');
  iframe.setAttribute('referrerpolicy', 'no-referrer');

  const resize = document.createElement('div');
  resize.className = 'embed-resize';

  el.appendChild(header);
  el.appendChild(iframe);
  el.appendChild(resize);
  embedLayer.appendChild(el);

  header.addEventListener('pointerdown', e => {
    if (state.tool !== 'select') return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    header.setPointerCapture(e.pointerId);
    selectEmbed(el);
    startEmbedDrag(el, e, 'move');
  });
  resize.addEventListener('pointerdown', e => {
    if (state.tool !== 'select') return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    resize.setPointerCapture(e.pointerId);
    selectEmbed(el);
    startEmbedDrag(el, e, 'resize');
  });
  return el;
}

function startEmbedDrag(el, e, mode) {
  const stageRect = stage.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  const startX = e.clientX, startY = e.clientY;
  const startL = elRect.left - stageRect.left;
  const startT = elRect.top  - stageRect.top;
  const startW = elRect.width;
  const startH = elRect.height;
  const pre = snapshot();
  function onMove(ev) {
    const dx = ev.clientX - startX;
    const dy = ev.clientY - startY;
    if (mode === 'move') {
      const nl = Math.max(0, Math.min(stageRect.width  - startW, startL + dx));
      const nt = Math.max(0, Math.min(stageRect.height - startH, startT + dy));
      el.style.left = (nl / stageRect.width  * 100) + '%';
      el.style.top  = (nt / stageRect.height * 100) + '%';
    } else {
      const nw = Math.max(80,  Math.min(stageRect.width  - startL, startW + dx));
      const nh = Math.max(60,  Math.min(stageRect.height - startT, startH + dy));
      el.style.width  = (nw / stageRect.width  * 100) + '%';
      el.style.height = (nh / stageRect.height * 100) + '%';
    }
  }
  function onUp() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    commitChange(pre);
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

/* ================================================================
   SELECTION
   ================================================================ */
function deselect() {
  if (state.selected) {
    if (state.selected.kind === 'svg') state.selected.el.classList.remove('selected');
    if (state.selected.kind === 'embed') state.selected.el.classList.remove('selected');
  }
  state.selected = null;
  svgLayer.querySelectorAll('.selection-overlay').forEach(n => n.remove());
  embedLayer.querySelectorAll('.embed').forEach(e => e.classList.remove('selected'));
}
function selectAnnotation(el) {
  deselect();
  state.selected = { kind: 'svg', el };
  el.classList.add('selected');
  drawSelectionOverlay(el);
}
function selectEmbed(el) {
  deselect();
  state.selected = { kind: 'embed', el };
  el.classList.add('selected');
}
function getShapeBBox(el) {
  try {
    if (el.tagName === 'line') {
      const x1 = +el.getAttribute('x1'), y1 = +el.getAttribute('y1');
      const x2 = +el.getAttribute('x2'), y2 = +el.getAttribute('y2');
      const pad = 8;
      return { x: Math.min(x1,x2)-pad, y: Math.min(y1,y2)-pad, width: Math.abs(x2-x1)+pad*2, height: Math.abs(y2-y1)+pad*2 };

  } catch (_) { return null; }
}

  const g = document.createElementNS(SVG_NS, 'g');
  g.setAttribute('class', 'selection-overlay');
  const rect = document.createElementNS(SVG_NS, 'rect');
  rect.setAttribute('x', bbox.x); rect.setAttribute('y', bbox.y);
  rect.setAttribute('width', bbox.width); rect.setAttribute('height', bbox.height);
  rect.setAttribute('class', 'selection-outline');
  g.appendChild(rect);
  const hs = Math.max(6, state.pdfW / 140);
  const pts = { nw: [bbox.x, bbox.y], ne: [bbox.x + bbox.width, bbox.y], se: [bbox.x + bbox.width, bbox.y + bbox.height], sw: [bbox.x, bbox.y + bbox.height] };

}

/* ================================================================
   ERASER
   ================================================================ */
function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx*dx + dy*dy;

  let t = ((px - x1) * dx + (py - y1) * dy) / len2;

    const x = cx + rx * Math.cos(t), y = cy + ry * Math.sin(t);

}

  if (tag === 'line') return distToSegment(p.x, p.y, +el.getAttribute('x1'), +el.getAttribute('y1'), +el.getAttribute('x2'), +el.getAttribute('y2')) <= tol;
  if (tag === 'rect') {
    const x = +el.getAttribute('x'), y = +el.getAttribute('y'), w = +el.getAttribute('width'), h = +el.getAttribute('height');
    return distToSegment(p.x, p.y, x, y, x+w, y) <= tol || distToSegment(p.x, p.y, x+w, y, x+w, y+h) <= tol || distToSegment(p.x, p.y, x+w, y+h, x, y+h) <= tol || distToSegment(p.x, p.y, x, y+h, x, y) <= tol;
  }
  if (tag === 'ellipse') {
    const cx = +el.getAttribute('cx'), cy = +el.getAttribute('cy'), rx = +el.getAttribute('rx'), ry = +el.getAttribute('ry');
    return distToEllipse(p.x, p.y, cx, cy, rx, ry) <= tol;

  if (tag === 'path') {
    const d = el.getAttribute('d');
    if (!d) return false;
    const { tx, ty } = getTranslate(el);

    const re = /([ML])\s*([-\d.]+)\s+([-\d.]+)/g;
    const pts = []; let m;
    while ((m = re.exec(d))) pts.push({ x: parseFloat(m[2]), y: parseFloat(m[3]) });
    for (let i = 1; i < pts.length; i++) {
      if (distToSegment(lx, ly, pts[i-1].x, pts[i-1].y, pts[i].x, pts[i].y) <= tol) return true;

}

    if (el.tagName.toLowerCase() === 'g') return;
    if (isPointNearShape(p, el, tol)) toRemove.push(el);
  });
  toRemove.forEach(el => {
    if (state.selected && state.selected.el === el) state.selected = null;
    el.remove();
  });

}

/* ================================================================
   CREATE ANNOTATIONS
   ================================================================ */
function addAnnotation(el) {

  if (!el.dataset.id) el.dataset.id = uid();
  el.classList.add('annot');
  svgLayer.appendChild(el);
}

  path.setAttribute('stroke-width', state.penSize);
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('stroke-linejoin', 'round');

    const x = Math.min(start.x, end.x), y = Math.min(start.y, end.y);
    const w = Math.abs(end.x - start.x), h = Math.abs(end.y - start.y);

/* ================================================================
   LASER — يعمل بنظام إحداثيات الرسم، ويرسم بمقياس البكسل
   ================================================================ */
function startLaserRAF() { if (laserRAF) return; laserRAF = requestAnimationFrame(laserTick); }

  const now = performance.now();
  const k = state.canvasScale;

  laserCtx.clearRect(0, 0, laserCanvas.width, laserCanvas.height);

  for (let i = laserStrokes.length - 1; i >= 0; i--) {
    const s = laserStrokes[i];
    const age = now - s.lastUpdate;
    if (age > LASER_LIFE_MS + LASER_FADE_MS) { laserStrokes.splice(i, 1); continue; }
    let alpha = 1;
    if (age > LASER_LIFE_MS) alpha = Math.max(0, 1 - (age - LASER_LIFE_MS) / LASER_FADE_MS);

    laserCtx.lineWidth = s.width * k;
    laserCtx.lineCap = 'round';
    laserCtx.lineJoin = 'round';
    laserCtx.beginPath();

    for (let j = 1; j < s.points.length; j++) laserCtx.lineTo(s.points[j].x * k, s.points[j].y * k);

  if (Math.hypot(p.x - last.x, p.y - last.y) < 2) return;
  currentLaserStroke.points.push(p);
  currentLaserStroke.lastUpdate = performance.now();

/* ================================================================
   PEN PREVIEW
   ================================================================ */
function drawPenPreview(points) {
  const k = state.canvasScale;
  transCtx.setTransform(1, 0, 0, 1, 0, 0);
  transCtx.clearRect(0, 0, transientCanvas.width, transientCanvas.height);
  if (!points || points.length < 2) return;
  transCtx.strokeStyle = state.penColor;
  transCtx.lineWidth = state.penSize * k;
  transCtx.lineCap = 'round';
  transCtx.lineJoin = 'round';
  transCtx.beginPath();
  transCtx.moveTo(points[0].x * k, points[0].y * k);
  for (let i = 1; i < points.length; i++) transCtx.lineTo(points[i].x * k, points[i].y * k);
  transCtx.stroke();

/* ================================================================
   INTERACTION
   ================================================================ */
let interaction = null;
let handDrag = null;

stage.addEventListener('pointerdown', onStageDown);
stage.addEventListener('contextmenu', e => e.preventDefault());

function onStageDown(e) {
  if (!state.pdfW) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.target.closest && e.target.closest('.embed')) return;
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  const p = getStagePoint(e);
  const tool = state.tool;
  closeSubmenu();

  if (tool === 'hand') {
    stage.classList.add('dragging');
    handDrag = { startX: e.clientX, dx: 0 };
    interaction = { type: 'hand' };
    e.preventDefault(); return;
  }
  if (tool === 'select') {
    const target = e.target;
    const handle = target.closest && target.closest('.handle');
    if (handle && state.selected && state.selected.kind === 'svg') {
      interaction = { type: 'resizeSvg', el: state.selected.el, handle: handle.dataset.handle, start: p, pre: snapshot() };
      e.preventDefault(); return;
    }
    const annot = target.closest && target.closest('[data-annot]');
    if (annot && annot.tagName.toLowerCase() !== 'g' && !annot.classList.contains('handle')) {
      selectAnnotation(annot);
      interaction = { type: 'moveSvg', el: annot, start: p, orig: captureSvgGeom(annot), pre: snapshot() };
      e.preventDefault(); return;
    }
    deselect();
    return;
  }
  if (tool === 'pen') {
    interaction = { type: 'pen', points: [p], pre: snapshot() };
    drawPenPreview(interaction.points);
    e.preventDefault(); return;
  }
  if (tool === 'laser') {
    laserStart(p);
    interaction = { type: 'laser' };
    e.preventDefault(); return;
  }
  if (tool === 'eraser') {
    const pre = snapshot();
    const removed = eraseAt(p);
    if (removed > 0) interaction = { type: 'eraser', pre, removedAny: true };
    else interaction = null;
    e.preventDefault(); return;
  }
  if (tool === 'shape') {
    const el = document.createElementNS(SVG_NS, state.shapeKind === 'circle' ? 'ellipse' : state.shapeKind);
    el.setAttribute('stroke', state.shapeStroke);
    el.setAttribute('stroke-width', state.shapeSize);
    el.setAttribute('fill', state.shapeKind === 'line' || state.shapeFillNone ? 'none' : state.shapeFill);
    if (state.shapeKind === 'rect') { el.setAttribute('x', p.x); el.setAttribute('y', p.y); el.setAttribute('width', 0); el.setAttribute('height', 0); }
    else if (state.shapeKind === 'circle') { el.setAttribute('cx', p.x); el.setAttribute('cy', p.y); el.setAttribute('rx', 0); el.setAttribute('ry', 0); }
    else if (state.shapeKind === 'line') { el.setAttribute('x1', p.x); el.setAttribute('y1', p.y); el.setAttribute('x2', p.x); el.setAttribute('y2', p.y); }
    svgLayer.appendChild(el);
    interaction = { type: 'shapePreview', kind: state.shapeKind, start: p, previewEl: el, pre: snapshot() };
    e.preventDefault(); return;
  }
}

stage.addEventListener('pointermove', onStageMove);
stage.addEventListener('pointerup', onStageUp);
stage.addEventListener('pointercancel', onStageUp);
stage.addEventListener('pointerleave', onStageUp);

function onStageMove(e) {
  if (!interaction) return;
  const p = getStagePoint(e);
  if (interaction.type === 'hand' && handDrag) {
    handDrag.dx = e.clientX - handDrag.startX;
    stageContent.style.transition = 'none';
    stageContent.style.transform = `translateX(${handDrag.dx}px)`;
    return;
  }
  if (interaction.type === 'pen') {
    const last = interaction.points[interaction.points.length - 1];
    if (Math.hypot(p.x - last.x, p.y - last.y) > 1.5) {
      interaction.points.push(p);
      drawPenPreview(interaction.points);
    }
    return;
  }
  if (interaction.type === 'laser') { laserAdd(p); return; }
  if (interaction.type === 'eraser') {
    const removed = eraseAt(p);
    if (removed > 0) interaction.removedAny = true;
    return;
  }
  if (interaction.type === 'shapePreview') {
    const el = interaction.previewEl;
    const s = interaction.start;
    if (interaction.kind === 'rect') {
      el.setAttribute('x', Math.min(s.x, p.x)); el.setAttribute('y', Math.min(s.y, p.y));
      el.setAttribute('width', Math.abs(p.x - s.x)); el.setAttribute('height', Math.abs(p.y - s.y));
    } else if (interaction.kind === 'circle') {
      el.setAttribute('cx', (s.x + p.x) / 2); el.setAttribute('cy', (s.y + p.y) / 2);
      el.setAttribute('rx', Math.abs(p.x - s.x) / 2); el.setAttribute('ry', Math.abs(p.y - s.y) / 2);
    } else if (interaction.kind === 'line') {
      el.setAttribute('x2', p.x); el.setAttribute('y2', p.y);
    }
    return;
  }
  if (interaction.type === 'moveSvg') {
    const dx = p.x - interaction.start.x, dy = p.y - interaction.start.y;
    applySvgGeom(interaction.el, interaction.orig, dx, dy);
    drawSelectionOverlay(interaction.el);
    return;
  }
  if (interaction.type === 'resizeSvg') {
    resizeSvg(interaction.el, interaction.handle, interaction.start, p);
    drawSelectionOverlay(interaction.el);
    return;
  }
}

function onStageUp(e) {
  if (!interaction) return;
  const inter = interaction;
  interaction = null;
  try { stage.releasePointerCapture(e.pointerId); } catch (_) {}

  if (inter.type === 'hand' && handDrag) {
    stage.classList.remove('dragging');
    const dx = handDrag.dx;
    const w = stage.clientWidth;
    const threshold = w * 0.15;
    handDrag = null;
    if (dx < -threshold && state.currentPage < state.totalPages) goToPage(state.currentPage + 1, 'next');
    else if (dx > threshold && state.currentPage > 1) goToPage(state.currentPage - 1, 'prev');
    else {
      stageContent.style.transition = 'transform .2s ease';
      stageContent.style.transform = 'translateX(0)';
      setTimeout(() => { stageContent.style.transition = ''; stageContent.style.transform = ''; }, 220);
    }
    return;
  }
  if (inter.type === 'pen') {
    if (inter.points.length >= 2) {
      const path = commitPen(inter.points);
      if (path) commitChange(inter.pre);
    }
    clearTransient();
    return;
  }
  if (inter.type === 'laser') { laserEnd(); return; }
  if (inter.type === 'eraser') { if (inter.removedAny) commitChange(inter.pre); return; }
  if (inter.type === 'shapePreview') {
    const el = inter.previewEl;
    const s = inter.start;
    let end = s;
    if (inter.kind === 'rect') end = { x: +el.getAttribute('x') + +el.getAttribute('width'), y: +el.getAttribute('y') + +el.getAttribute('height') };
    else if (inter.kind === 'circle') end = { x: +el.getAttribute('cx') + +el.getAttribute('rx'), y: +el.getAttribute('cy') + +el.getAttribute('ry') };
    else if (inter.kind === 'line') end = { x: +el.getAttribute('x2'), y: +el.getAttribute('y2') };
    el.remove();
    const created = createShape(inter.kind, s, end);
    if (created) commitChange(inter.pre);
    return;
  }
  if (inter.type === 'moveSvg' || inter.type === 'resizeSvg') { commitChange(inter.pre); return; }
}

/* ================================================================

   ================================================================ */

    else if (handle === 'nw') { el.setAttribute('x', g.x + dx); el.setAttribute('y', g.y + dy); el.setAttribute('width', Math.max(5, g.width - dx)); el.setAttribute('height', Math.max(5, g.height - dy)); }
    else if (handle === 'ne') { el.setAttribute('y', g.y + dy); el.setAttribute('width', Math.max(5, g.width + dx)); el.setAttribute('height', Math.max(5, g.height - dy)); }
    else if (handle === 'sw') { el.setAttribute('x', g.x + dx); el.setAttribute('width', Math.max(5, g.width - dx)); el.setAttribute('height', Math.max(5, g.height + dy)); }
  } else if (tag === 'ellipse') {
    if (handle === 'se') { el.setAttribute('rx', Math.max(3, g.rx + dx / 2)); el.setAttribute('ry', Math.max(3, g.ry + dy / 2)); el.setAttribute('cx', g.cx + dx / 2); el.setAttribute('cy', g.cy + dy / 2); }
    else if (handle === 'nw') { el.setAttribute('rx', Math.max(3, g.rx - dx / 2)); el.setAttribute('ry', Math.max(3, g.ry - dy / 2)); el.setAttribute('cx', g.cx + dx / 2); el.setAttribute('cy', g.cy + dy / 2); }
    else if (handle === 'ne') { el.setAttribute('rx', Math.max(3, g.rx + dx / 2)); el.setAttribute('ry', Math.max(3, g.ry - dy / 2)); el.setAttribute('cx', g.cx + dx / 2); el.setAttribute('cy', g.cy + dy / 2); }
    else if (handle === 'sw') { el.setAttribute('rx', Math.max(3, g.rx - dx / 2)); el.setAttribute('ry', Math.max(3, g.ry + dy / 2)); el.setAttribute('cx', g.cx + dx / 2); el.setAttribute('cy', g.cy + dy / 2); }

    else if (handle === 'nw') { el.setAttribute('x1', g.x1 + dx); el.setAttribute('y1', g.y1 + dy); }
    else if (handle === 'ne') { el.setAttribute('x2', g.x2 + dx); el.setAttribute('y1', g.y1 + dy); }

/* ================================================================

   ================================================================ */
document.addEventListener('keydown', e => {

      if (state.selected.kind === 'svg') state.selected.el.remove();
      if (state.selected.kind === 'embed') state.selected.el.remove();
      state.selected = null;
      svgLayer.querySelectorAll('.selection-overlay').forEach(n => n.remove());
      commitChange(pre);
      e.preventDefault();
    }
    return;
  }
  if (e.key === 'Escape') { deselect(); closeSubmenu(); return; }
  const map = { 'h': 'hand', 'v': 'select', 'p': 'pen', 'e': 'eraser', 'a': 'laser', 's': 'shape' };
  const t = map[e.key.toLowerCase()];
  if (t) setTool(t);
  if (e.key === 'ArrowRight') goToPage(state.currentPage + 1, 'next');
  if (e.key === 'ArrowLeft')  goToPage(state.currentPage - 1, 'prev');
});

/* ================================================================
   FILE OPEN
   ================================================================ */
bindPress($('btnOpenEmpty'), () => fileInput.click());

fileInput.addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) await loadPdfFile(f);
    else if (/^image\//.test(f.type)) await loadImageFile(f);
    else alert('نوع الملف غير مدعوم');
  } catch (err) { console.error(err); alert('خطأ: ' + err.message); }
  fileInput.value = '';
});

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());

document.addEventListener('pointerdown', e => {
  if (submenu.classList.contains('show')) {
    if (!submenu.contains(e.target) && !toolbar.contains(e.target)) closeSubmenu();
  }
}, true);

/* ================================================================
   INIT
   ================================================================ */
setTool('select');
updateToolbarIndicators();
updateUndoButtons();
updatePageIndicator();

})();
</script>
</body>
</html>
