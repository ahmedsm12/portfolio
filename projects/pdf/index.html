<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>لوحة PDF التفاعلية</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body { height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: #0f1115; color: #eee; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  #stageWrapper { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #0f1115; }
  #stage { position: relative; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.7); overflow: hidden; touch-action: none; border-radius: 4px; transform-origin: 0 0; }
  #stageContent { position: absolute; inset: 0; }
  #stageContent > * { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #pdfCanvas { z-index: 1; pointer-events: none; }
  #svgLayer  { z-index: 2; pointer-events: none; }
  #embedLayer { z-index: 3; pointer-events: none; }
  #videoLayer { z-index: 4; pointer-events: none; }
  #transientCanvas { z-index: 5; pointer-events: none; }
  #laserCanvas { z-index: 6; pointer-events: none; }

  #stage[data-tool="hand"] { cursor: grab; }
  #stage[data-tool="hand"].dragging { cursor: grabbing; }
  #stage[data-tool="pen"], #stage[data-tool="highlighter"], #stage[data-tool="laser"],
  #stage[data-tool="rect"], #stage[data-tool="circle"], #stage[data-tool="line"] { cursor: crosshair; }
  #stage[data-tool="eraser"] {
    cursor: url('data:image/svg+xml;charset=utf-8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"%3E%3Ccircle cx="16" cy="16" r="12" fill="%23ffffff" fill-opacity="0.85" stroke="%23000000" stroke-width="2"/%3E%3Ccircle cx="16" cy="16" r="8" fill="none" stroke="%23666666" stroke-width="1" stroke-dasharray="2 2"/%3E%3C/svg%3E') 16 16, cell;
  }
  #svgLayer [data-annot] { pointer-events: none; }
  #stage[data-tool="select"] #svgLayer [data-annot] { pointer-events: auto; cursor: move; }
  .annot { vector-effect: non-scaling-stroke; }
  .selection-outline { fill: none; stroke: #4a7eff; stroke-width: 1.5; stroke-dasharray: 5 3; vector-effect: non-scaling-stroke; pointer-events: none; }
  .handle { fill: #fff; stroke: #4a7eff; stroke-width: 2; vector-effect: non-scaling-stroke; cursor: pointer; pointer-events: auto; }
  .handle.nw, .handle.se { cursor: nwse-resize; }
  .handle.ne, .handle.sw { cursor: nesw-resize; }

  #embedLayer .embed { position: absolute; pointer-events: auto; display: flex; flex-direction: column; background: #fff; border: 1px solid #4a7eff; border-radius: 3px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  #embedLayer .embed.selected { box-shadow: 0 0 0 2px rgba(74,126,255,.35), 0 2px 8px rgba(0,0,0,.2); }
  .embed-header { height: 22px; background: #4a7eff; color: #fff; padding: 0 5px; font-size: 10px; display: flex; justify-content: space-between; align-items: center; gap: 4px; cursor: move; user-select: none; flex-shrink: 0; opacity: 0; transition: opacity .15s; }
  #stage[data-tool="select"] .embed:hover .embed-header,
  #stage[data-tool="select"] .embed.selected .embed-header { opacity: 1; }
  #stage:not([data-tool="select"]) .embed-header { pointer-events: none; }
  .embed-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: left; font-weight: 500; }
  .embed-close { background: rgba(0,0,0,.25); border: none; color: #fff; width: 18px; height: 18px; border-radius: 3px; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; display: flex; align-items: center; justify-content: center; }
  .embed-close:hover { background: rgba(0,0,0,.5); }
  .embed iframe { flex: 1; border: none; background: #fff; width: 100%; min-height: 0; display: block; }
  #stage:not([data-tool="select"]) .embed iframe { pointer-events: none; }
  .embed-resize { position: absolute; width: 14px; height: 14px; background: #4a7eff; border: 2px solid #fff; border-radius: 50%; bottom: -7px; right: -7px; cursor: nwse-resize; z-index: 10; display: none; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #stage[data-tool="select"] .embed.selected .embed-resize { display: block; }

  #videoLayer .video-obj { position: absolute; pointer-events: auto; display: flex; flex-direction: column; background: #000; border: 1px solid #4a7eff; border-radius: 6px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  #videoLayer .video-obj.selected { box-shadow: 0 0 0 3px rgba(74,126,255,.4), 0 6px 20px rgba(0,0,0,.4); }
  .video-obj .video-header { height: 24px; background: linear-gradient(180deg, #4a7eff, #3b6ee0); color: #fff; padding: 0 6px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; gap: 6px; cursor: move; user-select: none; flex-shrink: 0; opacity: 0; transition: opacity .15s; }
  #stage[data-tool="select"] .video-obj:hover .video-header,
  #stage[data-tool="select"] .video-obj.selected .video-header { opacity: 1; }
  #stage:not([data-tool="select"]) .video-header { pointer-events: none; }
  .video-obj .video-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: left; font-weight: 500; }
  .video-obj .video-close { background: rgba(0,0,0,.25); border: none; color: #fff; width: 18px; height: 18px; border-radius: 3px; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; display: flex; align-items: center; justify-content: center; }
  .video-obj .video-close:hover { background: rgba(0,0,0,.5); }
  .video-obj video { flex: 1; width: 100%; min-height: 0; background: #000; display: block; object-fit: contain; }
  #stage:not([data-tool="select"]) .video-obj video { pointer-events: none; }
  .video-obj .video-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 68px; height: 68px; border-radius: 50%; background: rgba(0,0,0,.55); border: 2.5px solid rgba(255,255,255,.9); color: #fff; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0 0 0 5px; z-index: 5; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 6px 22px rgba(0,0,0,.4); font-family: Arial, sans-serif; line-height: 1; }
  .video-obj .video-play-btn.hidden { opacity: 0; pointer-events: none; }
  .video-obj .video-resize { position: absolute; width: 14px; height: 14px; background: #4a7eff; border: 2px solid #fff; border-radius: 50%; bottom: -7px; right: -7px; cursor: nwse-resize; z-index: 10; display: none; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #stage[data-tool="select"] .video-obj.selected .video-resize { display: block; }
  .video-obj.video-error::after { content: '⚠ تعذّر تحميل الفيديو'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(0,0,0,.85); font-size: 12px; padding: 20px; text-align: center; }

  /* ===== TOOLBAR ===== */
  #toolbar {
    position: fixed; right: 10px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 3px;
    padding: 5px 4px;
    background: rgba(28,32,40,.94);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    z-index: 1000;
    max-height: 96vh;
    overflow-y: auto;
    overflow-x: hidden;
    /* ★ السماح بالتمرير العمودي باللمس دون اعتراضه */
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  #toolbar::-webkit-scrollbar { width: 5px; }
  #toolbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 3px; }

  #toolbar button {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; color: #d4d9e2;
    border: none; border-radius: 10px;
    font-size: 18px; cursor: pointer;
    transition: background .14s, color .14s;
    position: relative;
    flex-shrink: 0;
    /* ★ pan-y يسمح بالتمرير من فوق الزر */
    touch-action: pan-y;
  }
  #toolbar button:hover { background: rgba(255,255,255,.09); }
  #toolbar button.active { background: #4a7eff; color: #fff; }
  #toolbar button:disabled { opacity: .3; cursor: not-allowed; }
  #toolbar .tb-divider { height: 1px; background: rgba(255,255,255,.08); margin: 3px 6px; flex-shrink: 0; }
  #toolbar button[data-tool="pen"]::after,
  #toolbar button[data-tool="highlighter"]::after,
  #toolbar button[data-tool="laser"]::after { content: ''; position: absolute; bottom: 4px; right: 5px; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #1c2028; background: var(--indicator, transparent); }
  #toolbar button svg { width: 20px; height: 20px; fill: currentColor; display: block; }

  #submenu { position: fixed; right: 58px; display: none; flex-direction: column; min-width: 60px; padding: 7px 5px; background: rgba(28,32,40,.96); backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.5); z-index: 1001; touch-action: manipulation; }
  #submenu.show { display: flex; }
  .sub-label { font-size: 9px; color: #8a94a6; text-align: center; padding: 2px 0 4px; letter-spacing: .5px; font-weight: 600; }
  .sub-section { padding: 4px 0; }
  .sub-section + .sub-section { border-top: 1px solid rgba(255,255,255,.06); }
  .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 0 2px; }
  .color-btn { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center; margin: 2px auto; touch-action: manipulation; }
  .color-btn .swatch { width: 100%; height: 100%; border-radius: 50%; border: 1px solid rgba(0,0,0,.3); }
  .color-btn.active { border-color: #4a7eff; }
  .size-grid { display: flex; flex-direction: column; gap: 3px; align-items: center; padding: 2px 0; }
  .size-btn { width: 34px; height: 24px; background: rgba(255,255,255,.04); border: 1px solid transparent; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  .size-btn.active { border-color: #4a7eff; background: rgba(74,126,255,.15); }
  .size-btn .dot { border-radius: 50%; background: #d4d9e2; }
  .shape-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; padding: 0 2px; }
  .shape-btn { width: 30px; height: 30px; background: rgba(255,255,255,.04); border: 1px solid transparent; border-radius: 6px; color: #d4d9e2; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  .shape-btn.active { border-color: #4a7eff; background: rgba(74,126,255,.15); }
  .color-input-row { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 6px; }
  .color-input-row input[type="color"] { width: 32px; height: 26px; border: 1px solid rgba(255,255,255,.15); border-radius: 6px; padding: 1px; background: transparent; cursor: pointer; }
  .color-input-row label { font-size: 10px; color: #b8c0cc; cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .color-input-row input[type="checkbox"] { accent-color: #4a7eff; cursor: pointer; width: 14px; height: 14px; }

  /* ===== NAV BTNS: قريبة من الوسط ===== */
  .nav-btn {
    position: fixed; bottom: 22px;
    width: 54px; height: 54px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(28,32,40,.92);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 50%;
    color: #d4d9e2; font-size: 22px;
    cursor: pointer; z-index: 1000;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    touch-action: manipulation;
    user-select: none;
  }
  .nav-btn:disabled { opacity: .25; cursor: not-allowed; }
  /* 90px من الوسط لكل جهة → فراغ 72px بينهما */
  #btnPrev { left: calc(50% - 90px); }
  #btnNext { right: calc(50% - 90px); }

  .dialog-backdrop { position: fixed; inset: 0; z-index: 2000; background: rgba(10,12,16,.65); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; }
  .dialog { background: #1c2028; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 20px; width: 90%; max-width: 420px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .dialog h3 { font-size: 15px; margin-bottom: 12px; color: #fff; font-weight: 700; }
  .dialog p { font-size: 13px; color: #b8c0cc; line-height: 1.7; margin-bottom: 12px; }
  .dialog input[type="url"] { width: 100%; padding: 12px 14px; background: #0f1115; color: #eee; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; font-size: 15px; direction: ltr; text-align: left; outline: none; font-family: inherit; }
  .dialog-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
  .dialog-actions button { padding: 11px 18px; border-radius: 9px; font-size: 14px; font-family: inherit; cursor: pointer; font-weight: 600; border: 1px solid transparent; touch-action: manipulation; }
  .dialog-actions .btn-primary { background: #4a7eff; color: #fff; }
  .dialog-actions .btn-danger { background: #ef4444; color: #fff; }
  .dialog-actions .btn-secondary { background: transparent; color: #8a94a6; border-color: rgba(255,255,255,.12); }

  #emptyState { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #666; pointer-events: none; z-index: 20; font-size: 14px; }
  #emptyState .icon { font-size: 72px; opacity: .4; }
  #emptyState button { pointer-events: auto; padding: 13px 26px; background: #4a7eff; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-size: 15px; font-family: inherit; font-weight: 600; touch-action: manipulation; }

  #loading { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: #fff; background: rgba(15,17,21,.75); z-index: 100; backdrop-filter: blur(3px); }
  #loading.show { display: flex; }
  .spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,255,255,.12); border-top-color: #4a7eff; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ★ مؤشر الصفحة: أعلى يسار، صغير جداً */
  #pageIndicator {
    position: fixed; top: 10px; left: 10px;
    padding: 4px 10px;
    background: rgba(28,32,40,.85);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 8px;
    font-size: 10.5px; color: #8a94a6;
    font-variant-numeric: tabular-nums;
    z-index: 999; pointer-events: none;
    letter-spacing: .5px;
  }
  #pageIndicator:empty { display: none; }

  #saveStatus {
    position: fixed; top: 10px; left: 68px;
    padding: 4px 10px;
    background: rgba(28,32,40,.85);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 8px;
    font-size: 10px; color: #8a94a6;
    z-index: 999; pointer-events: none; opacity: 0; transition: opacity .25s;
  }
  #saveStatus.show { opacity: 1; }

  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 10px; background: rgba(28,32,40,.95); border: 1px solid rgba(255,255,255,.1); color: #fff; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 3000; pointer-events: none; }
  .toast.ok { border-color: rgba(34,197,94,.5); }
  .toast.warn { border-color: rgba(245,158,11,.5); }
  .toast.error { border-color: rgba(239,68,68,.55); }

  @media (max-width: 600px) {
    #toolbar { right: 6px; padding: 4px 3px; gap: 2px; }
    #toolbar button { width: 36px; height: 36px; font-size: 16px; }
    #toolbar button svg { width: 18px; height: 18px; }
    #submenu { right: 50px; }
    .nav-btn { width: 48px; height: 48px; font-size: 20px; bottom: 16px; }
    #btnPrev { left: calc(50% - 80px); }
    #btnNext { right: calc(50% - 80px); }
    #pageIndicator { font-size: 9.5px; padding: 3px 8px; }
    #saveStatus { left: 60px; font-size: 9px; }
  }
</style>
</head>
<body>

<div id="stageWrapper">
  <div id="stage" data-tool="select">
    <div id="stageContent">
      <canvas id="pdfCanvas"></canvas>
      <svg id="svgLayer" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="embedLayer"></div>
      <div id="videoLayer"></div>
      <canvas id="transientCanvas"></canvas>
      <canvas id="laserCanvas"></canvas>
    </div>
  </div>
  <div id="emptyState">
    <div class="icon">📄</div>
    <div>افتح ملف PDF للبدء</div>
    <button id="btnOpenEmpty">📂 اختر ملفاً</button>
  </div>
  <div id="loading"><div class="spinner"></div><div id="loadingText">جارٍ التحميل…</div></div>
</div>

<div id="pageIndicator"></div>
<div id="saveStatus"></div>

<div id="toolbar">
  <button data-tool="hand" title="يد — إصبعان للتكبير">🖐️</button>
  <button data-tool="pen" data-submenu="pen" title="قلم" style="--indicator:#000000">✏️</button>
  <button data-tool="highlighter" data-submenu="highlighter" title="قلم تحديد" style="--indicator:#eab308">🖍️</button>
  <button data-tool="eraser" data-submenu="eraser" title="ممحاة">🧽</button>
  <button data-tool="laser" data-submenu="laser" title="ليزر" style="--indicator:#ff0000">🔴</button>
  <button data-tool="shape" data-submenu="shape" title="أشكال">▭</button>
  <button data-tool="embed" title="تضمين صفحة ويب">🔗</button>
  <button data-tool="video" title="إضافة فيديو">🎬</button>
  <button data-tool="select" title="تحديد / تحريك">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 3.2 L18.8 12.2 L12.4 13.1 L15.6 20.2 L13.3 21.2 L10.2 14.2 L5.5 18.4 Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" fill="currentColor"/></svg>
  </button>
  <div class="tb-divider"></div>
  <button id="btnUndo" title="تراجع">↶</button>
  <button id="btnRedo" title="إعادة">↷</button>
  <div class="tb-divider"></div>
  <button id="btnResetZoom" title="إعادة ضبط التكبير">⛶</button>
  <button id="btnFullscreen" title="ملء الشاشة">🖥️</button>
  <button id="btnOpen" title="فتح ملف">📂</button>
  <div class="tb-divider"></div>
  <button id="btnSave" title="حفظ المشروع">💾</button>
  <button id="btnClearSaved" title="حذف المشروع المحفوظ">🗑️</button>
</div>

<div id="submenu"></div>
<button class="nav-btn" id="btnPrev" title="السابق">←</button>
<button class="nav-btn" id="btnNext" title="التالي">→</button>
<input type="file" id="fileInput" accept="application/pdf,image/*" style="display:none">

<script type="module">
/* ================================================================
   pdf.js v4.7.76
   ================================================================ */
const PDFJS_VERSION = '4.7.76';
const PDFJS_BASE = `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VERSION}`;
let pdfjsLib;
try {
  pdfjsLib = await import(`${PDFJS_BASE}/build/pdf.min.mjs`);
  pdfjsLib.GlobalWorkerOptions.workerSrc = `${PDFJS_BASE}/build/pdf.worker.min.mjs`;
} catch (err) { console.error('فشل تحميل pdf.js:', err); throw err; }

/* ================================================================
   CONSTANTS
   ================================================================ */
const LASER_LIFE_MS = 5000;
const LASER_FADE_MS = 1500;
const UNDO_LIMIT = 50;
const COORD_WIDTH = 2000;
const DB_NAME = 'interactive-pdf-board';
const DB_VERSION = 1;
const STORE_NAME = 'projects';
const PROJECT_KEY = 'current';
const CACHE_WIDTH = 2200;  /* دقة الكاش (JPEG) */

const $ = id => document.getElementById(id);
const stage = $('stage'), stageWrapper = $('stageWrapper'), stageContent = $('stageContent');
const pdfCanvas = $('pdfCanvas'), svgLayer = $('svgLayer'), embedLayer = $('embedLayer');
const videoLayer = $('videoLayer');
const transientCanvas = $('transientCanvas'), laserCanvas = $('laserCanvas');
const emptyState = $('emptyState'), loadingEl = $('loading'), loadingText = $('loadingText');
const pageIndicator = $('pageIndicator'), toolbar = $('toolbar'), submenu = $('submenu');
const fileInput = $('fileInput'), btnUndo = $('btnUndo'), btnRedo = $('btnRedo');
const btnPrev = $('btnPrev'), btnNext = $('btnNext');
const saveStatusEl = $('saveStatus');

const transCtx = transientCanvas.getContext('2d');
const laserCtx = laserCanvas.getContext('2d');
const SVG_NS = 'http://www.w3.org/2000/svg';

/* ================================================================
   STATE
   ================================================================ */
const state = {
  pdfDoc: null, currentPage: 1, totalPages: 0,
  pdfW: 0, pdfH: 0,
  canvasScale: 1, dpr: 1, cssW: 0, cssH: 0,
  stageRect0: { left: 0, top: 0, width: 0, height: 0 },
  view: { scale: 1, tx: 0, ty: 0 },
  pdfBlob: null, pdfName: '', pdfIsImage: false,
  pageCache: new Map(),          /* pageNum -> { dataUrl } */
  preloadToken: 0,
  tool: 'select',
  penColor: '#000000', penSize: 3,
  highlighterColor: '#eab308', highlighterSize: 16,
  eraserSize: 20, eraserErasesShapes: true,
  laserColor: '#ff0000', laserSize: 4,
  shapeKind: 'rect', shapeStroke: '#000000', shapeFill: '#ffffff',
  shapeFillNone: true, shapeSize: 3,
  selected: null, pages: {}, history: {},
};

const videoBlobs = new Map();

/* ================================================================
   HELPERS
   ================================================================ */
function uid() { return 'a' + Math.random().toString(36).slice(2, 9); }

/* ★ حساب مساحة PDF القصوى — مساحة صغيرة جداً لمؤشر الصفحة */
function computeStageSize(naturalW, naturalH) {
  const wrap = stageWrapper.getBoundingClientRect();
  /* الاحتفاظ بـ: 66px يمين للشريط، 80px أسفل للأزرار، 30px علوي لمؤشر الصفحة */
  const availW = Math.max(80, wrap.width - 12 - 66);
  const availH = Math.max(80, wrap.height - 30 - 80);
  const aspect = naturalW / naturalH;
  let cssW = availW, cssH = cssW / aspect;
  if (cssH > availH) { cssH = availH; cssW = cssH * aspect; }
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  let canvasW = Math.ceil(cssW * dpr), canvasH = Math.ceil(cssH * dpr);
  const maxPixels = 16 * 1024 * 1024;
  if (canvasW * canvasH > maxPixels) { const f = Math.sqrt(maxPixels / (canvasW * canvasH)); canvasW = Math.floor(canvasW * f); canvasH = Math.floor(canvasH * f); }
  return { cssW, cssH, canvasW, canvasH };
}
function updateStageRect0() {
  /* احسب موقع stage الأصلي (قبل التحويلات) في إحداثيات viewport */
  const wrap = stageWrapper.getBoundingClientRect();
  const cssW = state.cssW, cssH = state.cssH;
  state.stageRect0.left = wrap.left + (wrap.width - cssW) / 2;
  state.stageRect0.top = wrap.top + (wrap.height - cssH) / 2;
  state.stageRect0.width = cssW;
  state.stageRect0.height = cssH;
}
function applyView() {
  const { scale, tx, ty } = state.view;
  if (scale === 1 && tx === 0 && ty === 0) {
    stage.style.transform = '';
  } else {
    stage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }
}
function getVideoDimensions(url) {
  return new Promise((resolve) => {
    const v = document.createElement('video'); v.preload = 'metadata'; v.src = url;
    const done = (res) => { try { v.src = ''; } catch (_) {} resolve(res); };
    v.onloadedmetadata = () => done({ w: v.videoWidth || 1280, h: v.videoHeight || 720 });
    v.onerror = () => done({ w: 1280, h: 720 });
    setTimeout(() => done({ w: 1280, h: 720 }), 3000);
  });
}

/* ================================================================
   INDEXEDDB
   ================================================================ */
let _db = null;
function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME); };
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbDelete(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ================================================================
   SERIALIZATION
   ================================================================ */
function serializeSvgElement(el) {
  const tag = el.tagName.toLowerCase(); const attrs = {};
  for (let i = 0; i < el.attributes.length; i++) {
    const a = el.attributes[i];

    attrs[a.name] = a.value;
  }

}
function deserializeSvgElement(spec) {

  if (spec.shapeType) el.dataset.type = spec.shapeType;
  el.classList.add('annot');
  return el;
}
function serializeEmbed(el) { return { kind: 'embed', url: el.dataset.url, x: el.style.left, y: el.style.top, w: el.style.width, h: el.style.height }; }
function serializeVideo(el) { return { kind: 'video', videoId: el.dataset.videoId, url: el.dataset.url, title: el.dataset.title || '', x: el.style.left, y: el.style.top, w: el.style.width, h: el.style.height }; }
function snapshot() {
  const annotations = [];
  svgLayer.querySelectorAll('[data-annot]').forEach(el => {

    if (el.classList.contains('handle') || el.classList.contains('selection-outline')) return;
    annotations.push(serializeSvgElement(el));
  });
  const embeds = []; embedLayer.querySelectorAll('.embed').forEach(el => embeds.push(serializeEmbed(el)));
  const videos = []; videoLayer.querySelectorAll('.video-obj').forEach(el => videos.push(serializeVideo(el)));
  return { annotations, embeds, videos };
}
function applySnapshot(s) {
  deselect();
  while (svgLayer.firstChild) svgLayer.removeChild(svgLayer.firstChild);
  embedLayer.innerHTML = ''; videoLayer.innerHTML = '';
  (s.annotations || []).forEach(spec => { try { svgLayer.appendChild(deserializeSvgElement(spec)); } catch (e) {} });
  (s.embeds || []).forEach(spec => addEmbedElement(spec.url, spec.x, spec.y, spec.w, spec.h, false));
  (s.videos || []).forEach(spec => addVideoElement(spec.videoId, spec.url, spec.title, spec.x, spec.y, spec.w, spec.h, false));
}

/* ================================================================
   HISTORY
   ================================================================ */
function getHistory() { return state.history[state.currentPage] || (state.history[state.currentPage] = { past: [], future: [] }); }
function savePageNow() { if (state.currentPage) state.pages[state.currentPage] = snapshot(); }
function commitChange(pre) {
  if (!state.currentPage) return;
  const h = getHistory();
  h.past.push(pre || { annotations: [], embeds: [], videos: [] });
  if (h.past.length > UNDO_LIMIT) h.past.shift();
  h.future.length = 0; savePageNow(); updateUndoButtons();
  scheduleSave();
}
function updateUndoButtons() {
  const h = state.history[state.currentPage] || { past: [], future: [] };
  btnUndo.disabled = h.past.length === 0; btnRedo.disabled = h.future.length === 0;
}
function undo() {
  if (!state.currentPage) return;
  const h = getHistory(); if (!h.past.length) return;
  h.future.push(snapshot()); const p = h.past.pop();
  state.pages[state.currentPage] = p; applySnapshot(p); updateUndoButtons(); scheduleSave();
}
function redo() {
  if (!state.currentPage) return;
  const h = getHistory(); if (!h.future.length) return;
  h.past.push(snapshot()); const n = h.future.pop();
  state.pages[state.currentPage] = n; applySnapshot(n); updateUndoButtons(); scheduleSave();
}

/* ================================================================
   AUTO SAVE
   ================================================================ */
let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveProject().catch(e => console.warn('auto-save failed', e)); }, 800);
}
async function saveProject() {
  if (!state.pdfBlob) return false;
  savePageNow();
  const videoBlobsObj = {};
  videoBlobs.forEach((blob, id) => { videoBlobsObj[id] = blob; });
  const project = {
    pdfBlob: state.pdfBlob, pdfName: state.pdfName, pdfIsImage: state.pdfIsImage,
    totalPages: state.totalPages, currentPage: state.currentPage,
    pages: state.pages, videoBlobs: videoBlobsObj,
    savedAt: Date.now(), version: 1,
  };
  try {
    await idbPut(PROJECT_KEY, project);
    showSaveStatus('✓ محفوظ ' + new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }));
    return true;
  } catch (err) {
    console.error('save error', err);
    toast('فشل الحفظ: ' + err.message, 'error');
    return false;
  }
}
async function loadProject() {
  let project;
  try { project = await idbGet(PROJECT_KEY); } catch (e) { return false; }
  if (!project || !project.pdfBlob) return false;
  videoBlobs.clear();
  Object.keys(project.videoBlobs || {}).forEach(id => { videoBlobs.set(id, project.videoBlobs[id]); });
  state.pages = project.pages || {};
  state.history = {};
  state.pdfName = project.pdfName || 'document.pdf';
  state.pdfIsImage = !!project.pdfIsImage;
  try {
    const file = new File([project.pdfBlob], state.pdfName, { type: project.pdfBlob.type || 'application/pdf' });
    if (state.pdfIsImage) await loadImageFile(file, { keepPages: true, skipRender: true });
    else await loadPdfFile(file, { keepPages: true, skipRender: true });
    state.currentPage = project.currentPage || 1;
    await renderPage(state.currentPage);
    return true;
  } catch (err) { console.error('restore failed', err); return false; }
}
async function clearSavedProject() {
  try { await idbDelete(PROJECT_KEY); toast('تم حذف المشروع المحفوظ', 'ok'); }
  catch (e) { toast('تعذّر الحذف: ' + e.message, 'error'); }
}

/* ================================================================
   LASER
   ================================================================ */
const laserStrokes = []; let currentLaserStroke = null; let laserRAF = null; let laserLastActivity = 0;
function clearLaser() { laserStrokes.length = 0; currentLaserStroke = null; laserLastActivity = 0; laserCtx.clearRect(0, 0, laserCanvas.width, laserCanvas.height); }
function clearTransient() { transCtx.clearRect(0, 0, transientCanvas.width, transientCanvas.height); transientCanvas.style.opacity = '1'; }
function loadPageState(pageNum) {
  deselect(); clearLaser(); clearTransient();
  while (svgLayer.firstChild) svgLayer.removeChild(svgLayer.firstChild);
  embedLayer.innerHTML = ''; videoLayer.innerHTML = '';
  const s = state.pages[pageNum]; if (s) applySnapshot(s);
}
function startLaserRAF() { if (laserRAF) return; laserRAF = requestAnimationFrame(laserTick); }
function laserTick() {
  const now = performance.now();
  if (laserStrokes.length === 0) { laserRAF = null; return; }
  const age = now - laserLastActivity;
  let alpha = 1;
  if (age > LASER_LIFE_MS) alpha = Math.max(0, 1 - (age - LASER_LIFE_MS) / LASER_FADE_MS);
  laserCtx.setTransform(1, 0, 0, 1, 0, 0);
  laserCtx.clearRect(0, 0, laserCanvas.width, laserCanvas.height);
  if (alpha <= 0) { laserStrokes.length = 0; currentLaserStroke = null; laserRAF = null; return; }
  laserCtx.globalAlpha = alpha; laserCtx.lineCap = 'round'; laserCtx.lineJoin = 'round';
  const k = state.canvasScale;
  for (let i = 0; i < laserStrokes.length; i++) {
    const s = laserStrokes[i]; if (!s.points || s.points.length < 1) continue;
    laserCtx.shadowColor = s.color; laserCtx.shadowBlur = s.width * k * 2.5;
    laserCtx.strokeStyle = '#ffffff'; laserCtx.lineWidth = s.width * k;
    laserCtx.beginPath(); laserCtx.moveTo(s.points[0].x * k, s.points[0].y * k);
    if (s.points.length === 1) laserCtx.lineTo(s.points[0].x * k + 0.01, s.points[0].y * k);
    else for (let j = 1; j < s.points.length; j++) laserCtx.lineTo(s.points[j].x * k, s.points[j].y * k);
    laserCtx.stroke();
    laserCtx.shadowBlur = 0; laserCtx.shadowColor = 'transparent';
    laserCtx.strokeStyle = '#ffffff'; laserCtx.lineWidth = Math.max(1, s.width * k * 0.5);
    laserCtx.beginPath(); laserCtx.moveTo(s.points[0].x * k, s.points[0].y * k);
    for (let j = 1; j < s.points.length; j++) laserCtx.lineTo(s.points[j].x * k, s.points[j].y * k);
    laserCtx.stroke();
  }
  laserCtx.shadowBlur = 0; laserCtx.shadowColor = 'transparent'; laserCtx.globalAlpha = 1;
  laserRAF = requestAnimationFrame(laserTick);
}
function laserStart(p) { laserLastActivity = performance.now(); currentLaserStroke = { points: [p], color: state.laserColor, width: state.laserSize }; laserStrokes.push(currentLaserStroke); startLaserRAF(); }
function laserAdd(p) {
  if (!currentLaserStroke) return;
  const last = currentLaserStroke.points[currentLaserStroke.points.length - 1];
  if (Math.hypot(p.x - last.x, p.y - last.y) < 1.5) return;
  currentLaserStroke.points.push(p); laserLastActivity = performance.now();
}
function laserEnd() { currentLaserStroke = null; laserLastActivity = performance.now(); }

/* ================================================================
   RENDER PAGE (بدون إشارة تحميل إذا كان في الكاش)
   ================================================================ */
async function renderPage(pageNum) {
  if (!state.pdfDoc && !state.pdfIsImage) return;
  const hasCache = state.pageCache.has(pageNum);

  if (!hasCache) setLoading(true, 'جارٍ عرض الصفحة…');
  try {
    let vp1W, vp1H, aspect;

    if (state.pdfDoc) {
      const page = await state.pdfDoc.getPage(pageNum);
      const vp1 = page.getViewport({ scale: 1 });
      vp1W = vp1.width; vp1H = vp1.height; aspect = vp1.height / vp1.width;
    } else {
      /* وضع الصورة: use pdfBlob as image */
      vp1W = 1; vp1H = state.pdfH / state.pdfW;
      aspect = vp1H / vp1W;
    }

    state.pdfW = COORD_WIDTH;
    state.pdfH = Math.round(COORD_WIDTH * aspect);

    const { cssW, cssH, canvasW, canvasH } = computeStageSize(vp1W, vp1H);
    state.canvasScale = canvasW / state.pdfW;
    state.cssW = cssW; state.cssH = cssH;
    state.dpr = canvasW / cssW;
    stage.style.width = cssW + 'px'; stage.style.height = cssH + 'px';
    [pdfCanvas, transientCanvas, laserCanvas].forEach(c => { c.width = canvasW; c.height = canvasH; });
    svgLayer.setAttribute('viewBox', `0 0 ${state.pdfW} ${state.pdfH}`);

    const ctx = pdfCanvas.getContext('2d', { alpha: false });
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvasW, canvasH);

    const cached = state.pageCache.get(pageNum);
    if (cached) {
      /* ارسم من الكاش مباشرة — سريع جداً */
      const img = new Image();
      await new Promise(res => { img.onload = res; img.onerror = res; img.src = cached.dataUrl; });
      ctx.drawImage(img, 0, 0, canvasW, canvasH);
    } else if (state.pdfDoc) {
      /* ارسم من PDF */
      const page = await state.pdfDoc.getPage(pageNum);
      const vp1 = page.getViewport({ scale: 1 });
      const renderScale = canvasW / vp1.width;
      const viewport = page.getViewport({ scale: renderScale });
      await page.render({ canvasContext: ctx, viewport, background: '#ffffff' }).promise;
      /* خزّن في الكاش */
      try {
        const cc = document.createElement('canvas');
        const cw = Math.min(canvasW, CACHE_WIDTH);
        const ch = Math.round(cw * canvasH / canvasW);
        cc.width = cw; cc.height = ch;
        const cctx = cc.getContext('2d', { alpha: false });
        cctx.drawImage(pdfCanvas, 0, 0, cw, ch);
        state.pageCache.set(pageNum, { dataUrl: cc.toDataURL('image/jpeg', 0.82) });
      } catch (e) {}
    } else {
      /* صورة مفردة */
      const blob = state.pdfBlob;
      if (blob) {
        const url = URL.createObjectURL(blob);
        try {
          const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('x')); i.src = url; });
          ctx.drawImage(img, 0, 0, canvasW, canvasH);
        } finally { URL.revokeObjectURL(url); }
      }
    }

    /* حدّث موضع stage الأصلي للحسابات */
    updateStageRect0();
    applyView();

    loadPageState(pageNum);
    updatePageIndicator(); updateUndoButtons(); emptyState.style.display = 'none';
  } catch (err) {
    console.error(err);
    toast('تعذّر عرض الصفحة', 'error');
  } finally {
    if (!hasCache) setLoading(false);
  }
}

/* ================================================================
   PRELOAD ALL PAGES في الخلفية
   ================================================================ */
async function preloadAllPages(token) {
  if (!state.pdfDoc) return;
  const total = state.totalPages;
  for (let i = 1; i <= total; i++) {
    if (state.preloadToken !== token) return; /* أُلغي */
    if (state.pageCache.has(i)) continue;
    try {
      const page = await state.pdfDoc.getPage(i);
      const vp1 = page.getViewport({ scale: 1 });
      const cw = Math.min(CACHE_WIDTH, Math.max(1200, Math.round(vp1.width * 1.5)));
      const scale = cw / vp1.width;
      const viewport = page.getViewport({ scale });
      const cvs = document.createElement('canvas');
      cvs.width = Math.max(1, Math.floor(viewport.width));
      cvs.height = Math.max(1, Math.floor(viewport.height));
      const c = cvs.getContext('2d', { alpha: false });
      c.fillStyle = '#ffffff'; c.fillRect(0, 0, cvs.width, cvs.height);
      await page.render({ canvasContext: c, viewport }).promise;
      const dataUrl = cvs.toDataURL('image/jpeg', 0.82);
      if (state.preloadToken !== token) return;
      state.pageCache.set(i, { dataUrl });
      page.cleanup();
      /* تنفّس صغير */
      await new Promise(r => setTimeout(r, 0));
    } catch (e) { console.warn('preload page ' + i, e); }
  }
}

/* ================================================================
   LOAD PDF/IMAGE
   ================================================================ */
async function loadPdfFile(file, opts = {}) {
  setLoading(true, 'جارٍ قراءة الملف…');
  try {
    const buf = await file.arrayBuffer();
    const doc = await pdfjsLib.getDocument({
      data: buf, cMapUrl: `${PDFJS_BASE}/cmaps/`, cMapPacked: true,
      standardFontDataUrl: `${PDFJS_BASE}/standard_fonts/`, wasmUrl: `${PDFJS_BASE}/wasm/`,
      useSystemFonts: false, disableFontFace: false, isEvalSupported: false,
      fontExtraProperties: true, verbosity: 0,
    }).promise;
    state.pdfDoc = doc; state.totalPages = doc.numPages;
    state.pdfBlob = file; state.pdfName = file.name; state.pdfIsImage = false;
    state.pageCache.clear(); state.preloadToken++;
    const myToken = state.preloadToken;
    if (!opts.keepPages) {
      state.pages = {}; state.history = {}; state.currentPage = 1; state.selected = null;
    }
    if (!opts.skipRender) {
      updateUndoButtons();
      await renderPage(state.currentPage || 1);
      scheduleSave();
      /* ابدأ التحميل المسبق في الخلفية */
      preloadAllPages(myToken);
    }
  } catch (err) { console.error(err); setLoading(false); alert('تعذّر فتح PDF: ' + err.message); throw err; }
}
async function loadImageFile(file, opts = {}) {
  setLoading(true, 'جارٍ تحميل الصورة…');
  try {
    state.pdfDoc = null; state.totalPages = 1;
    state.pdfBlob = file; state.pdfName = file.name; state.pdfIsImage = true;
    state.pageCache.clear(); state.preloadToken++;
    if (!opts.keepPages) {
      state.pages = {}; state.history = {}; state.currentPage = 1;
    }
    if (!opts.skipRender) {
      await renderPage(1);
      scheduleSave();
    }
  } catch (err) { console.error(err); alert(err.message); throw err; }
  finally { setLoading(false); }
}
function updatePageIndicator() {
  if (!state.totalPages) { pageIndicator.textContent = ''; return; }
  pageIndicator.textContent = state.currentPage + ' / ' + state.totalPages;
  btnPrev.disabled = state.currentPage <= 1; btnNext.disabled = state.currentPage >= state.totalPages;
}

/* ================================================================
   NAVIGATION (بدون إشارة تحميل إذا كان في الكاش)
   ================================================================ */
let sliding = false;
async function goToPage(newPage, dir) {
  if (sliding || newPage < 1 || newPage > state.totalPages || newPage === state.currentPage) return;
  sliding = true; savePageNow(); scheduleSave();
  const w = stage.clientWidth * state.view.scale;
  const outX = dir === 'next' ? -w : w;
  stageContent.style.transition = 'transform .22s ease-out';
  stageContent.style.transform = `translateX(${outX}px)`;
  await new Promise(r => setTimeout(r, 200));
  state.currentPage = newPage;
  await renderPage(newPage);
  const inX = dir === 'next' ? w : -w;
  stageContent.style.transition = 'none';
  stageContent.style.transform = `translateX(${inX}px)`;
  void stageContent.offsetWidth;
  stageContent.style.transition = 'transform .22s ease-out';
  stageContent.style.transform = 'translateX(0)';
  setTimeout(() => { stageContent.style.transition = ''; stageContent.style.transform = ''; sliding = false; }, 240);
}

/* ★ bindPress محسّن: يكتشف السحب ويلغي الضغط */
function bindPress(el, handler) {
  const MOVE_THRESHOLD = 10;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const startX = e.clientX, startY = e.clientY;
    let moved = false;
    let longPressTimer = setTimeout(() => { moved = true; }, 600); /* ضغط طويل يُلغي أيضاً */

    const onMove = (ev) => {
      if (moved) return;
      if (Math.hypot(ev.clientX - startX, ev.clientY - startY) > MOVE_THRESHOLD) {
        moved = true;
        clearTimeout(longPressTimer);
      }
    };
    const onUp = (ev) => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      clearTimeout(longPressTimer);
      if (!moved) {
        try { e.preventDefault(); e.stopPropagation(); } catch (_) {}
        handler(e);
      }
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }, { passive: false });
}

toolbar.querySelectorAll('button').forEach(btn => {
  bindPress(btn, async () => {
    if (btn.id === 'btnUndo') { undo(); return; }
    if (btn.id === 'btnRedo') { redo(); return; }
    if (btn.id === 'btnResetZoom') { resetView(); return; }
    if (btn.id === 'btnFullscreen') { toggleFullscreen(); return; }
    if (btn.id === 'btnOpen') { fileInput.click(); return; }
    if (btn.id === 'btnSave') {
      const ok = await saveProject();
      if (ok) toast('تم حفظ المشروع ✅', 'ok');
      return;
    }
    if (btn.id === 'btnClearSaved') { confirmClearSaved(); return; }
    const tool = btn.dataset.tool; if (!tool) return;
    if (tool === 'embed') { openEmbedDialog(); return; }
    if (tool === 'video') { openVideoPicker(); return; }
    const wasActive = btn.classList.contains('active');
    const hasSub = btn.dataset.submenu;
    if (wasActive && hasSub && submenu.classList.contains('show')) { closeSubmenu(); return; }
    setTool(tool);
    if (hasSub) openSubmenu(btn, btn.dataset.submenu);
  });
});

function toggleFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen().catch(console.warn);
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen().catch(console.warn);
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}
function resetView() {
  state.view.scale = 1; state.view.tx = 0; state.view.ty = 0;
  applyView();

}
function confirmClearSaved() {
  const backdrop = document.createElement('div');
  backdrop.className = 'dialog-backdrop';
  backdrop.innerHTML = `<div class="dialog"><h3>🗑️ حذف المشروع المحفوظ</h3><p>سيتم حذف كل البيانات المحفوظة.</p><div class="dialog-actions"><button type="button" class="btn-secondary" data-action="cancel">إلغاء</button><button type="button" class="btn-danger" data-action="ok">حذف</button></div></div>`;
  document.body.appendChild(backdrop);
  bindPress(backdrop.querySelector('[data-action="cancel"]'), () => backdrop.remove());

}

function openVideoPicker() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'video/*'; input.multiple = true; input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) { input.remove(); return; }
    setLoading(true, 'جارٍ تجهيز الفيديوهات…');
    const pre = snapshot(); let placed = 0;
    try {
      for (let i = 0; i < files.length; i++) {
        const file = files[i]; if (!/^video\//i.test(file.type)) continue;
        try {
          const videoId = uid();
          videoBlobs.set(videoId, file);
          const blobUrl = URL.createObjectURL(file);
          const dims = await getVideoDimensions(blobUrl);
          const targetW = state.pdfW * 0.55, ratio = dims.h / dims.w;
          let wPct = (targetW / state.pdfW) * 100, hPct = (targetW * ratio / state.pdfH) * 100;
          if (hPct > 60) { hPct = 60; wPct = (hPct / 100 * state.pdfH) / (ratio * state.pdfW) * 100; }
          addVideoElement(videoId, blobUrl, file.name || 'فيديو', (22 + (i%3)*4) + '%', (18 + (i%3)*4) + '%', wPct + '%', hPct + '%', false);
          placed++;
        } catch (err) { console.warn(err); }
      }
      if (placed > 0) { commitChange(pre); toast(`تمت إضافة ${placed} فيديو ✅`, 'ok'); setTool('select'); }
      else toast('لم يتم اختيار أي فيديو صالح', 'warn');
    } finally { setLoading(false); input.remove(); }
  });
  input.click();
}

      const pad = 8;
      return { x: Math.min(x1,x2)-pad, y: Math.min(y1,y2)-pad, width: Math.abs(x2-x1)+pad*2, height: Math.abs(y2-y1)+pad*2 };

  rect.setAttribute('class', 'selection-outline'); g.appendChild(rect);
  const hs = Math.max(6, state.pdfW / 140);

function distToSegment(px, py, x1, y1, x2, y2) {

  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t*dx), py - (y1 + t*dy));
}

  for (let i = 0; i < 48; i++) { const t = (i / 48) * Math.PI * 2; const x = cx + rx * Math.cos(t), y = cy + ry * Math.sin(t); const d = Math.hypot(px - x, py - y); if (d < minD) minD = d; }
  return minD;
}

stage.addEventListener('pointerdown', e => {

  const t = map[e.key.toLowerCase()]; if (t) setTool(t);
  if (e.key === 'ArrowRight') goToPage(state.currentPage + 1, 'next');
  if (e.key === 'ArrowLeft') goToPage(state.currentPage - 1, 'prev');
});

bindPress($('btnOpenEmpty'), () => fileInput.click());
fileInput.addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) await loadPdfFile(f);
    else if (/^image\//.test(f.type)) await loadImageFile(f);
    else alert('نوع الملف غير مدعوم');
  } catch (err) { console.error(err); alert('خطأ: ' + err.message); }
  fileInput.value = '';
});

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());
document.addEventListener('pointerdown', e => {
  if (submenu.classList.contains('show') && !submenu.contains(e.target) && !toolbar.contains(e.target)) closeSubmenu();
}, true);

window.addEventListener('beforeunload', () => { if (state.pdfBlob) { try { saveProject(); } catch (_) {} } });

/* ================================================================
   INIT + AUTO-RESTORE
   ================================================================ */
(async () => {
  setTool('select');
  updateToolbarIndicators();
  updateUndoButtons();
  updatePageIndicator();
  try {
    const ok = await loadProject();
    if (ok) toast('تم استعادة المشروع المحفوظ ✅', 'ok');
  } catch (err) { console.warn('restore failed', err); }
})();

</script>
</body>
</html>
