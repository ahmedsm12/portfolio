<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>لوحة PDF التفاعلية</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body { height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: #0f1115; color: #eee; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  :root { --tb-btn-size: 38px; }
  #stageWrapper { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #0f1115; }
  #stage { position: relative; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.7); overflow: hidden; touch-action: none; border-radius: 4px; transform-origin: 0 0; }
  #stageContent { position: absolute; inset: 0; }
  #stageContent > * { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #pdfCanvas { z-index: 1; pointer-events: none; }
  #svgLayer  { z-index: 2; pointer-events: none; }
  #embedLayer { z-index: 3; pointer-events: none; }
  #videoLayer { z-index: 4; pointer-events: none; }
  #transientCanvas { z-index: 5; pointer-events: none; }
  #laserCanvas { z-index: 6; pointer-events: none; }

  #stage[data-tool="hand"] { cursor: grab; }
  #stage[data-tool="hand"].dragging { cursor: grabbing; }
  #stage[data-tool="rect"], #stage[data-tool="circle"], #stage[data-tool="line"] { cursor: crosshair; }
  #svgLayer [data-annot] { pointer-events: none; }
  #stage[data-tool="select"] #svgLayer [data-annot] { pointer-events: auto; cursor: move; }
  .annot { vector-effect: non-scaling-stroke; }
  .selection-outline { fill: none; stroke: #4a7eff; stroke-width: 1.5; stroke-dasharray: 5 3; vector-effect: non-scaling-stroke; pointer-events: none; }
  .handle { fill: #fff; stroke: #4a7eff; stroke-width: 2; vector-effect: non-scaling-stroke; cursor: pointer; pointer-events: auto; }
  .handle.nw, .handle.se { cursor: nwse-resize; }
  .handle.ne, .handle.sw { cursor: nesw-resize; }

  #embedLayer .embed { position: absolute; pointer-events: auto; display: flex; flex-direction: column; background: #fff; border: 1px solid #4a7eff; border-radius: 3px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  #embedLayer .embed.selected { box-shadow: 0 0 0 2px rgba(74,126,255,.35), 0 2px 8px rgba(0,0,0,.2); }
  .embed-header { height: 22px; background: #4a7eff; color: #fff; padding: 0 5px; font-size: 10px; display: flex; justify-content: space-between; align-items: center; gap: 4px; cursor: move; user-select: none; flex-shrink: 0; opacity: 0; transition: opacity .15s; }
  #stage[data-tool="select"] .embed:hover .embed-header,
  #stage[data-tool="select"] .embed.selected .embed-header { opacity: 1; }
  #stage:not([data-tool="select"]) .embed-header { pointer-events: none; }
  .embed-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: left; font-weight: 500; }
  .embed-close { background: rgba(0,0,0,.25); border: none; color: #fff; width: 18px; height: 18px; border-radius: 3px; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; display: flex; align-items: center; justify-content: center; }
  .embed iframe { flex: 1; border: none; background: #fff; width: 100%; min-height: 0; display: block; }
  #stage:not([data-tool="select"]) .embed iframe { pointer-events: none; }
  .embed-resize { position: absolute; width: 14px; height: 14px; background: #4a7eff; border: 2px solid #fff; border-radius: 50%; bottom: -7px; right: -7px; cursor: nwse-resize; z-index: 10; display: none; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #stage[data-tool="select"] .embed.selected .embed-resize { display: block; }

  #videoLayer .video-obj { position: absolute; pointer-events: auto; display: flex; flex-direction: column; background: #000; border: 1px solid #4a7eff; border-radius: 6px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  #videoLayer .video-obj.selected { box-shadow: 0 0 0 3px rgba(74,126,255,.4), 0 6px 20px rgba(0,0,0,.4); }
  .video-obj .video-header { height: 24px; background: linear-gradient(180deg, #4a7eff, #3b6ee0); color: #fff; padding: 0 6px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; gap: 6px; cursor: move; user-select: none; flex-shrink: 0; opacity: 0; transition: opacity .15s; }
  #stage[data-tool="select"] .video-obj:hover .video-header,
  #stage[data-tool="select"] .video-obj.selected .video-header { opacity: 1; }
  #stage:not([data-tool="select"]) .video-header { pointer-events: none; }
  .video-obj .video-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: left; font-weight: 500; }
  .video-obj .video-close { background: rgba(0,0,0,.25); border: none; color: #fff; width: 18px; height: 18px; border-radius: 3px; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; display: flex; align-items: center; justify-content: center; }
  .video-obj video { flex: 1; width: 100%; min-height: 0; background: #000; display: block; object-fit: contain; }
  #stage:not([data-tool="select"]) .video-obj video { pointer-events: none; }
  .video-obj .video-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 68px; height: 68px; border-radius: 50%; background: rgba(0,0,0,.55); border: 2.5px solid rgba(255,255,255,.9); color: #fff; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0 0 0 5px; z-index: 5; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 6px 22px rgba(0,0,0,.4); line-height: 1; }
  .video-obj .video-play-btn.hidden { opacity: 0; pointer-events: none; }
  .video-obj .video-resize { position: absolute; width: 14px; height: 14px; background: #4a7eff; border: 2px solid #fff; border-radius: 50%; bottom: -7px; right: -7px; cursor: nwse-resize; z-index: 10; display: none; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #stage[data-tool="select"] .video-obj.selected .video-resize { display: block; }
  .video-obj.video-error::after { content: '⚠ تعذّر تحميل الفيديو'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(0,0,0,.85); font-size: 12px; padding: 20px; text-align: center; }

  #toolbar {
    position: fixed; right: 10px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 3px;
    padding: 5px 4px;
    background: rgba(28,32,40,.94);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    z-index: 1000;
    touch-action: manipulation;
  }
  #toolbar button {
    width: var(--tb-btn-size); height: var(--tb-btn-size);
    display: flex; align-items: center; justify-content: center;
    background: transparent; color: #d4d9e2;
    border: none; border-radius: 10px;
    font-size: calc(var(--tb-btn-size) * 0.45);
    cursor: pointer; transition: background .14s, color .14s;
    position: relative; flex-shrink: 0;
    touch-action: manipulation;
  }
  #toolbar button:hover { background: rgba(255,255,255,.09); }
  #toolbar button.active { background: #4a7eff; color: #fff; }
  #toolbar button:disabled { opacity: .3; cursor: not-allowed; }
  #toolbar .tb-divider { height: 1px; background: rgba(255,255,255,.08); margin: 2px 6px; flex-shrink: 0; }
  #toolbar button[data-tool="pen"]::after,
  #toolbar button[data-tool="highlighter"]::after,
  #toolbar button[data-tool="laser"]::after { content: ''; position: absolute; bottom: 3px; right: 4px; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #1c2028; background: var(--indicator, transparent); }
  #toolbar button svg { width: calc(var(--tb-btn-size) * 0.5); height: calc(var(--tb-btn-size) * 0.5); fill: currentColor; display: block; }

  /* ===== SUBMENU ===== */
  #submenu {
    position: fixed; right: 58px;
    display: none; flex-direction: column;
    min-width: 88px; padding: 6px 5px;
    background: rgba(28,32,40,.97);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    z-index: 1001; touch-action: manipulation;
    max-height: 92vh; overflow-y: auto; overflow-x: hidden;
    scrollbar-width: thin;
  }
  #submenu::-webkit-scrollbar { width: 4px; }
  #submenu::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 2px; }
  #submenu.show { display: flex; }
  .sub-label { font-size: 9px; color: #8a94a6; text-align: center; padding: 3px 0 4px; letter-spacing: .5px; font-weight: 600; }
  .sub-section { padding: 4px 0; }
  .sub-section + .sub-section { border-top: 1px solid rgba(255,255,255,.06); }
  .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 0 3px; }
  .color-btn { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center; margin: 2px auto; touch-action: manipulation; }
  .color-btn .swatch { width: 100%; height: 100%; border-radius: 50%; border: 1px solid rgba(0,0,0,.3); }
  .color-btn.active { border-color: #4a7eff; }
  /* شفاف checkered */
  .color-btn.transparent .swatch {
    background-image:
      linear-gradient(45deg, #666 25%, transparent 25%),
      linear-gradient(-45deg, #666 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #666 75%),
      linear-gradient(-45deg, transparent 75%, #666 75%);
    background-size: 8px 8px;
    background-position: 0 0, 0 4px, 4px -4px, -4px 0;
    background-color: #fff;
  }
  .size-grid { display: flex; flex-direction: column; gap: 3px; align-items: center; padding: 2px 0; }
  .size-btn { width: 42px; height: 24px; background: rgba(255,255,255,.04); border: 1px solid transparent; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; font-size: 10px; color: #d4d9e2; font-family: inherit; padding: 0; }
  .size-btn.active { border-color: #4a7eff; background: rgba(74,126,255,.15); }
  .size-btn .dot { border-radius: 50%; background: #d4d9e2; }
  .shape-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; padding: 0 2px; }
  .shape-btn { width: 30px; height: 30px; background: rgba(255,255,255,.04); border: 1px solid transparent; border-radius: 6px; color: #d4d9e2; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; padding: 0; }
  .shape-btn.active { border-color: #4a7eff; background: rgba(74,126,255,.15); }
  .color-input-row { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 6px; }
  .color-input-row input[type="color"] { width: 32px; height: 26px; border: 1px solid rgba(255,255,255,.15); border-radius: 6px; padding: 1px; background: transparent; cursor: pointer; }
  .color-input-row label { font-size: 10px; color: #b8c0cc; cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .color-input-row input[type="checkbox"] { accent-color: #4a7eff; cursor: pointer; width: 14px; height: 14px; }

  /* Smoothing grid */
  .smooth-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 3px; padding: 0 3px; }
  .smooth-btn {
    height: 26px; padding: 0;
    background: rgba(255,255,255,.04);
    border: 1px solid transparent; border-radius: 6px;
    color: #d4d9e2; cursor: pointer;
    font-size: 11px; font-family: inherit; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
  }
  .smooth-btn.active { border-color: #4a7eff; background: rgba(74,126,255,.15); }

  /* Close button in submenu */
  .submenu-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px 4px; border-bottom: 1px solid rgba(255,255,255,.06);
    margin-bottom: 4px;
  }
  .submenu-head .sub-title { font-size: 10.5px; color: #b8c0cc; font-weight: 700; padding-right: 4px; }
  .submenu-head .sub-close {
    width: 20px; height: 20px; border-radius: 4px;
    background: rgba(255,255,255,.06); border: none;
    color: #b8c0cc; cursor: pointer; font-size: 14px; line-height: 1;
    display: flex; align-items: center; justify-content: center; padding: 0;
    touch-action: manipulation;
  }
  .submenu-head .sub-close:hover { background: rgba(255,80,80,.3); color: #fff; }

  /* ===== BOTTOM BAR ===== */
  #bottomBar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px;
    background: rgba(28,32,40,.94);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    z-index: 1000; touch-action: manipulation;
  }
  #bottomBar button {
    padding: 7px 16px; border-radius: 999px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    color: #d4d9e2; font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background .15s, color .15s;
    touch-action: manipulation; white-space: nowrap;
  }
  #bottomBar button:hover:not(:disabled) { background: rgba(255,255,255,.12); }
  #bottomBar button:disabled { opacity: .3; cursor: not-allowed; }
  #pageIndicator {
    min-width: 46px; text-align: center;
    font-variant-numeric: tabular-nums;
    color: #b8c0cc; font-size: 12px;
    padding: 0 6px; user-select: none;
  }
  #pageIndicator:empty { display: none; }

  #saveStatus {
    position: fixed; top: 10px; left: 10px;
    padding: 4px 10px;
    background: rgba(28,32,40,.85);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 8px;
    font-size: 10px; color: #8a94a6;
    z-index: 999; pointer-events: none; opacity: 0; transition: opacity .25s;
  }
  #saveStatus.show { opacity: 1; }

  .dialog-backdrop { position: fixed; inset: 0; z-index: 2000; background: rgba(10,12,16,.65); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; }
  .dialog { background: #1c2028; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 20px; width: 90%; max-width: 420px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .dialog h3 { font-size: 15px; margin-bottom: 12px; color: #fff; font-weight: 700; }
  .dialog p { font-size: 13px; color: #b8c0cc; line-height: 1.7; margin-bottom: 12px; }
  .dialog input[type="url"] { width: 100%; padding: 12px 14px; background: #0f1115; color: #eee; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; font-size: 15px; direction: ltr; text-align: left; outline: none; font-family: inherit; }
  .dialog-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
  .dialog-actions button { padding: 11px 18px; border-radius: 9px; font-size: 14px; font-family: inherit; cursor: pointer; font-weight: 600; border: 1px solid transparent; touch-action: manipulation; }
  .dialog-actions .btn-primary { background: #4a7eff; color: #fff; }
  .dialog-actions .btn-danger { background: #ef4444; color: #fff; }
  .dialog-actions .btn-secondary { background: transparent; color: #8a94a6; border-color: rgba(255,255,255,.12); }

  #emptyState { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #666; pointer-events: none; z-index: 20; font-size: 14px; }
  #emptyState .icon { font-size: 72px; opacity: .4; }
  #emptyState button { pointer-events: auto; padding: 13px 26px; background: #4a7eff; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-size: 15px; font-family: inherit; font-weight: 600; touch-action: manipulation; }

  #loading { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: #fff; background: rgba(15,17,21,.75); z-index: 100; backdrop-filter: blur(3px); }
  #loading.show { display: flex; }
  .spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,255,255,.12); border-top-color: #4a7eff; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 10px; background: rgba(28,32,40,.95); border: 1px solid rgba(255,255,255,.1); color: #fff; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 3000; pointer-events: none; }
  .toast.ok { border-color: rgba(34,197,94,.5); }
  .toast.warn { border-color: rgba(245,158,11,.5); }
  .toast.error { border-color: rgba(239,68,68,.55); }

  @media (max-width: 600px) {
    #toolbar { right: 6px; padding: 4px 3px; gap: 2px; }
    #submenu { right: 50px; min-width: 82px; }
    #bottomBar button { padding: 6px 12px; font-size: 12px; }
    #bottomBar { bottom: 12px; gap: 4px; padding: 5px 6px; }
    #pageIndicator { font-size: 11px; min-width: 42px; }
  }
</style>
</head>
<body>

<div id="stageWrapper">
  <div id="stage" data-tool="select">
    <div id="stageContent">
      <canvas id="pdfCanvas"></canvas>
      <svg id="svgLayer" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="embedLayer"></div>
      <div id="videoLayer"></div>
      <canvas id="transientCanvas"></canvas>
      <canvas id="laserCanvas"></canvas>
    </div>
  </div>
  <div id="emptyState">
    <div class="icon">📄</div>
    <div>افتح ملف PDF للبدء</div>
    <button id="btnOpenEmpty">📂 اختر ملفاً</button>
  </div>
  <div id="loading"><div class="spinner"></div><div id="loadingText">جارٍ التحميل…</div></div>
</div>

<div id="saveStatus"></div>

<div id="toolbar">
  <button data-tool="hand" title="يد — إصبعان للتكبير">🖐️</button>
  <button data-tool="pen" data-submenu="pen" title="قلم" style="--indicator:#000000">✏️</button>
  <button data-tool="highlighter" data-submenu="highlighter" title="قلم تحديد" style="--indicator:#eab308">🖍️</button>
  <button data-tool="eraser" data-submenu="eraser" title="ممحاة">🧽</button>
  <button data-tool="laser" data-submenu="laser" title="ليزر" style="--indicator:#ff0000">🔴</button>
  <button data-tool="shape" data-submenu="shape" title="أشكال">▭</button>
  <button data-tool="embed" title="تضمين صفحة ويب">🔗</button>
  <button data-tool="video" title="إضافة فيديو">🎬</button>
  <button data-tool="select" title="تحديد / تحريك">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 3.2 L18.8 12.2 L12.4 13.1 L15.6 20.2 L13.3 21.2 L10.2 14.2 L5.5 18.4 Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" fill="currentColor"/></svg>
  </button>
  <div class="tb-divider"></div>
  <button id="btnUndo" title="تراجع">↶</button>
  <button id="btnRedo" title="إعادة">↷</button>
  <div class="tb-divider"></div>
  <button id="btnResetZoom" title="إعادة ضبط التكبير">🔄</button>
  <button id="btnFullscreen" title="ملء الشاشة">⛶</button>
  <button id="btnOpen" title="فتح ملف">📂</button>
  <div class="tb-divider"></div>
  <button id="btnExport" title="تصدير PDF">⬇️</button>
  <button id="btnSave" title="حفظ المشروع">💾</button>
  <button id="btnClearSaved" title="حذف المشروع المحفوظ">🗑️</button>
</div>

<div id="submenu"></div>

<div id="bottomBar">
  <button id="btnPrev">السابق</button>
  <span id="pageIndicator"></span>
  <button id="btnNext">التالي</button>
</div>

<input type="file" id="fileInput" accept="application/pdf,image/*" style="display:none">

<script type="module">
const PDFJS_VERSION = '4.7.76';
const PDFJS_BASE = `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VERSION}`;
let pdfjsLib;
try {
  pdfjsLib = await import(`${PDFJS_BASE}/build/pdf.min.mjs`);
  pdfjsLib.GlobalWorkerOptions.workerSrc = `${PDFJS_BASE}/build/pdf.worker.min.mjs`;
} catch (err) { console.error('فشل تحميل pdf.js:', err); throw err; }

const LASER_FADE_MS = 1500;
const UNDO_LIMIT = 50;
const COORD_WIDTH = 2000;
const DB_NAME = 'interactive-pdf-board';
const DB_VERSION = 1;
const STORE_NAME = 'projects';
const PROJECT_KEY = 'current';
const CACHE_WIDTH = 2200;

const $ = id => document.getElementById(id);
const stage = $('stage'), stageWrapper = $('stageWrapper'), stageContent = $('stageContent');
const pdfCanvas = $('pdfCanvas'), svgLayer = $('svgLayer'), embedLayer = $('embedLayer');
const videoLayer = $('videoLayer');
const transientCanvas = $('transientCanvas'), laserCanvas = $('laserCanvas');
const emptyState = $('emptyState'), loadingEl = $('loading'), loadingText = $('loadingText');
const pageIndicator = $('pageIndicator'), toolbar = $('toolbar'), submenu = $('submenu');
const fileInput = $('fileInput'), btnUndo = $('btnUndo'), btnRedo = $('btnRedo');
const btnPrev = $('btnPrev'), btnNext = $('btnNext');
const saveStatusEl = $('saveStatus');

const transCtx = transientCanvas.getContext('2d');
const laserCtx = laserCanvas.getContext('2d');
const SVG_NS = 'http://www.w3.org/2000/svg';

const state = {
  pdfDoc: null, currentPage: 1, totalPages: 0,
  pdfW: 0, pdfH: 0,
  canvasScale: 1, dpr: 1, cssW: 0, cssH: 0,
  stageRect0: { left: 0, top: 0, width: 0, height: 0 },
  view: { scale: 1, tx: 0, ty: 0 },
  pdfBlob: null, pdfName: '', pdfIsImage: false,
  pageCache: new Map(), preloadToken: 0,

}
async function svgStrToPngDataUrl(svgStr, targetW, targetH) {

  const img = await loadImageFromUrl(dataUrl);
  if (!img) return null;
  const cv = document.createElement('canvas');
  cv.width = targetW; cv.height = targetH;
  cv.getContext('2d').drawImage(img, 0, 0, targetW, targetH);

async function exportAnnotatedPdf() {
  if (!state.pdfBlob) { toast('لا يوجد ملف مفتوح', 'warn'); return; }
  savePageNow();
  setLoading(true, 'جارٍ تجهيز PDF…');
  try {
    const jsPDF = await getJsPDF();
    let pageW, pageH;
    if (state.pdfDoc) {
      const page = await state.pdfDoc.getPage(1);
      const vp = page.getViewport({ scale: 1 });
      pageW = vp.width; pageH = vp.height;
    } else { pageW = state.pdfW * 0.75; pageH = state.pdfH * 0.75; }
    const pdf = new jsPDF({ unit: 'pt', format: [pageW, pageH], orientation: pageW > pageH ? 'landscape' : 'portrait', compress: true });
    const strokeScale = state.cssW > 0 ? state.pdfW / state.cssW : 1;
    const EXPORT_IMG_W = 1600;
    for (let i = 1; i <= state.totalPages; i++) {
      if (i > 1) pdf.addPage([pageW, pageH]);
      let pageImg = state.pageCache.get(i) && state.pageCache.get(i).dataUrl;
      if (!pageImg && state.pdfDoc) {
        const page = await state.pdfDoc.getPage(i);
        const vp = page.getViewport({ scale: 1 });
        const scale = EXPORT_IMG_W / vp.width;
        const viewport = page.getViewport({ scale });
        const cv = document.createElement('canvas');
        cv.width = Math.floor(viewport.width); cv.height = Math.floor(viewport.height);
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
        await page.render({ canvasContext: ctx, viewport }).promise;
        pageImg = cv.toDataURL('image/jpeg', 0.9);
      }
      if (pageImg) pdf.addImage(pageImg, 'JPEG', 0, 0, pageW, pageH);
      const saved = state.pages[i];
      if (saved && saved.annotations && saved.annotations.length) {
        const svgStr = buildAnnotationSvg(saved.annotations, state.pdfW, state.pdfH, strokeScale);
        const pngUrl = await svgStrToPngDataUrl(svgStr, EXPORT_IMG_W, Math.round(EXPORT_IMG_W * state.pdfH / state.pdfW));
        if (pngUrl) pdf.addImage(pngUrl, 'PNG', 0, 0, pageW, pageH);
      }
      if (saved) {
        (saved.embeds || []).forEach(spec => {
          const x = parseFloat(spec.x) / 100 * pageW, y = parseFloat(spec.y) / 100 * pageH;
          const w = parseFloat(spec.w) / 100 * pageW, h = parseFloat(spec.h) / 100 * pageH;
          pdf.setDrawColor(74, 126, 255); pdf.setLineWidth(1); pdf.setFillColor(240, 245, 255);
          pdf.roundedRect(x, y, w, h, 4, 4, 'FD');
          pdf.setTextColor(74, 126, 255); pdf.setFontSize(11);
          pdf.text('Embed: ' + (spec.url || ''), x + 8, y + 16, { maxWidth: w - 16 });
        });
        (saved.videos || []).forEach(spec => {
          const x = parseFloat(spec.x) / 100 * pageW, y = parseFloat(spec.y) / 100 * pageH;
          const w = parseFloat(spec.w) / 100 * pageW, h = parseFloat(spec.h) / 100 * pageH;
          pdf.setDrawColor(74, 126, 255); pdf.setFillColor(20, 20, 20);
          pdf.roundedRect(x, y, w, h, 6, 6, 'FD');
          pdf.setTextColor(255, 255, 255); pdf.setFontSize(11);
          pdf.text('Video: ' + (spec.title || 'فيديو'), x + 8, y + 16, { maxWidth: w - 16 });
        });
      }
    }
    const outName = (state.pdfName || 'document').replace(/\.(pdf|jpg|jpeg|png|webp|gif)$/i, '') + '-annotated.pdf';
    pdf.save(outName);
    toast('تم تصدير PDF ✅', 'ok');
  } catch (err) { console.error(err); toast('تعذّر التصدير: ' + err.message, 'error'); }
  finally { setLoading(false); }
}

function setTool(tool) {

  state.tool = tool; stage.dataset.tool = tool;

  updateCursorForTool();

function bindPress(el, handler) {
  const MOVE_THRESHOLD = 10;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const startX = e.clientX, startY = e.clientY;
    let moved = false;
    const t = setTimeout(() => { moved = true; }, 700);
    const onMove = (ev) => {
      if (moved) return;
      if (Math.hypot(ev.clientX - startX, ev.clientY - startY) > MOVE_THRESHOLD) { moved = true; clearTimeout(t); }
    };
    const onUp = (ev) => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      clearTimeout(t);
      if (!moved) { try { e.preventDefault(); e.stopPropagation(); } catch (_) {} handler(e); }
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }, { passive: false });
}

  if (!center || dist < 5) return;
  const s0 = pinchState.initialScale;
  const newScale = Math.min(5, Math.max(0.5, s0 * (dist / pinchState.initialDist)));
  const R0 = state.stageRect0;
  const ux = (pinchState.initialCenterX - R0.left - pinchState.initialTx) / s0;
  const uy = (pinchState.initialCenterY - R0.top - pinchState.initialTy) / s0;
  state.view.scale = newScale;
  state.view.tx = center.x - R0.left - ux * newScale;
  state.view.ty = center.y - R0.top - uy * newScale;
  applyView();
}
function endPinch() { pinchState = null; }
function cancelInteraction() {
  if (interaction) {
    if (interaction.type === 'stroke') { interaction = null; clearTransient(); if (strokeRAF) { cancelAnimationFrame(strokeRAF); strokeRAF = null; } }
    else interaction = null;
  }
  handDrag = null; stage.classList.remove('dragging');
}

/* ========== POINTER EVENTS ========== */
stage.addEventListener('pointerdown', e => {
  if (!state.pdfW) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.target.closest && (e.target.closest('.embed') || e.target.closest('.video-obj'))) return;
  stagePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (state.tool === 'hand' && stagePointers.size === 2) {
    cancelInteraction(); startPinch();
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault(); return;
  }
  if (stagePointers.size > 1) return;
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  const p = getStagePoint(e), tool = state.tool;

  if (tool === 'hand') {
    if (state.view.scale > 1.02) {
      interaction = { type: 'pan', startX: e.clientX, startY: e.clientY, startTx: state.view.tx, startTy: state.view.ty };
    } else {
      stage.classList.add('dragging');
      handDrag = { startX: e.clientX, dx: 0 };
      interaction = { type: 'hand' };
    }
    e.preventDefault(); return;
  }
  if (tool === 'select') {
    const handle = e.target.closest && e.target.closest('.handle');
    if (handle && state.selected && state.selected.kind === 'svg') {
      interaction = { type: 'resizeSvg', el: state.selected.el, handle: handle.dataset.handle, start: p, pre: snapshot() };
      e.preventDefault(); return;
    }
    const annot = e.target.closest && e.target.closest('[data-annot]');
    if (annot && annot.tagName.toLowerCase() !== 'g' && !annot.classList.contains('handle')) {
      selectAnnotation(annot);
      interaction = { type: 'moveSvg', el: annot, start: p, orig: captureSvgGeom(annot), pre: snapshot() };
      e.preventDefault(); return;
    }
    deselect(); return;
  }
  if (tool === 'pen') { startStroke('pen', p); e.preventDefault(); return; }
  if (tool === 'highlighter') { startStroke('highlighter', p); e.preventDefault(); return; }
  if (tool === 'eraser') { startStroke('eraser', p); e.preventDefault(); return; }
  if (tool === 'laser') { laserStart(p); interaction = { type: 'laser' }; e.preventDefault(); return; }
  if (tool === 'shape') {
    const pre = snapshot();
    const el = createShapeElement(state.shapeKind);
    if (state.shapeKind === 'rect') { el.setAttribute('x', p.x); el.setAttribute('y', p.y); el.setAttribute('width', 0); el.setAttribute('height', 0); }
    else if (state.shapeKind === 'circle') { el.setAttribute('cx', p.x); el.setAttribute('cy', p.y); el.setAttribute('rx', 0); el.setAttribute('ry', 0); }
    else { el.setAttribute('x1', p.x); el.setAttribute('y1', p.y); el.setAttribute('x2', p.x); el.setAttribute('y2', p.y); }
    svgLayer.appendChild(el);
    interaction = { type: 'shapeDraw', kind: state.shapeKind, start: p, el, pre };
    e.preventDefault(); return;
  }
});

stage.addEventListener('pointermove', e => {
  if (stagePointers.has(e.pointerId)) stagePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinchState && stagePointers.size >= 2) { updatePinch(); e.preventDefault(); return; }
  if (!interaction) return;
  if (interaction.type === 'stroke') { appendStrokePoints(e); return; }
  const p = getStagePoint(e);
  if (interaction.type === 'pan') { state.view.tx = interaction.startTx + (e.clientX - interaction.startX); state.view.ty = interaction.startTy + (e.clientY - interaction.startY); applyView(); return; }
  if (interaction.type === 'hand' && handDrag) { handDrag.dx = e.clientX - handDrag.startX; stageContent.style.transition = 'none'; stageContent.style.transform = `translateX(${handDrag.dx}px)`; return; }
  if (interaction.type === 'laser') { laserAdd(p); return; }
  if (interaction.type === 'shapeDraw') {
    const el = interaction.el, s = interaction.start;
    if (interaction.kind === 'rect') { el.setAttribute('x', Math.min(s.x, p.x)); el.setAttribute('y', Math.min(s.y, p.y)); el.setAttribute('width', Math.abs(p.x - s.x)); el.setAttribute('height', Math.abs(p.y - s.y)); }
    else if (interaction.kind === 'circle') { el.setAttribute('cx', (s.x + p.x) / 2); el.setAttribute('cy', (s.y + p.y) / 2); el.setAttribute('rx', Math.abs(p.x - s.x) / 2); el.setAttribute('ry', Math.abs(p.y - s.y) / 2); }
    else { el.setAttribute('x2', p.x); el.setAttribute('y2', p.y); }
    return;
  }
  if (interaction.type === 'moveSvg') { applySvgGeom(interaction.el, interaction.orig, p.x - interaction.start.x, p.y - interaction.start.y); drawSelectionOverlay(interaction.el); return; }
  if (interaction.type === 'resizeSvg') { resizeSvg(interaction.el, interaction.handle, interaction.start, p); drawSelectionOverlay(interaction.el); return; }
});

stage.addEventListener('pointerup', e => {
  stagePointers.delete(e.pointerId);
  if (pinchState && stagePointers.size < 2) { endPinch(); try { stage.releasePointerCapture(e.pointerId); } catch (_) {} return; }
  if (!interaction) return;
  const inter = interaction;
  try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
  if (inter.type === 'stroke') { endStroke(); return; }
  interaction = null;
  if (inter.type === 'pan') return;
  if (inter.type === 'hand' && handDrag) {
    stage.classList.remove('dragging');
    const dx = handDrag.dx, w = stage.clientWidth, thr = w * 0.15;
    handDrag = null;
    if (dx < -thr && state.currentPage < state.totalPages) goToPage(state.currentPage + 1);
    else if (dx > thr && state.currentPage > 1) goToPage(state.currentPage - 1);
    else {
      stageContent.style.transition = 'transform .2s ease'; stageContent.style.transform = 'translateX(0)';
      setTimeout(() => { stageContent.style.transition = ''; stageContent.style.transform = ''; }, 220);
    }
    return;
  }
  if (inter.type === 'laser') { laserEnd(); return; }
  if (inter.type === 'shapeDraw') {
    const el = inter.el, kind = inter.kind;
    let tooSmall = false;
    if (kind === 'rect') { if (+el.getAttribute('width') < 15 || +el.getAttribute('height') < 15) tooSmall = true; }
    else if (kind === 'circle') { if (+el.getAttribute('rx') < 10 || +el.getAttribute('ry') < 10) tooSmall = true; }
    else { if (Math.hypot(+el.getAttribute('x2') - +el.getAttribute('x1'), +el.getAttribute('y2') - +el.getAttribute('y1')) < 20) tooSmall = true; }
    if (tooSmall) el.remove();
    else { el.dataset.annot = '1'; el.dataset.id = uid(); el.dataset.type = kind; commitChange(inter.pre); }
    return;
  }
  if (inter.type === 'moveSvg' || inter.type === 'resizeSvg') commitChange(inter.pre);
});
stage.addEventListener('pointercancel', e => {
  stagePointers.delete(e.pointerId);
  if (pinchState && stagePointers.size < 2) endPinch();
  if (interaction && interaction.type === 'stroke') { interaction = null; clearTransient(); if (strokeRAF) { cancelAnimationFrame(strokeRAF); strokeRAF = null; } }
});

function getStagePoint(e) {
  const r = stage.getBoundingClientRect();
  return { x: ((e.clientX - r.left) / r.width) * state.pdfW, y: ((e.clientY - r.top) / r.height) * state.pdfH };
}

/* ========== SVG GEOMETRY ========== */
function captureSvgGeom(el) {
  const g = {};
  ['x','y','width','height','cx','cy','rx','ry','x1','y1','x2','y2'].forEach(a => { const v = el.getAttribute(a); if (v !== null) g[a] = parseFloat(v); });
  const t = el.getAttribute('transform');
  if (t) { const m = t.match(/translate\(\s*(-?[\d.]+)[ ,]+(-?[\d.]+)\s*\)/); if (m) { g.tx = parseFloat(m[1]); g.ty = parseFloat(m[2]); } }
  g._tag = el.tagName; return g;
}
function applySvgGeom(el, orig, dx, dy) {
  const t = orig._tag;
  if (t === 'rect') { el.setAttribute('x', orig.x + dx); el.setAttribute('y', orig.y + dy); }
  else if (t === 'ellipse') { el.setAttribute('cx', orig.cx + dx); el.setAttribute('cy', orig.cy + dy); }
  else if (t === 'line') { el.setAttribute('x1', orig.x1 + dx); el.setAttribute('y1', orig.y1 + dy); el.setAttribute('x2', orig.x2 + dx); el.setAttribute('y2', orig.y2 + dy); }
  else if (t === 'path') { el.setAttribute('transform', `translate(${(orig.tx||0) + dx}, ${(orig.ty||0) + dy})`); }
}
function resizeSvg(el, handle, startPt, p) {
  const tag = el.tagName, g = captureSvgGeom(el);
  const dx = p.x - startPt.x, dy = p.y - startPt.y;
  if (tag === 'rect') {
    if (handle === 'se') { el.setAttribute('width', Math.max(5, g.width + dx)); el.setAttribute('height', Math.max(5, g.height + dy)); }
    else if (handle === 'nw') { el.setAttribute('x', g.x + dx); el.setAttribute('y', g.y + dy); el.setAttribute('width', Math.max(5, g.width - dx)); el.setAttribute('height', Math.max(5, g.height - dy)); }
    else if (handle === 'ne') { el.setAttribute('y', g.y + dy); el.setAttribute('width', Math.max(5, g.width + dx)); el.setAttribute('height', Math.max(5, g.height - dy)); }
    else if (handle === 'sw') { el.setAttribute('x', g.x + dx); el.setAttribute('width', Math.max(5, g.width - dx)); el.setAttribute('height', Math.max(5, g.height + dy)); }
  } else if (tag === 'ellipse') {
    if (handle === 'se') { el.setAttribute('rx', Math.max(3, g.rx + dx/2)); el.setAttribute('ry', Math.max(3, g.ry + dy/2)); el.setAttribute('cx', g.cx + dx/2); el.setAttribute('cy', g.cy + dy/2); }
    else if (handle === 'nw') { el.setAttribute('rx', Math.max(3, g.rx - dx/2)); el.setAttribute('ry', Math.max(3, g.ry - dy/2)); el.setAttribute('cx', g.cx + dx/2); el.setAttribute('cy', g.cy + dy/2); }
    else if (handle === 'ne') { el.setAttribute('rx', Math.max(3, g.rx + dx/2)); el.setAttribute('ry', Math.max(3, g.ry - dy/2)); el.setAttribute('cx', g.cx + dx/2); el.setAttribute('cy', g.cy + dy/2); }
    else if (handle === 'sw') { el.setAttribute('rx', Math.max(3, g.rx - dx/2)); el.setAttribute('ry', Math.max(3, g.ry + dy/2)); el.setAttribute('cx', g.cx + dx/2); el.setAttribute('cy', g.cy + dy/2); }
  } else if (tag === 'line') {
    if (handle === 'se') { el.setAttribute('x2', g.x2 + dx); el.setAttribute('y2', g.y2 + dy); }
    else if (handle === 'nw') { el.setAttribute('x1', g.x1 + dx); el.setAttribute('y1', g.y1 + dy); }
    else if (handle === 'ne') { el.setAttribute('x2', g.x2 + dx); el.setAttribute('y1', g.y1 + dy); }
    else if (handle === 'sw') { el.setAttribute('x1', g.x1 + dx); el.setAttribute('y2', g.y2 + dy); }
  }
}

/* ========== NAV + KEYBOARD + FILES ========== */
bindPress(btnPrev, () => goToPage(state.currentPage - 1));
bindPress(btnNext, () => goToPage(state.currentPage + 1));

document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) { e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveProject().then(ok => ok && toast('تم الحفظ ✅', 'ok')); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (state.selected) {
      const pre = snapshot(); const sel = state.selected;
      if (sel.kind === 'svg') sel.el.remove();
      if (sel.kind === 'embed') sel.el.remove();
      if (sel.kind === 'video') { try { const v = sel.el.querySelector('video'); if (v) { v.pause(); v.src = ''; } } catch (_) {} sel.el.remove(); }
      state.selected = null; svgLayer.querySelectorAll('.selection-overlay').forEach(n => n.remove());
      commitChange(pre); e.preventDefault();
    }
    return;
  }
  if (e.key === 'Escape') { deselect(); closeSubmenu(); return; }
  const map = { h: 'hand', v: 'select', p: 'pen', m: 'highlighter', e: 'eraser', a: 'laser', s: 'shape' };
  const t = map[e.key.toLowerCase()]; if (t) {
    const btn = toolbar.querySelector(`button[data-tool="${t}"]`);
    if (btn && btn.dataset.submenu) { setTool(t); openSubmenu(btn, t); }
    else setTool(t);
  }
  if (e.key === 'ArrowRight') goToPage(state.currentPage + 1);
  if (e.key === 'ArrowLeft') goToPage(state.currentPage - 1);
});

bindPress($('btnOpenEmpty'), () => fileInput.click());
fileInput.addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) await loadPdfFile(f);
    else if (/^image\//.test(f.type)) await loadImageFile(f);
    else alert('نوع الملف غير مدعوم');
  } catch (err) { console.error(err); alert('خطأ: ' + err.message); }
  fileInput.value = '';
});

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());

window.addEventListener('beforeunload', () => { if (state.pdfBlob) { try { saveProject(); } catch (_) {} } });

/* ========== INIT ========== */
(async () => {
  adjustToolbarSize();
  setTool('select');
  updateToolbarIndicators();
  updateUndoButtons();
  updatePageIndicator();
  try { const ok = await loadProject(); if (ok) toast('تم استعادة المشروع المحفوظ ✅', 'ok'); }
  catch (err) { console.warn('restore failed', err); }
})();

</script>
</body>
