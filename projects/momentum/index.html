<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختر بطاقة</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      padding: 20px;
    }

    .cards-container {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      position: relative;
      width: 300px;
      height: 400px;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      text-decoration: none;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.03);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover img {
      transform: scale(1.1);
    }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.1) 60%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 25px;
      color: #fff;
    }

    .card-overlay h2 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .card-overlay p {
      font-size: 0.95rem;
      opacity: 0.85;
      margin-bottom: 15px;
    }

    .card-overlay span {
      display: inline-block;
      padding: 8px 20px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 30px;
      font-size: 0.85rem;
      backdrop-filter: blur(6px);
      transition: background 0.3s;
    }

    .card:hover .card-overlay span {
      background: rgba(255, 255, 255, 0.35);
    }

    @media (max-width: 700px) {
      .card { width: 100%; max-width: 340px; height: 380px; }
    }
  </style>
</head>
<body>

  <div class="cards-container">

    <!-- البطاقة الأولى -->
    <a href="https://ahmedsm12.github.io/portfolio/projects/momentum/02" target="_blank" rel="noopener noreferrer" class="card">
      <img src="https://ahmedsm12.github.io/portfolio/projects/momentum/01.png" alt="الزخم الخطي">
      <div class="card-overlay">
        <h2>الزخم الخطي</h2>
        <p>تجربة للتعرف على مفهوم الزخم الخطي</p>
        <span>ابدأ بالتجربة ←</span>
      </div>
    </a>

    <!-- البطاقة الثانية -->
    <a href="https://ahmedsm12.github.io/portfolio/projects/momentum/02" target="_blank" rel="noopener noreferrer" class="card">
      <img src="https://ahmedsm12.github.io/portfolio/projects/momentum/02.png" alt=" حفظ الزخم الخطي">
      <div class="card-overlay">
        <h2>حفظ الزخم الخطي</h2>
        <p>تجربة للتحقق من حفظ الزخم الخطي</p>
        <span>ابدأ التجربة ←</span>
      </div>
    </a>

  </div>

</body>
</html>
